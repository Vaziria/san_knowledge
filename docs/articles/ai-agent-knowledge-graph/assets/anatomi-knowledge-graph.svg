<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="1520" height="940" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Knowledge graph proyek dibangun dari heading dan link yang sudah ada">
