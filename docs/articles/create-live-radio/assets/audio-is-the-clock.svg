  <text x="340.0" y="357" font-size="10.5" fill="#5f5f5f" text-anchor="middle">5 s</text>
  <text x="530.0" y="357" font-size="10.5" fill="#5f5f5f" text-anchor="middle">10 s</text>
  <text x="720.0" y="357" font-size="10.5" fill="#5f5f5f" text-anchor="middle">15 s</text>
