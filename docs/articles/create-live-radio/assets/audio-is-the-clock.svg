<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="1520" height="768" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Suara adalah jam bagi siaran">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="384" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Tanpa suara, encoder berhenti membuat siaran</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Dua percobaan 15 detik. Garis hitam adalah waktu siaran yang sudah dibuat ffmpeg.</text>
