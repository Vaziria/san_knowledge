  <rect x="150.0" y="108" width="190.0" height="20" rx="3" fill="#f1f0eb" stroke="#a8a69c"/>
  <text x="245.0" y="122" font-size="11" fill="#1f1f1f" text-anchor="middle">lagu 1</text>
  <rect x="340.0" y="108" width="190.0" height="20" rx="3" fill="none" stroke="#a8a69c" stroke-dasharray="4 3"/>
  <text x="435.0" y="122" font-size="11" fill="#5f5f5f" text-anchor="middle">tidak ada suara</text>
  <rect x="530.0" y="108" width="190.0" height="20" rx="3" fill="#f1f0eb" stroke="#a8a69c"/>
  <text x="625.0" y="122" font-size="11" fill="#1f1f1f" text-anchor="middle">lagu 2</text>
  <text x="24" y="168" font-size="11.5" fill="#5f5f5f" text-anchor="start">waktu siaran</text>
  <line x1="150.0" y1="196" x2="720.0" y2="196" stroke="#a8a69c"/>
