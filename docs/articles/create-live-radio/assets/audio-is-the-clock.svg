  <text x="435.0" y="169.33333333333334" font-size="11.5" fill="#1f1f1f" text-anchor="middle" font-weight="600">siaran macet</text>
  <text x="150.0" y="211" font-size="10.5" fill="#5f5f5f" text-anchor="middle">0 s</text>
  <text x="340.0" y="211" font-size="10.5" fill="#5f5f5f" text-anchor="middle">5 s</text>
  <text x="530.0" y="211" font-size="10.5" fill="#5f5f5f" text-anchor="middle">10 s</text>
  <text x="720.0" y="211" font-size="10.5" fill="#5f5f5f" text-anchor="middle">15 s</text>
  <text x="24" y="236" font-size="12" fill="#1f1f1f" text-anchor="start" font-weight="600">Dengan hening</text>
  <text x="24" y="268" font-size="11.5" fill="#5f5f5f" text-anchor="start">suara ke stdin</text>
  <rect x="150.0" y="254" width="190.0" height="20" rx="3" fill="#f1f0eb" stroke="#a8a69c"/>
  <text x="245.0" y="268" font-size="11" fill="#1f1f1f" text-anchor="middle">lagu 1</text>
  <rect x="340.0" y="254" width="190.0" height="20" rx="3" fill="#e3edfa" stroke="#2f76d6" stroke-width="1.5"/>
  <text x="435.0" y="268" font-size="11" fill="#2f76d6" text-anchor="middle" font-weight="600">hening dari pengumpan</text>
  <rect x="530.0" y="254" width="190.0" height="20" rx="3" fill="#f1f0eb" stroke="#a8a69c"/>
  <text x="625.0" y="268" font-size="11" fill="#1f1f1f" text-anchor="middle">lagu 2</text>
  <text x="24" y="314" font-size="11.5" fill="#5f5f5f" text-anchor="start">waktu siaran</text>
