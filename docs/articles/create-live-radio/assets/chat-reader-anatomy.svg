<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="1520" height="580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Anatomi pembaca live chat">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="290" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Tiga panggilan API, dan hanya yang terakhir yang diulang terus</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Kotak biru dipanggil berulang-ulang selama siaran live. Garis putus-putus kembali ke awal.</text>
  <rect x="24" y="112" width="128" height="96" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="88.0" y="138.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1f">search.list</text>
  <text x="88.0" y="155.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">channel yang live</text>
  <text x="88.0" y="172.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">kuota sendiri,</text>
  <text x="88.0" y="189.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">100 sehari</text>
  <rect x="170" y="112" width="128" height="96" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="234.0" y="147.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1f">videos.list</text>
  <text x="234.0" y="164.0" text-anchor="middle" font-size="11.5" fill="#5f5f5f">ID live chat</text>
  <text x="234.0" y="181.0" text-anchor="middle" font-size="11.5" fill="#5f5f5f">1 unit</text>
  <rect x="316" y="112" width="128" height="96" rx="8" fill="#e3edfa" stroke="#2f76d6" stroke-width="2"/>
  <text x="380.0" y="138.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1f">liveChatMessages</text>
  <text x="380.0" y="155.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">.list</text>
  <text x="380.0" y="172.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">pageToken, 5 unit</text>
  <text x="380.0" y="189.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">jeda dari budget</text>
  <rect x="462" y="112" width="128" height="96" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="526.0" y="147.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1f">Diperiksa</text>
  <text x="526.0" y="164.0" text-anchor="middle" font-size="11.5" fill="#5f5f5f">link, emoji,</text>
  <text x="526.0" y="181.0" text-anchor="middle" font-size="11.5" fill="#5f5f5f">kata terlarang</text>
  <rect x="608" y="112" width="128" height="96" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="672.0" y="147.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1f">Antrean</text>
  <text x="672.0" y="164.0" text-anchor="middle" font-size="11.5" fill="#5f5f5f">terminal</text>
  <text x="672.0" y="181.0" text-anchor="middle" font-size="11.5" fill="#5f5f5f">greet, Hello!</text>
  <path d="M152 160H170" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M298 160H316" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M444 160H462" fill="none" stroke="#2f76d6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M590 160H608" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M352 112C352 82 408 82 408 112" fill="none" stroke="#2f76d6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="380" y="78" font-size="11" fill="#2f76d6" text-anchor="middle" font-weight="600">diulang selama live</text>
  <path d="M380 208V250H88V208" fill="none" stroke="#a8a69c" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="234" y="268" font-size="11" fill="#5f5f5f" text-anchor="middle">siaran selesai atau belum live, cari lagi setelah 1 sampai 15 menit</text>
  <path d="M420 208V236H672V208" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="546" y="252" font-size="11" fill="#5f5f5f" text-anchor="middle">tombstone dan ban, hapus dari layar</text>
