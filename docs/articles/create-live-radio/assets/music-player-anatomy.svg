<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="1520" height="660" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Anatomi pemutar musik">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Suara berjalan dari folder musik ke encoder lewat empat bagian</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Garis biru adalah suara. Garis putus-putus adalah encoder yang dijalankan lagi saat berhenti.</text>
  <rect x="160" y="76" width="428" height="152" rx="10" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="176" y="98" font-size="12" fill="#1f1f1f" text-anchor="start" font-weight="600">Program Go</text>
  <rect x="24" y="112" width="116" height="92" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="82.0" y="136.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1f">Folder musik</text>
  <text x="82.0" y="153.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">01 lagu.wav</text>
  <text x="82.0" y="170.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">02 lagu.wav</text>
  <text x="82.0" y="187.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">dibaca ulang</text>
  <rect x="176" y="112" width="124" height="100" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="238.0" y="140.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1f">Playlist</text>
  <text x="238.0" y="157.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">satu ffmpeg</text>
  <text x="238.0" y="174.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">decoder per lagu</text>
  <text x="238.0" y="191.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">→ PCM</text>
  <rect x="316" y="112" width="124" height="100" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="378.0" y="149.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1f">Channel Go</text>
  <text x="378.0" y="166.0" text-anchor="middle" font-size="11.5" fill="#5f5f5f">40 potong × 50 ms</text>
  <text x="378.0" y="183.0" text-anchor="middle" font-size="11.5" fill="#5f5f5f">= 2 detik suara</text>
  <rect x="456" y="112" width="116" height="100" rx="8" fill="#e3edfa" stroke="#2f76d6" stroke-width="2"/>
  <text x="514.0" y="149.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1f">Pengumpan</text>
  <text x="514.0" y="166.0" text-anchor="middle" font-size="11.5" fill="#5f5f5f">mengikuti jam</text>
  <text x="514.0" y="183.0" text-anchor="middle" font-size="11.5" fill="#5f5f5f">+ hening</text>
  <rect x="612" y="104" width="124" height="108" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="674.0" y="136.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1f">ffmpeg encoder</text>
  <text x="674.0" y="153.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">suara dari stdin</text>
  <text x="674.0" y="170.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">video latar</text>
  <text x="674.0" y="187.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">diulang</text>
  <rect x="612" y="258" width="124" height="46" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="674.0" y="285.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1f">YouTube atau file</text>
  <path d="M140 158H176" fill="none" stroke="#2f76d6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M300 162H316" fill="none" stroke="#2f76d6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M440 162H456" fill="none" stroke="#2f76d6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M572 162H612" fill="none" stroke="#2f76d6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="592" y="154" font-size="10.5" fill="#5f5f5f" text-anchor="middle">stdin</text>
  <path d="M674 212V258" fill="none" stroke="#2f76d6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M612 196H596V270H380V228" fill="none" stroke="#a8a69c" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="488" y="290" font-size="11" fill="#5f5f5f" text-anchor="middle">encoder yang berhenti dijalankan lagi,</text>
  <text x="488" y="305" font-size="11" fill="#5f5f5f" text-anchor="middle">jeda 5 detik sampai 1 menit</text>
</svg>
