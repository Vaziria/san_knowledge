<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="1520" height="688" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Rantai yang menyalakan radio">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="344" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Setiap mata rantai menyalakan lagi mata rantai sesudahnya</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Dari kiri ke kanan, apa yang menyalakan radio saat Raspberry Pi menyala.</text>
  <rect x="24" y="104" width="128" height="84" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="88.0" y="133.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1f">cron</text>
  <text x="88.0" y="150.0" text-anchor="middle" font-size="11.5" fill="#5f5f5f">@reboot</text>
  <text x="88.0" y="167.0" text-anchor="middle" font-size="11.5" fill="#5f5f5f">sekali saat menyala</text>
  <rect x="170" y="104" width="128" height="84" rx="8" fill="#e3edfa" stroke="#2f76d6" stroke-width="2"/>
  <text x="234.0" y="133.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1f">jalan.sh</text>
  <text x="234.0" y="150.0" text-anchor="middle" font-size="11.5" fill="#5f5f5f">flock, rahasia.env,</text>
  <text x="234.0" y="167.0" text-anchor="middle" font-size="11.5" fill="#5f5f5f">ulangi setiap 10 s</text>
  <rect x="316" y="104" width="128" height="84" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="380.0" y="141.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1f">radioku</text>
  <text x="380.0" y="158.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">musik, layar, chat</text>
  <rect x="462" y="104" width="128" height="84" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="526.0" y="141.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1f">ffmpeg</text>
  <text x="526.0" y="158.5" text-anchor="middle" font-size="11.5" fill="#5f5f5f">encoder</text>
  <rect x="608" y="104" width="128" height="84" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="672.0" y="150.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1f1f">YouTube</text>
  <path d="M152 146H170" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M298 146H316" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M444 146H462" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M590 146H608" fill="none" stroke="#2f76d6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M352 188V222H234V188" fill="none" stroke="#a8a69c" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="293" y="240" font-size="11" fill="#5f5f5f" text-anchor="middle">dijalankan lagi oleh jalan.sh</text>
  <path d="M526 188V222H408V188" fill="none" stroke="#a8a69c" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="467" y="240" font-size="11" fill="#5f5f5f" text-anchor="middle">dijalankan lagi oleh radioku</text>
  <rect x="316" y="268" width="420" height="52" rx="8" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="330" y="290" font-size="11.5" fill="#1f1f1f" text-anchor="start">Kalau radioku mati, OS menutup stdin milik ffmpeg.</text>
  <text x="330" y="308" font-size="11.5" fill="#5f5f5f" text-anchor="start">ffmpeg melihat suaranya habis, dan ikut berhenti karena -shortest.</text>
