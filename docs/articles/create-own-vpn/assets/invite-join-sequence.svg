<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="1520" height="1000" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Undangan membawa komputer baru masuk tanpa menyalin kunci">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Undangan membawa komputer baru masuk tanpa menyalin kunci</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Yang berpindah hanya undangan dan public key. Private key komputer baru tidak pernah meninggalkan komputer itu.</text>

  <!-- The three sides -->
  <g stroke="#a8a69c" stroke-width="1.25" fill="#f1f0eb">
    <rect x="40" y="76" width="180" height="40" rx="8"/>
    <rect x="290" y="76" width="180" height="40" rx="8"/>
    <rect x="540" y="76" width="180" height="40" rx="8"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1f1f1f">
    <text x="130" y="101">Admin</text>
    <text x="380" y="101">Komputer baru</text>
    <text x="630" y="101">Relay</text>
  </g>
  <g stroke="#a8a69c" stroke-width="1" stroke-dasharray="4 4">
    <line x1="130" y1="116" x2="130" y2="470"/>
    <line x1="380" y1="116" x2="380" y2="470"/>
    <line x1="630" y1="116" x2="630" y2="470"/>
  </g>

  <!-- Notes on the lifelines, drawn before the arrows -->
  <g stroke="#a8a69c" stroke-width="1.25" fill="#ffffff">
    <rect x="300" y="226" width="160" height="40" rx="6"/>
    <rect x="550" y="324" width="160" height="56" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#1f1f1f">
    <text x="380" y="243">3. membuat sepasang kunci</text>
    <text x="380" y="258" fill="#5f5f5f">private key tetap di sini</text>
    <text x="630" y="341">5. token cocok, belum</text>
    <text x="630" y="356">kedaluwarsa? beri alamat,</text>
    <text x="630" y="371">hapus undangan</text>
  </g>

  <!-- Keeps the first label readable where it crosses the middle lifeline -->
  <rect x="190" y="128" width="380" height="19" fill="#ffffff"/>

  <!-- Messages -->
  <g fill="none" stroke-width="1.5">
    <path d="M130 150H630" stroke="#a8a69c" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <path d="M130 200H380" stroke="#2f76d6" marker-end="url(#arrow-blue)"/>
    <path d="M380 300H630" stroke="#2f76d6" marker-end="url(#arrow-blue)"/>
    <path d="M630 410H380" stroke="#a8a69c" marker-end="url(#arrow)"/>
    <path d="M380 450H630" stroke="#a8a69c" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#1f1f1f">
    <text x="380" y="142">1. relay undang kantor: hash token disimpan di relay.json</text>
    <text x="255" y="182">2. undangan, dikirim seperti password</text>
    <text x="255" y="218" font-size="11" fill="#5f5f5f">alamat relay, public key relay, token</text>
    <text x="505" y="292">4. token dan public key, lewat HTTPS</text>
    <text x="505" y="402">6. nama kantor, alamat 10.10.0.2</text>
    <text x="505" y="442">7. terhubung dengan bukti kunci</text>
  </g>
</svg>
