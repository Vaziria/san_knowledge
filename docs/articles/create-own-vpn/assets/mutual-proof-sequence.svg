<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="1520" height="1040" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Anggota dan relay saling membuktikan kepemilikan kunci">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Anggota dan relay saling membuktikan kepemilikan kunci</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Private key tidak pernah dikirim. Keduanya menghitung shared secret yang sama dari kunci masing-masing.</text>

  <!-- The two sides -->
  <g stroke="#a8a69c" stroke-width="1.25" fill="#f1f0eb">
    <rect x="60" y="76" width="200" height="40" rx="8"/>
    <rect x="500" y="76" width="200" height="40" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="160" y="101" font-weight="600" fill="#1f1f1f">Anggota</text>
    <text x="600" y="101" font-weight="600" fill="#1f1f1f">Relay</text>
    <text x="160" y="136" font-size="11" fill="#5f5f5f">memegang private key anggota</text>
    <text x="160" y="151" font-size="11" fill="#5f5f5f">tahu public key relay</text>
    <text x="600" y="136" font-size="11" fill="#5f5f5f">memegang private key relay</text>
    <text x="600" y="151" font-size="11" fill="#5f5f5f">tahu public key semua anggota</text>
  </g>
  <g stroke="#a8a69c" stroke-width="1" stroke-dasharray="4 4">
    <line x1="160" y1="160" x2="160" y2="450"/>
    <line x1="600" y1="160" x2="600" y2="450"/>
  </g>

  <!-- Messages -->
  <g fill="none" stroke-width="1.5">
    <path d="M600 194H160" stroke="#a8a69c" marker-end="url(#arrow)"/>
    <path d="M160 248H600" stroke="#2f76d6" marker-end="url(#arrow-blue)"/>
    <path d="M600 310H160" stroke="#2f76d6" marker-end="url(#arrow-blue)"/>
    <path d="M600 372H160" stroke="#a8a69c" marker-end="url(#arrow)"/>
    <path d="M160 430H600" stroke="#a8a69c" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#1f1f1f">
    <text x="380" y="186">1. nonce relay, 32 byte acak</text>
    <text x="380" y="240" font-weight="600">2. public key + nonce anggota + bukti anggota</text>
    <text x="380" y="266" font-size="11" fill="#5f5f5f">relay memeriksa apakah kunci ini terdaftar dan buktinya cocok</text>
    <text x="380" y="302" font-weight="600">3. bukti relay</text>
    <text x="380" y="328" font-size="11" fill="#5f5f5f">anggota memeriksa bukti relay</text>
    <text x="380" y="364">4. pesan teks JSON: alamat + daftar peer</text>
    <text x="380" y="422">5. paket WireGuard, seperti di Bagian 2</text>
  </g>

  <text x="24" y="480" font-size="11.5" fill="#5f5f5f">Kalau bukti anggota salah, relay menutup koneksi dengan alasan "bukan anggota". Kalau bukti relay salah,</text>
  <text x="24" y="498" font-size="11.5" fill="#5f5f5f">anggota memutus koneksi. Nonce baru di setiap koneksi membuat bukti lama tidak bisa dipakai ulang.</text>
</svg>
