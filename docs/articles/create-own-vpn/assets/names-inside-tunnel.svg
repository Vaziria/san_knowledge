<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="1520" height="800" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Pertanyaan nama dijawab di dalam tunnel">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Pertanyaan nama dijawab di dalam tunnel</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">OS hanya mengirim nama di domain VPN ke 10.10.0.254. Program client menjawabnya sebelum paket sampai ke wireguard-go.</text>

  <!-- Containers -->
  <rect x="24" y="76" width="504" height="270" rx="10" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="40" y="98" font-weight="600" fill="#1f1f1f">Komputer A</text>
  <rect x="290" y="186" width="222" height="146" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="306" y="206" font-weight="600" fill="#1f1f1f">Program client</text>

  <!-- Boxes -->
  <g stroke="#a8a69c" stroke-width="1.25" fill="#ffffff">
    <rect x="48" y="108" width="200" height="40" rx="8"/>
    <rect x="48" y="186" width="200" height="48" rx="8"/>
    <rect x="48" y="272" width="200" height="48" rx="8"/>
    <rect x="306" y="272" width="190" height="44" rx="8"/>
    <rect x="576" y="186" width="160" height="48" rx="8"/>
    <rect x="576" y="272" width="160" height="44" rx="8"/>
  </g>
  <rect x="306" y="216" width="190" height="44" rx="8" fill="#e3edfa" stroke="#2f76d6" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="148" y="132" fill="#1f1f1f">ssh kantor.vpn.internal</text>
    <text x="148" y="206" font-weight="600" fill="#1f1f1f">OS</text>
    <text x="148" y="223" font-size="11.5" fill="#5f5f5f">vpn.internal → 10.10.0.254</text>
    <text x="148" y="292" font-weight="600" fill="#1f1f1f">vpnku0</text>
    <text x="148" y="309" font-size="11.5" fill="#5f5f5f">10.10.0.1/24</text>
    <text x="401" y="235" font-weight="600" fill="#1f1f1f">resolver</text>
    <text x="401" y="251" font-size="11.5" fill="#5f5f5f">nama dari daftar client</text>
    <text x="401" y="291" font-weight="600" fill="#1f1f1f">wireguard-go</text>
    <text x="401" y="307" font-size="11.5" fill="#5f5f5f">paket lain</text>
    <text x="656" y="206" font-weight="600" fill="#1f1f1f">DNS biasa</text>
    <text x="656" y="223" font-size="11.5" fill="#5f5f5f">misalnya example.com</text>
    <text x="656" y="299" font-weight="600" fill="#1f1f1f">Relay</text>
  </g>

  <!-- Flows -->
  <g fill="none" stroke-width="1.5">
    <path d="M148 148V186" stroke="#a8a69c" marker-end="url(#arrow-grey)"/>
    <path d="M248 198H268V164H656V186" stroke="#a8a69c" marker-end="url(#arrow-grey)"/>
    <path d="M148 234V272" stroke="#2f76d6" marker-end="url(#arrow)"/>
    <path d="M248 282L306 244" stroke="#2f76d6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M248 302H306" stroke="#a8a69c" marker-end="url(#arrow-grey)"/>
    <path d="M496 294H576" stroke="#a8a69c" marker-end="url(#arrow-grey)"/>
  </g>
  <g font-size="11.5" fill="#5f5f5f">
    <text x="156" y="171">nama?</text>
    <text x="156" y="257" fill="#2f76d6">ke 10.10.0.254:53</text>
    <text x="462" y="157">nama lain</text>
  </g>

  <text x="24" y="372" font-size="11.5" fill="#5f5f5f">Resolver tidak membuka port 53 di OS. Ia membaca pertanyaan dari vpnku0 dan menulis jawabannya kembali ke vpnku0,</text>
  <text x="24" y="390" font-size="11.5" fill="#5f5f5f">jadi tidak bentrok dengan server DNS lain yang mungkin sudah berjalan di komputer itu.</text>
</svg>
