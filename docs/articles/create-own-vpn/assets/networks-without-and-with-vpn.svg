<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="1520" height="960" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Tanpa VPN, koneksi masuk berhenti di NAT dan firewall">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Tanpa VPN, koneksi masuk berhenti di NAT dan firewall</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Dengan VPN, setiap PC mendapat alamat kedua di jaringan virtual bersama.</text>

  <!-- Tanpa VPN -->
  <text x="24" y="90" font-weight="600" fill="#1f1f1f">Tanpa VPN</text>
  <g font-size="11.5" fill="#5f5f5f" text-anchor="middle">
    <text x="162" y="110">Rumah</text>
    <text x="380" y="110">Internet</text>
    <text x="598" y="110">Kantor</text>
  </g>
  <rect x="300" y="118" width="160" height="80" rx="8" fill="none" stroke="#a8a69c" stroke-width="1.25" stroke-dasharray="5 4"/>
  <g fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25">
    <rect x="24" y="118" width="130" height="80" rx="8"/>
    <rect x="170" y="118" width="130" height="80" rx="8"/>
    <rect x="460" y="118" width="130" height="80" rx="8"/>
    <rect x="606" y="118" width="130" height="80" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="89" y="142" font-weight="600" fill="#1f1f1f">PC rumah</text>
    <text x="89" y="160" fill="#1f1f1f">192.168.1.20</text>
    <text x="89" y="178" font-size="11.5" fill="#5f5f5f">private IP</text>
    <text x="235" y="142" font-weight="600" fill="#1f1f1f">Router</text>
    <text x="235" y="160" fill="#1f1f1f">NAT</text>
    <text x="235" y="178" font-size="11.5" fill="#5f5f5f">203.0.113.10</text>
    <text x="525" y="142" font-weight="600" fill="#1f1f1f">Firewall</text>
    <text x="525" y="160" fill="#1f1f1f">kantor</text>
    <text x="525" y="178" font-size="11.5" fill="#5f5f5f">198.51.100.20</text>
    <text x="671" y="142" font-weight="600" fill="#1f1f1f">PC kantor</text>
    <text x="671" y="160" fill="#1f1f1f">192.168.0.15</text>
    <text x="671" y="178" font-size="11.5" fill="#5f5f5f">private IP</text>
  </g>
  <g fill="none" stroke="#a8a69c" stroke-width="1.25">
    <path d="M460 140H310" marker-end="url(#arrow)"/>
    <path d="M300 162H450" marker-end="url(#arrow)"/>
    <path d="M460 184H390" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" font-weight="600" text-anchor="middle">
    <circle cx="300" cy="140" r="9" fill="#d1453b"/><text x="300" y="144" fill="#ffffff">1</text>
    <circle cx="460" cy="162" r="9" fill="#d1453b"/><text x="460" y="166" fill="#ffffff">2</text>
    <circle cx="380" cy="184" r="9" fill="#d1453b"/><text x="380" y="188" fill="#ffffff">3</text>
  </g>

  <g font-size="11.5">
    <circle cx="32" cy="222" r="8" fill="#d1453b"/><text x="32" y="226" font-size="10.5" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
    <text x="48" y="226" fill="#1f1f1f">Koneksi masuk ke rumah berhenti di NAT. Router tidak tahu harus meneruskannya ke PC mana.</text>
    <circle cx="32" cy="244" r="8" fill="#d1453b"/><text x="32" y="248" font-size="10.5" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
    <text x="48" y="248" fill="#1f1f1f">Koneksi masuk ke kantor diblokir firewall.</text>
    <circle cx="32" cy="266" r="8" fill="#d1453b"/><text x="32" y="270" font-size="10.5" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
    <text x="48" y="270" fill="#1f1f1f">Paket ke private IP seperti 192.168.1.20 tidak diteruskan oleh router di internet.</text>
  </g>

  <line x1="24" y1="294" x2="736" y2="294" stroke="#e4e2da" stroke-width="1"/>

  <!-- Dengan VPN -->
  <text x="24" y="320" font-weight="600" fill="#1f1f1f">Dengan VPN</text>
  <g font-size="11.5" fill="#5f5f5f" text-anchor="middle">
    <text x="162" y="340">Rumah</text>
    <text x="380" y="340">Internet</text>
    <text x="598" y="340">Kantor</text>
  </g>
  <rect x="300" y="348" width="160" height="80" rx="8" fill="none" stroke="#a8a69c" stroke-width="1.25" stroke-dasharray="5 4"/>
  <g fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25">
    <rect x="24" y="348" width="130" height="80" rx="8"/>
    <rect x="170" y="348" width="130" height="80" rx="8"/>
    <rect x="460" y="348" width="130" height="80" rx="8"/>
    <rect x="606" y="348" width="130" height="80" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="89" y="372" font-weight="600" fill="#1f1f1f">PC rumah</text>
    <text x="89" y="390" fill="#1f1f1f">192.168.1.20</text>
    <text x="89" y="412" font-weight="600" fill="#2f76d6">VPN: 10.10.0.2</text>
    <text x="235" y="372" font-weight="600" fill="#1f1f1f">Router</text>
    <text x="235" y="390" fill="#5f5f5f">NAT</text>
    <text x="525" y="372" font-weight="600" fill="#1f1f1f">Firewall</text>
    <text x="525" y="390" fill="#5f5f5f">kantor</text>
    <text x="671" y="372" font-weight="600" fill="#1f1f1f">PC kantor</text>
    <text x="671" y="390" fill="#1f1f1f">192.168.0.15</text>
    <text x="671" y="412" font-weight="600" fill="#2f76d6">VPN: 10.10.0.1</text>
  </g>
  <rect x="154" y="398" width="452" height="22" rx="11" fill="#e3edfa" stroke="#2f76d6" stroke-width="1.5"/>
  <text x="380" y="413" font-size="11.5" text-anchor="middle" fill="#1f1f1f">tunnel · jaringan virtual 10.10.0.0/24</text>

  <text x="24" y="456" font-size="11.5" fill="#5f5f5f">Kedua PC saling menjangkau lewat alamat 10.10.0.x. Cara tunnel melewati NAT dibahas di akhir artikel ini.</text>
</svg>
