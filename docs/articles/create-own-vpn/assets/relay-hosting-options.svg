<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="1520" height="820" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Relay butuh satu alamat HTTPS publik, dan ada tiga cara mendapatkannya">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="410" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Relay butuh satu alamat HTTPS publik, dan ada tiga cara mendapatkannya</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Client selalu terhubung lewat wss://. Yang berbeda adalah siapa yang memegang alamat HTTPS itu.</text>

  <!-- Row backgrounds -->
  <g fill="#f1f0eb">
    <rect x="24" y="76" width="712" height="92" rx="8"/>
    <rect x="24" y="178" width="712" height="92" rx="8"/>
    <rect x="24" y="280" width="712" height="92" rx="8"/>
  </g>

  <!-- Row labels -->
  <g fill="#1f1f1f">
    <text x="40" y="106" font-weight="600">VPS sendiri</text>
    <text x="40" y="124" font-size="11.5" fill="#5f5f5f">butuh IP publik dan domain</text>
    <text x="40" y="141" font-size="11.5" fill="#5f5f5f">sekitar US$4–5 sebulan</text>
    <text x="40" y="208" font-weight="600">Layanan tunnel</text>
    <text x="40" y="226" font-size="11.5" fill="#5f5f5f">butuh PC yang selalu menyala</text>
    <text x="40" y="243" font-size="11.5" fill="#5f5f5f">gratis, dengan batas pemakaian</text>
    <text x="40" y="310" font-weight="600">Layanan container</text>
    <text x="40" y="328" font-size="11.5" fill="#5f5f5f">tanpa mesin sendiri</text>
    <text x="40" y="345" font-size="11.5" fill="#5f5f5f">sekitar US$44 sebulan</text>
  </g>

  <!-- Boxes -->
  <g stroke="#a8a69c" stroke-width="1.25" fill="#ffffff">
    <rect x="232" y="98" width="96" height="48" rx="8"/>
    <rect x="232" y="200" width="96" height="48" rx="8"/>
    <rect x="232" y="302" width="96" height="48" rx="8"/>
    <rect x="566" y="98" width="158" height="48" rx="8"/>
    <rect x="566" y="200" width="158" height="48" rx="8"/>
    <rect x="566" y="302" width="158" height="48" rx="8"/>
  </g>
  <g stroke="#2f76d6" stroke-width="2" fill="#e3edfa">
    <rect x="384" y="98" width="140" height="48" rx="8"/>
    <rect x="384" y="200" width="140" height="48" rx="8"/>
    <rect x="384" y="302" width="140" height="48" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="280" y="127" font-weight="600" fill="#1f1f1f">Client</text>
    <text x="280" y="229" font-weight="600" fill="#1f1f1f">Client</text>
    <text x="280" y="331" font-weight="600" fill="#1f1f1f">Client</text>
    <text x="454" y="118" font-weight="600" fill="#1f1f1f">Caddy di VPS</text>
    <text x="454" y="135" font-size="11.5" fill="#5f5f5f">sertifikat milik kita</text>
    <text x="454" y="220" font-weight="600" fill="#1f1f1f">Layanan tunnel</text>
    <text x="454" y="237" font-size="11.5" fill="#5f5f5f">HTTPS milik penyedia</text>
    <text x="454" y="322" font-weight="600" fill="#1f1f1f">Layanan container</text>
    <text x="454" y="339" font-size="11.5" fill="#5f5f5f">HTTPS milik penyedia</text>
    <text x="645" y="118" font-weight="600" fill="#1f1f1f">relay</text>
    <text x="645" y="135" font-size="11.5" fill="#5f5f5f">di VPS yang sama</text>
    <text x="645" y="220" font-weight="600" fill="#1f1f1f">relay</text>
    <text x="645" y="237" font-size="11.5" fill="#5f5f5f">di PC kantor</text>
    <text x="645" y="322" font-weight="600" fill="#1f1f1f">relay</text>
    <text x="645" y="339" font-size="11.5" fill="#5f5f5f">umur koneksi ≤ 60 menit</text>
  </g>

  <!-- Connections -->
  <g fill="none" stroke="#a8a69c" stroke-width="1.5">
    <path d="M328 122H384" marker-end="url(#arrow)"/>
    <path d="M328 224H384" marker-end="url(#arrow)"/>
    <path d="M328 326H384" marker-end="url(#arrow)"/>
    <path d="M524 122H566" marker-end="url(#arrow)"/>
    <path d="M566 224H524" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <path d="M524 326H566" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#5f5f5f" text-anchor="middle">
    <text x="356" y="160">wss://</text>
    <text x="356" y="262">wss://</text>
    <text x="356" y="364">wss://</text>
    <text x="545" y="262">koneksi keluar</text>
  </g>

  <text x="24" y="398" font-size="11.5" fill="#5f5f5f">Di layanan tunnel, relay yang membuka koneksi keluar ke penyedia, jadi PC kantor tidak butuh IP publik.</text>
</svg>
