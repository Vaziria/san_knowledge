<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="1520" height="656" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Relay hanya membaca dan mengganti 32 byte pertama setiap pesan">
  <rect x="0" y="0" width="760" height="328" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Relay hanya membaca dan mengganti 32 byte pertama setiap pesan</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Contoh ini adalah pesan dari A untuk B. Paket WireGuard di belakangnya tidak pernah diubah.</text>

  <!-- 1. First message -->
  <text x="24" y="92" font-weight="600" fill="#1f1f1f">1. Pesan pertama, saat A terhubung</text>
  <rect x="24" y="102" width="220" height="40" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="134" y="126" text-anchor="middle" fill="#1f1f1f">public key A (32 byte)</text>
  <text x="260" y="126" font-size="11.5" fill="#5f5f5f">relay mencatat koneksi ini sebagai milik A</text>

  <!-- 2. A to relay -->
  <text x="24" y="174" font-weight="600" fill="#1f1f1f">2. Dari A ke relay</text>
  <rect x="24" y="184" width="220" height="40" fill="#e3edfa" stroke="#2f76d6" stroke-width="2"/>
  <rect x="244" y="184" width="468" height="40" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="134" y="208" text-anchor="middle" font-weight="600" fill="#1f1f1f">tujuan: public key B</text>
  <text x="478" y="208" text-anchor="middle" fill="#1f1f1f">paket WireGuard, terenkripsi</text>

  <!-- 3. relay to B -->
  <text x="24" y="256" font-weight="600" fill="#1f1f1f">3. Dari relay ke B</text>
  <rect x="24" y="266" width="220" height="40" fill="#e3edfa" stroke="#2f76d6" stroke-width="2"/>
  <rect x="244" y="266" width="468" height="40" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="134" y="290" text-anchor="middle" font-weight="600" fill="#1f1f1f">pengirim: public key A</text>
  <text x="478" y="290" text-anchor="middle" fill="#1f1f1f">paket WireGuard yang sama, tidak diubah</text>
</svg>
