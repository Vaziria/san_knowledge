<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="1520" height="880" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="VPN yang kita bangun dalam sembilan bagian">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">VPN yang kita bangun dalam sembilan bagian</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Angka "B" di setiap kotak adalah bagian seri yang membangunnya. Garis biru adalah jalur pengiriman.</text>

  <!-- Containers -->
  <g fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25">
    <rect x="24" y="76" width="276" height="318" rx="10"/>
    <rect x="476" y="76" width="260" height="248" rx="10"/>
  </g>
  <g font-weight="600" fill="#1f1f1f">
    <text x="40" y="98">Client</text>
    <text x="492" y="98">Relay</text>
  </g>

  <!-- Member parts -->
  <g stroke="#a8a69c" stroke-width="1.25" fill="#ffffff">
    <rect x="40" y="110" width="244" height="40" rx="7"/>
    <rect x="40" y="160" width="244" height="40" rx="7"/>
    <rect x="40" y="210" width="244" height="40" rx="7"/>
    <rect x="40" y="320" width="244" height="58" rx="7"/>
  </g>
  <rect x="40" y="260" width="244" height="50" rx="7" fill="#e3edfa" stroke="#2f76d6" stroke-width="2"/>
  <g fill="#1f1f1f">
    <text x="54" y="135">aplikasi: ssh kantor.vpn.internal</text>
    <text x="54" y="185">vpnku0 dan resolver nama</text>
    <text x="54" y="235">wireguard-go, kunci sendiri</text>
    <text x="54" y="281" font-weight="600">Bind WebSocket</text>
    <text x="54" y="299" font-size="11.5" fill="#5f5f5f">tersambung lagi, perbarui koneksi</text>
    <text x="54" y="342">undangan, menyala saat boot,</text>
    <text x="54" y="360">diperbarui dengan hash</text>
  </g>
  <g font-size="11" fill="#5f5f5f" text-anchor="end">
    <text x="276" y="185">B3, B7</text>
    <text x="276" y="235">B2, B3</text>
    <text x="276" y="281">B2, B5, B8</text>
    <text x="276" y="342">B6, B9</text>
  </g>

  <!-- Front -->
  <rect x="324" y="252" width="128" height="66" rx="8" fill="#e3edfa" stroke="#2f76d6" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="388" y="274" font-weight="600" fill="#1f1f1f">HTTPS</text>
    <text x="388" y="291" font-size="11.5" fill="#5f5f5f">Caddy, tunnel,</text>
    <text x="388" y="307" font-size="11.5" fill="#5f5f5f">atau container</text>
  </g>
  <text x="388" y="334" font-size="11" fill="#5f5f5f" text-anchor="middle">B3, B8</text>

  <!-- Relay parts -->
  <g stroke="#a8a69c" stroke-width="1.25" fill="#ffffff">
    <rect x="492" y="110" width="228" height="40" rx="7"/>
    <rect x="492" y="160" width="228" height="40" rx="7"/>
    <rect x="492" y="210" width="228" height="40" rx="7"/>
  </g>
  <rect x="492" y="260" width="228" height="50" rx="7" fill="#e3edfa" stroke="#2f76d6" stroke-width="2"/>
  <g fill="#1f1f1f">
    <text x="506" y="135">bukti kunci dua arah</text>
    <text x="506" y="185">relay.json: client, undangan</text>
    <text x="506" y="235">daftar client ke semua</text>
    <text x="506" y="281" font-weight="600">antrean per client</text>
    <text x="506" y="299" font-size="11.5" fill="#5f5f5f">meneruskan paket per public key</text>
  </g>
  <g font-size="11" fill="#5f5f5f" text-anchor="end">
    <text x="712" y="135">B4</text>
    <text x="712" y="185">B6</text>
    <text x="712" y="235">B4, B5</text>
    <text x="712" y="281">B2, B5</text>
  </g>

  <!-- Other members -->
  <rect x="476" y="344" width="260" height="50" rx="10" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="606" y="366" text-anchor="middle" font-weight="600" fill="#1f1f1f">Client lain</text>
  <text x="606" y="383" text-anchor="middle" font-size="11.5" fill="#5f5f5f">susunannya sama dengan client di kiri</text>

  <!-- Delivery path -->
  <g fill="none" stroke-width="1.75">
    <path d="M284 285H324" stroke="#2f76d6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M452 285H492" stroke="#2f76d6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M606 310V344" stroke="#2f76d6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>

  <text x="24" y="418" font-size="11.5" fill="#5f5f5f">WireGuard mengenkripsi paket dari client ke client. Relay dan HTTPS di depannya hanya melihat public key, ukuran, dan waktu.</text>
  <text x="24" y="434" font-size="11.5" fill="#5f5f5f">Bagian 1 menjelaskan semua bagian ini sebelum kodenya ditulis.</text>
</svg>
