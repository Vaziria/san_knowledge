<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="1520" height="672" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="B+tree menyimpan semua key di leaf, dan pencarian turun dari root ke satu leaf">
  <defs>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="336" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">B+tree menyimpan semua key di leaf, dan pencarian turun dari root ke satu leaf</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Tree dengan order 3 setelah key a sampai j dimasukkan. Garis biru adalah jalan Get(&quot;h&quot;).</text>
  <text x="24" y="72" font-size="11.5" fill="#5f5f5f">Karena h &gt;= g, pencarian turun ke kanan. Karena h &lt; i, pencarian turun ke kiri, ke leaf [g h].</text>
  <rect x="384.0" y="86" width="60" height="28" rx="3" fill="#2f76d6" fill-opacity="0.12" stroke="#2f76d6" stroke-width="1.25"/>
  <text x="414" y="104" font-size="12" text-anchor="middle" fill="#1f1f1f" font-family="Consolas, Menlo, monospace">g</text>
  <rect x="204.0" y="158" width="80" height="28" rx="3" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="244" y="176" font-size="12" text-anchor="middle" fill="#1f1f1f" font-family="Consolas, Menlo, monospace">c  e</text>
  <rect x="554.0" y="158" width="60" height="28" rx="3" fill="#2f76d6" fill-opacity="0.12" stroke="#2f76d6" stroke-width="1.25"/>
  <text x="584" y="176" font-size="12" text-anchor="middle" fill="#1f1f1f" font-family="Consolas, Menlo, monospace">i</text>
  <rect x="66.0" y="230" width="84" height="28" rx="3" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="108" y="248" font-size="12" text-anchor="middle" fill="#1f1f1f" font-family="Consolas, Menlo, monospace">a  b</text>
  <rect x="202.0" y="230" width="84" height="28" rx="3" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="244" y="248" font-size="12" text-anchor="middle" fill="#1f1f1f" font-family="Consolas, Menlo, monospace">c  d</text>
  <rect x="338.0" y="230" width="84" height="28" rx="3" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="380" y="248" font-size="12" text-anchor="middle" fill="#1f1f1f" font-family="Consolas, Menlo, monospace">e  f</text>
  <rect x="474.0" y="230" width="84" height="28" rx="3" fill="#2f76d6" fill-opacity="0.12" stroke="#2f76d6" stroke-width="1.25"/>
  <text x="516" y="248" font-size="12" text-anchor="middle" fill="#1f1f1f" font-family="Consolas, Menlo, monospace">g  h</text>
  <rect x="610.0" y="230" width="84" height="28" rx="3" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="652" y="248" font-size="12" text-anchor="middle" fill="#1f1f1f" font-family="Consolas, Menlo, monospace">i  j</text>
  <path d="M400 114 L260 156" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#a-grey)"/>
  <path d="M428 114 L570 156" fill="none" stroke="#2f76d6" stroke-width="1.25" marker-end="url(#a-acc)"/>
  <path d="M210.0 186 L108 228" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#a-grey)"/>
  <path d="M244.0 186 L244 228" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#a-grey)"/>
  <path d="M278.0 186 L380 228" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#a-grey)"/>
  <path d="M567.0 186 L516 228" fill="none" stroke="#2f76d6" stroke-width="1.25" marker-end="url(#a-acc)"/>
  <path d="M601.0 186 L652 228" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#a-grey)"/>
  <path d="M150 244 L200 244" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#a-grey)"/>
  <path d="M286 244 L336 244" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#a-grey)"/>
  <path d="M422 244 L472 244" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#a-grey)"/>
  <path d="M558 244 L608 244" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#a-grey)"/>
  <text x="736" y="100" font-size="11.5" text-anchor="end" fill="#5f5f5f">root</text>
  <text x="736" y="172" font-size="11.5" text-anchor="end" fill="#5f5f5f">branch</text>
  <text x="736" y="244" font-size="11.5" text-anchor="end" fill="#5f5f5f">leaf</text>
  <text x="24" y="292" font-size="11.5" text-anchor="start" fill="#5f5f5f">Branch hanya berisi key pemisah. Anak ke-i dari sebuah branch berisi key yang &gt;= pemisah ke-(i-1) dan &lt; pemisah ke-i.</text>
  <text x="24" y="310" font-size="11.5" text-anchor="start" fill="#5f5f5f">Panah di antara leaf adalah rantai leaf. Dari satu leaf, leaf berikutnya bisa dicapai tanpa naik ke atas.</text>
</svg>
