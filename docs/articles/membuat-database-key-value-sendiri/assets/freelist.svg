<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="1520" height="740" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Halaman yang ditinggalkan baru dipakai lagi setelah commit berikutnya">
  <defs>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="370" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" text-anchor="start" fill="#1f1f1f" font-weight="600">Halaman yang ditinggalkan baru dipakai lagi setelah commit berikutnya</text>
  <text x="24" y="56" font-size="11.5" text-anchor="start" fill="#5f5f5f">Commit 8 menyalin leaf di halaman 5 ke halaman baru. Halaman 5 masih ditunjuk commit 7, yang menjadi cadangan</text>
  <text x="24" y="72" font-size="11.5" text-anchor="start" fill="#5f5f5f">kalau meta commit 8 rusak. Setelah commit 8 selesai, commit 7 tidak dibutuhkan lagi, jadi commit 9 boleh memakainya.</text>
  <text x="24" y="112" font-size="12.5" text-anchor="start" fill="#1f1f1f" font-weight="600">commit 7</text>
  <rect x="24" y="124" width="166" height="64" rx="0" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="107.0" y="152.0" font-size="11.5" text-anchor="middle" fill="#1f1f1f" font-weight="600">halaman 5 dipakai tree</text>
  <text x="107.0" y="168.0" font-size="10.5" text-anchor="middle" fill="#5f5f5f">ditunjuk meta A</text>
  <line x1="190" y1="156" x2="206" y2="156" stroke="#a8a69c" stroke-width="1.4" marker-end="url(#a-grey)"/>
  <text x="208" y="112" font-size="12.5" text-anchor="start" fill="#1f1f1f" font-weight="600">commit 8</text>
  <rect x="208" y="124" width="166" height="64" rx="0" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="291.0" y="152.0" font-size="11.5" text-anchor="middle" fill="#1f1f1f" font-weight="600">halaman 5 ditinggalkan</text>
  <text x="291.0" y="168.0" font-size="10.5" text-anchor="middle" fill="#5f5f5f">masuk pending</text>
  <line x1="374" y1="156" x2="390" y2="156" stroke="#a8a69c" stroke-width="1.4" marker-end="url(#a-grey)"/>
  <text x="392" y="112" font-size="12.5" text-anchor="start" fill="#1f1f1f" font-weight="600">commit 9</text>
  <rect x="392" y="124" width="166" height="64" rx="0" fill="#2f76d6" fill-opacity="0.1" stroke="#2f76d6" stroke-width="1.25"/>
  <text x="475.0" y="152.0" font-size="11.5" text-anchor="middle" fill="#1f1f1f" font-weight="600">halaman 5 di free list</text>
  <text x="475.0" y="168.0" font-size="10.5" text-anchor="middle" fill="#5f5f5f">boleh dipakai lagi</text>
  <line x1="558" y1="156" x2="574" y2="156" stroke="#a8a69c" stroke-width="1.4" marker-end="url(#a-grey)"/>
  <text x="576" y="112" font-size="12.5" text-anchor="start" fill="#1f1f1f" font-weight="600">commit 9, Put</text>
  <rect x="576" y="124" width="166" height="64" rx="0" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="659.0" y="152.0" font-size="11.5" text-anchor="middle" fill="#1f1f1f" font-weight="600">leaf baru ditulis</text>
  <text x="659.0" y="168.0" font-size="10.5" text-anchor="middle" fill="#5f5f5f">di halaman 5</text>
  <text x="24" y="232" font-size="11.5" text-anchor="start" fill="#5f5f5f">Kenapa tidak langsung dipakai di commit 8? Kalau listrik padam saat meta commit 8 ditulis, Open memakai meta</text>
  <text x="24" y="248" font-size="11.5" text-anchor="start" fill="#5f5f5f">commit 7. Tree commit 7 masih membutuhkan halaman 5 yang asli, jadi halaman itu tidak boleh ditimpa sebelum</text>
  <text x="24" y="264" font-size="11.5" text-anchor="start" fill="#5f5f5f">meta commit 8 sampai ke disk.</text>
  <text x="24" y="296" font-size="11.5" text-anchor="start" fill="#2f76d6">Free list sendiri disimpan di halaman-halaman file index, ditunjuk oleh meta, dan ikut disalin di setiap commit.</text>
  <text x="24" y="312" font-size="11.5" text-anchor="start" fill="#2f76d6">Halaman free list lama ikut ditinggalkan, seperti halaman node.</text>
  <text x="24" y="344" font-size="11" text-anchor="start" fill="#5f5f5f">Halaman yang dibuat lalu dilepas sebelum commit, misalnya saat dua leaf baru digabung, langsung boleh dipakai lagi.</text>
</svg>
