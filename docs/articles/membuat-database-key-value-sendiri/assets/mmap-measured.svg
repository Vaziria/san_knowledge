  <text x="277.0" y="356" font-size="11.5" text-anchor="start" fill="#1f1f1f">0,5 µs</text>
  <text x="24" y="388" font-size="11" text-anchor="start" fill="#5f5f5f">Skala kedua panel berbeda: panel atas sampai 300 µs, panel bawah sampai 10 µs.</text>
