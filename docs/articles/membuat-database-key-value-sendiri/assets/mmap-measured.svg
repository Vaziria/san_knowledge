  <text x="373.26666666666665" y="164" font-size="11.5" text-anchor="start" fill="#1f1f1f">91 µs</text>
  <text x="24" y="190" font-size="11.5" text-anchor="start" fill="#5f5f5f">file 9,3 GB, ReadAt</text>
  <rect x="250" y="176" width="227.62" height="18" rx="0" fill="#d9d7cf" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="485.62" y="190" font-size="11.5" text-anchor="start" fill="#1f1f1f">179,7 µs</text>
  <text x="24" y="216" font-size="11.5" text-anchor="start" fill="#5f5f5f">file 9,3 GB, mmap</text>
  <rect x="250" y="202" width="328.9533333333333" height="18" rx="0" fill="#2f76d6" fill-opacity="0.1" stroke="#2f76d6" stroke-width="1.25"/>
  <text x="586.9533333333334" y="216" font-size="11.5" text-anchor="start" fill="#1f1f1f">259,7 µs</text>
  <text x="24" y="250" font-size="12.5" text-anchor="start" fill="#1f1f1f" font-weight="600">Putaran 2, dari page cache</text>
