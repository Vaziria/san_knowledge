  <text x="531.6" y="278" font-size="11.5" text-anchor="start" fill="#1f1f1f">7,2 µs</text>
  <text x="24" y="304" font-size="11.5" text-anchor="start" fill="#5f5f5f">file 1,2 GB, mmap</text>
  <rect x="250" y="290" width="22.8" height="18" rx="0" fill="#2f76d6" fill-opacity="0.1" stroke="#2f76d6" stroke-width="1.25"/>
