  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" text-anchor="start" fill="#1f1f1f" font-weight="600">mmap hanya jauh lebih cepat saat data sudah ada di page cache</text>
  <text x="24" y="56" font-size="11.5" text-anchor="start" fill="#5f5f5f">Potongan 4 KB di posisi acak, dibaca dengan ReadAt dan lewat mmap. Putaran pertama membaca dari disk,</text>
  <text x="24" y="72" font-size="11.5" text-anchor="start" fill="#5f5f5f">putaran kedua membaca posisi yang sama lagi. Laptop dengan RAM sekitar 7,4 GB, Windows.</text>
  <text x="24" y="110" font-size="12.5" text-anchor="start" fill="#1f1f1f" font-weight="600">Putaran 1, dari disk</text>
  <text x="24" y="138" font-size="11.5" text-anchor="start" fill="#5f5f5f">file 1,2 GB, ReadAt</text>
  <rect x="250" y="124" width="129.07333333333332" height="18" rx="0" fill="#d9d7cf" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="387.0733333333333" y="138" font-size="11.5" text-anchor="start" fill="#1f1f1f">101,9 µs</text>
  <text x="24" y="164" font-size="11.5" text-anchor="start" fill="#5f5f5f">file 1,2 GB, mmap</text>
