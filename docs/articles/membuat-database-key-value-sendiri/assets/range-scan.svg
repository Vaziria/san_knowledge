  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Range(&quot;d&quot;, &quot;h&quot;) di tree yang sama. Pencarian turun sekali ke leaf [c d], lalu mengikuti panah ke kanan</text>
  <text x="24" y="72" font-size="11.5" fill="#5f5f5f">dan berhenti di key pertama yang &gt;= h. Hasilnya d, e, f, dan g, tanpa kembali ke root.</text>
