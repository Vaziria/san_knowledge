<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="1520" height="712" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Range turun ke leaf pertama, lalu berjalan di rantai leaf">
