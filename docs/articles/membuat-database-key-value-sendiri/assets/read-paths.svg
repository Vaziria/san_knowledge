<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="1520" height="704" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="mmap membaca page cache milik OS secara langsung, ReadAt menyalinnya dulu">
  <defs>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="352" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">mmap membaca page cache milik OS secara langsung, ReadAt menyalinnya dulu</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Page cache adalah memori tempat OS menyimpan isi file yang baru dibaca. Angka di bawah adalah benchmark terpisah</text>
  <text x="24" y="72" font-size="11.5" fill="#5f5f5f">di laptop saya, untuk halaman 16 KB acak dari file 64 MB yang sudah ada di page cache.</text>
  <text x="24" y="100" font-size="13" text-anchor="start" fill="#1f1f1f" font-weight="600">ReadAt dengan cache sendiri (Bagian 3)</text>
  <rect x="24" y="116" width="150" height="52" rx="4" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="99" y="138" font-size="12" text-anchor="middle" fill="#1f1f1f" font-weight="600">disk</text>
  <text x="99" y="156" font-size="11" text-anchor="middle" fill="#5f5f5f">file data.kvt</text>
  <rect x="24" y="206" width="150" height="52" rx="4" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="99" y="228" font-size="12" text-anchor="middle" fill="#1f1f1f" font-weight="600">page cache OS</text>
  <text x="99" y="246" font-size="11" text-anchor="middle" fill="#5f5f5f">salinan pertama</text>
  <rect x="214" y="206" width="150" height="52" rx="4" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="289" y="228" font-size="12" text-anchor="middle" fill="#1f1f1f" font-weight="600">buffer program</text>
  <text x="289" y="246" font-size="11" text-anchor="middle" fill="#5f5f5f">salinan kedua</text>
  <rect x="214" y="116" width="150" height="52" rx="4" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="289" y="138" font-size="12" text-anchor="middle" fill="#1f1f1f" font-weight="600">node di cache</text>
  <text x="289" y="156" font-size="11" text-anchor="middle" fill="#5f5f5f">hasil decode</text>
  <path d="M99 170 L99 202" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#a-grey)"/>
  <path d="M176 232 L210 232" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#a-grey)"/>
  <text x="193" y="282" font-size="11" text-anchor="middle" fill="#5f5f5f">ReadAt</text>
  <text x="193" y="298" font-size="11" text-anchor="middle" fill="#5f5f5f">7,5 µs per halaman</text>
  <path d="M289 204 L289 172" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#a-grey)"/>
  <text x="396" y="100" font-size="13" text-anchor="start" fill="#1f1f1f" font-weight="600">mmap</text>
  <rect x="396" y="116" width="150" height="52" rx="4" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="471" y="138" font-size="12" text-anchor="middle" fill="#1f1f1f" font-weight="600">disk</text>
  <text x="471" y="156" font-size="11" text-anchor="middle" fill="#5f5f5f">file data.kvt</text>
  <rect x="396" y="206" width="150" height="52" rx="4" fill="#2f76d6" fill-opacity="0.1" stroke="#2f76d6" stroke-width="1.25"/>
  <text x="471" y="228" font-size="12" text-anchor="middle" fill="#1f1f1f" font-weight="600">page cache OS</text>
  <text x="471" y="246" font-size="11" text-anchor="middle" fill="#5f5f5f">satu-satunya salinan</text>
  <rect x="586" y="206" width="150" height="52" rx="4" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="661" y="228" font-size="12" text-anchor="middle" fill="#1f1f1f" font-weight="600">memori program</text>
  <text x="661" y="246" font-size="11" text-anchor="middle" fill="#5f5f5f">menunjuk ke page cache</text>
  <path d="M471 170 L471 202" fill="none" stroke="#a8a69c" stroke-width="1.25" marker-end="url(#a-grey)"/>
  <path d="M584 232 H550" fill="none" stroke="#2f76d6" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#a-acc)"/>
  <text x="661" y="282" font-size="11" text-anchor="middle" fill="#2f76d6">membaca 1 byte: 49 ns</text>
  <text x="661" y="298" font-size="11" text-anchor="middle" fill="#2f76d6">menyalin 1 halaman: 1,0 µs</text>
  <text x="24" y="334" font-size="11.5" text-anchor="start" fill="#5f5f5f">Dengan ReadAt, setiap halaman yang dibaca ada setidaknya dua kali di memori. Dengan mmap, program membaca page cache itu sendiri.</text>
</svg>
