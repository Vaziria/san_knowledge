<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="1520" height="860" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Enam bagian, satu database key-value yang tumbuh selangkah demi selangkah">
  <defs>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" text-anchor="start" fill="#1f1f1f" font-weight="600">Enam bagian, satu database key-value yang tumbuh selangkah demi selangkah</text>
  <text x="24" y="56" font-size="11.5" text-anchor="start" fill="#5f5f5f">Setiap bagian menjawab kelemahan terbesar bagian sebelumnya.</text>
  <text x="24" y="100" font-size="12.5" text-anchor="start" fill="#1f1f1f" font-weight="600">Bagian 1</text>
  <rect x="24" y="112" width="222" height="92" rx="0" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="135" y="144" font-size="12" text-anchor="middle" fill="#1f1f1f" font-weight="600">log dan map</text>
  <text x="135" y="166" font-size="11" text-anchor="middle" fill="#5f5f5f">Put ditulis ke log,</text>
  <text x="135" y="182" font-size="11" text-anchor="middle" fill="#5f5f5f">index di memori</text>
  <line x1="246" y1="158" x2="267" y2="158" stroke="#a8a69c" stroke-width="1.4" marker-end="url(#a-grey)"/>
  <text x="269" y="100" font-size="12.5" text-anchor="start" fill="#1f1f1f" font-weight="600">Bagian 2</text>
  <rect x="269" y="112" width="222" height="92" rx="0" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="380" y="144" font-size="12" text-anchor="middle" fill="#1f1f1f" font-weight="600">B+tree di memori</text>
  <text x="380" y="166" font-size="11" text-anchor="middle" fill="#5f5f5f">key urut, Range cepat</text>
  <text x="380" y="182" font-size="11" text-anchor="middle" fill="#5f5f5f">tanpa memeriksa semua</text>
  <line x1="491" y1="158" x2="512" y2="158" stroke="#a8a69c" stroke-width="1.4" marker-end="url(#a-grey)"/>
  <text x="514" y="100" font-size="12.5" text-anchor="start" fill="#1f1f1f" font-weight="600">Bagian 3</text>
  <rect x="514" y="112" width="222" height="92" rx="0" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="625" y="144" font-size="12" text-anchor="middle" fill="#1f1f1f" font-weight="600">halaman 16 KB</text>
  <text x="625" y="166" font-size="11" text-anchor="middle" fill="#5f5f5f">Open hanya membaca</text>
  <text x="625" y="182" font-size="11" text-anchor="middle" fill="#5f5f5f">halaman 0</text>
  <text x="24" y="250" font-size="12.5" text-anchor="start" fill="#1f1f1f" font-weight="600">Bagian 4</text>
  <rect x="24" y="262" width="222" height="92" rx="0" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="135" y="294" font-size="12" text-anchor="middle" fill="#1f1f1f" font-weight="600">copy-on-write</text>
  <text x="135" y="316" font-size="11" text-anchor="middle" fill="#5f5f5f">dua meta, delete,</text>
  <text x="135" y="332" font-size="11" text-anchor="middle" fill="#5f5f5f">file data, tombstone</text>
  <line x1="246" y1="308" x2="267" y2="308" stroke="#a8a69c" stroke-width="1.4" marker-end="url(#a-grey)"/>
  <text x="269" y="250" font-size="12.5" text-anchor="start" fill="#1f1f1f" font-weight="600">Bagian 5</text>
  <rect x="269" y="262" width="222" height="92" rx="0" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="380" y="294" font-size="12" text-anchor="middle" fill="#1f1f1f" font-weight="600">compaction</text>
  <text x="380" y="316" font-size="11" text-anchor="middle" fill="#5f5f5f">free list, cache LRU,</text>
  <text x="380" y="332" font-size="11" text-anchor="middle" fill="#5f5f5f">data lebih besar dari RAM</text>
  <line x1="491" y1="308" x2="512" y2="308" stroke="#a8a69c" stroke-width="1.4" marker-end="url(#a-grey)"/>
  <text x="514" y="250" font-size="12.5" text-anchor="start" fill="#1f1f1f" font-weight="600">Bagian 6</text>
  <rect x="514" y="262" width="222" height="92" rx="0" fill="#2f76d6" fill-opacity="0.1" stroke="#2f76d6" stroke-width="1.25"/>
  <text x="625" y="294" font-size="12" text-anchor="middle" fill="#1f1f1f" font-weight="600">mengukur</text>
  <text x="625" y="316" font-size="11" text-anchor="middle" fill="#5f5f5f">bbolt dan Badger,</text>
  <text x="625" y="332" font-size="11" text-anchor="middle" fill="#5f5f5f">Range 10 kali lebih cepat</text>
  <path d="M 625 206 L 625 226 L 135 226 L 135 260" fill="none" stroke="#a8a69c" stroke-width="1.4" marker-end="url(#a-grey)"/>
  <text x="24" y="412" font-size="11.5" text-anchor="start" fill="#5f5f5f">Semua kode hanya memakai library standar Go, dan diuji dengan go test, -race, dan try-out sebelum masuk artikel.</text>
</svg>
