  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Node yang kelebihan key dibelah dua, dan satu key naik ke induknya</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Put(&quot;j&quot;) di tree dengan order 3, yaitu paling banyak 3 key per node. Sebelumnya, root adalah branch [c e g]</text>
  <text x="24" y="72" font-size="11.5" fill="#5f5f5f">dan leaf terakhir adalah [g h i]. Leaf menyalin key pertama belahan kanannya ke atas, branch memindahkan key tengahnya.</text>
  <text x="24" y="104" font-size="12.5" text-anchor="start" fill="#1f1f1f" font-weight="600">1. Leaf [g h i j] dibelah</text>
