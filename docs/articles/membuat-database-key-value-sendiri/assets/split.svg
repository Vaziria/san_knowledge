  <path d="M252 120 L252 280" fill="none" stroke="#a8a69c" stroke-width="1.25"/>
  <path d="M504 120 L504 280" fill="none" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="24" y="312" font-size="11.5" text-anchor="start" fill="#5f5f5f">Leaf [a b] sampai [e f] tidak berubah. Hanya node di jalan dari root ke leaf yang bisa ikut terbelah.</text>
