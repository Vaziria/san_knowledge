<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="1520" height="800" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Tiga cara menyimpan key-value yang dibandingkan di bagian ini">
  <defs>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" text-anchor="start" fill="#1f1f1f" font-weight="600">Tiga cara menyimpan key-value yang dibandingkan di bagian ini</text>
  <text x="24" y="56" font-size="11.5" text-anchor="start" fill="#5f5f5f">kvku dan bbolt sama-sama B+tree dengan copy-on-write. Bedanya, bbolt menyimpan value di dalam leaf dan</text>
  <text x="24" y="72" font-size="11.5" text-anchor="start" fill="#5f5f5f">membaca lewat mmap. Badger memakai LSM tree, yang menampung tulisan di memori lalu menulisnya sebagai file urut.</text>
  <text x="24" y="110" font-size="12.5" text-anchor="start" fill="#1f1f1f" font-weight="600">kvku</text>
  <rect x="24" y="122" width="222" height="52" rx="0" fill="#2f76d6" fill-opacity="0.1" stroke="#2f76d6" stroke-width="1.25"/>
  <text x="135.0" y="136.0" font-size="11.5" text-anchor="middle" fill="#1f1f1f" font-weight="600">file index</text>
  <text x="135.0" y="152.0" font-size="11" text-anchor="middle" fill="#1f1f1f" font-family="Consolas, Menlo, monospace">B+tree, halaman 16 KB</text>
  <text x="135.0" y="168.0" font-size="10.5" text-anchor="middle" fill="#5f5f5f">key dan posisi record</text>
  <rect x="24" y="196" width="222" height="52" rx="0" fill="#2f76d6" fill-opacity="0.1" stroke="#2f76d6" stroke-width="1.25"/>
  <text x="135.0" y="210.0" font-size="11.5" text-anchor="middle" fill="#1f1f1f" font-weight="600">file data</text>
  <text x="135.0" y="226.0" font-size="11" text-anchor="middle" fill="#1f1f1f" font-family="Consolas, Menlo, monospace">record value</text>
  <text x="135.0" y="242.0" font-size="10.5" text-anchor="middle" fill="#5f5f5f">hanya bertambah</text>
  <line x1="135" y1="174" x2="135" y2="194" stroke="#2f76d6" stroke-width="1.4" marker-end="url(#a-acc)"/>
  <text x="24" y="278" font-size="11.5" text-anchor="start" fill="#5f5f5f">dibaca dengan ReadAt</text>
  <text x="24" y="294" font-size="11.5" text-anchor="start" fill="#5f5f5f">dan cache LRU sendiri</text>
  <text x="269" y="110" font-size="12.5" text-anchor="start" fill="#1f1f1f" font-weight="600">bbolt</text>
  <rect x="269" y="122" width="222" height="126" rx="0" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="380.0" y="173.0" font-size="11.5" text-anchor="middle" fill="#1f1f1f" font-weight="600">satu file</text>
  <text x="380.0" y="189.0" font-size="11" text-anchor="middle" fill="#1f1f1f" font-family="Consolas, Menlo, monospace">B+tree, halaman 4 KB</text>
  <text x="380.0" y="205.0" font-size="10.5" text-anchor="middle" fill="#5f5f5f">value di dalam leaf</text>
  <text x="269" y="278" font-size="11.5" text-anchor="start" fill="#5f5f5f">dibaca lewat mmap,</text>
  <text x="269" y="294" font-size="11.5" text-anchor="start" fill="#5f5f5f">ditulis dengan WriteAt</text>
  <text x="514" y="110" font-size="12.5" text-anchor="start" fill="#1f1f1f" font-weight="600">Badger</text>
  <rect x="514" y="122" width="222" height="40" rx="0" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="625.0" y="146.0" font-size="11.5" text-anchor="middle" fill="#1f1f1f" font-weight="600">memtable dan WAL</text>
  <rect x="514" y="172" width="222" height="40" rx="0" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="625.0" y="196.0" font-size="11.5" text-anchor="middle" fill="#1f1f1f" font-weight="600">SSTable tingkat 0, 1, 2, ...</text>
  <rect x="514" y="222" width="222" height="26" rx="0" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="625.0" y="239.0" font-size="11.5" text-anchor="middle" fill="#1f1f1f" font-weight="600">value log, untuk value besar</text>
  <line x1="625" y1="162" x2="625" y2="170" stroke="#a8a69c" stroke-width="1.4" marker-end="url(#a-grey)"/>
  <text x="514" y="278" font-size="11.5" text-anchor="start" fill="#5f5f5f">tulisan masuk memori dulu,</text>
  <text x="514" y="294" font-size="11.5" text-anchor="start" fill="#5f5f5f">file urut digabung oleh compaction</text>
  <text x="24" y="340" font-size="11.5" text-anchor="start" fill="#5f5f5f">Ukuran halaman bbolt mengikuti halaman OS, yaitu 4 KB di laptop ini. Batas value log Badger versi 4</text>
  <text x="24" y="356" font-size="11.5" text-anchor="start" fill="#5f5f5f">bawaannya 1 MB, jadi value 100 byte di benchmark ini disimpan di SSTable.</text>
</svg>
