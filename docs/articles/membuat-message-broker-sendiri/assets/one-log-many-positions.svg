  <rect x="180" y="188" width="168" height="32" rx="6" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="192" y="208" fill="#1f1f1f">queue stok</text>
  <rect x="296" y="196" width="12" height="16" rx="2" fill="#a8a69c" stroke="#a8a69c" stroke-width="1.25"/>
  <rect x="312" y="196" width="12" height="16" rx="2" fill="#a8a69c" stroke="#a8a69c" stroke-width="1.25"/>
  <rect x="328" y="196" width="12" height="16" rx="2" fill="#a8a69c" stroke="#a8a69c" stroke-width="1.25"/>
  <path d="M136 208L180 204" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <rect x="180" y="232" width="168" height="32" rx="6" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
