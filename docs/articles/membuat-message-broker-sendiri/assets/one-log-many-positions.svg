  <text x="40" y="108" font-weight="600" fill="#1f1f1f">RabbitMQ</text>
  <text x="40" y="126" font-size="11.5" fill="#5f5f5f">exchange menyalin pesan ke setiap queue</text>
  <rect x="40" y="186" width="96" height="44" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="88" y="212" font-weight="600" text-anchor="middle" fill="#1f1f1f">exchange</text>
