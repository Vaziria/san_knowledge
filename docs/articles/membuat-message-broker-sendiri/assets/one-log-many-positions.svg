<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="1520" height="688" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Satu log untuk semua subscriber, satu posisi baca untuk masing-masing">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
