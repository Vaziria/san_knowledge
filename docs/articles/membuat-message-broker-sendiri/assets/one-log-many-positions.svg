  </defs>
  <rect x="0" y="0" width="760" height="344" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Satu log untuk semua subscriber, satu posisi baca untuk masing-masing</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Kiri, RabbitMQ menaruh salinan pesan di setiap queue. Kanan, brokerku menulis setiap pesan sekali saja.</text>
