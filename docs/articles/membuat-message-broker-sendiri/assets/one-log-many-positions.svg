  <path d="M136 208L180 248" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <text x="40" y="304" font-size="11.5" fill="#5f5f5f">Tiga queue berarti tiga salinan dari setiap pesan.</text>
