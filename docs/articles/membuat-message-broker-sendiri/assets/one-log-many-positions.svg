  <rect x="560" y="236" width="150" height="44" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="635" y="255" font-weight="600" text-anchor="middle" fill="#1f1f1f">stok</text>
