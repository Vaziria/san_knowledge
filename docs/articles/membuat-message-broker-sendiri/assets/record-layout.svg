<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" width="1520" height="608" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Setiap pesan disimpan sebagai record dengan checksum">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="304" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Setiap pesan disimpan sebagai record dengan checksum</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">CRC-32C dihitung dari ID sampai akhir data. Record yang terpotong tidak lolos pemeriksaan, lalu dibuang.</text>
  <text x="24" y="90" font-size="11.5" fill="#5f5f5f">Satu record</text>
  <rect x="24" y="108" width="70" height="44" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="59.0" y="127" font-weight="600" text-anchor="middle" fill="#1f1f1f">panjang</text>
  <text x="59.0" y="143" font-size="11" text-anchor="middle" fill="#5f5f5f">4 byte</text>
  <rect x="94" y="108" width="80" height="44" rx="0" fill="#2f76d6" fill-opacity="0.14" stroke="#2f76d6" stroke-width="1.25"/>
  <text x="134.0" y="127" font-weight="600" text-anchor="middle" fill="#1f1f1f">CRC-32C</text>
  <text x="134.0" y="143" font-size="11" text-anchor="middle" fill="#5f5f5f">4 byte</text>
  <rect x="174" y="108" width="110" height="44" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="229.0" y="127" font-weight="600" text-anchor="middle" fill="#1f1f1f">ID</text>
  <text x="229.0" y="143" font-size="11" text-anchor="middle" fill="#5f5f5f">8 byte</text>
  <rect x="284" y="108" width="130" height="44" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="349.0" y="127" font-weight="600" text-anchor="middle" fill="#1f1f1f">waktu</text>
  <text x="349.0" y="143" font-size="11" text-anchor="middle" fill="#5f5f5f">8 byte</text>
  <rect x="414" y="108" width="322" height="44" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="575.0" y="127" font-weight="600" text-anchor="middle" fill="#1f1f1f">data</text>
  <text x="575.0" y="143" font-size="11" text-anchor="middle" fill="#5f5f5f">sepanjang angka panjang</text>
  <text x="27" y="103" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#5f5f5f">0</text>
  <text x="97" y="103" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#5f5f5f">4</text>
  <text x="177" y="103" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#5f5f5f">8</text>
  <text x="287" y="103" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#5f5f5f">16</text>
  <text x="417" y="103" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#5f5f5f">24</text>
  <path d="M174 158V166H736V158" fill="none" stroke="#2f76d6" stroke-width="1.25"/>
  <text x="455" y="182" font-size="11.5" text-anchor="middle" fill="#2f76d6">dicakup CRC-32C</text>
  <text x="24" y="214" font-size="11.5" fill="#5f5f5f">File log setelah listrik padam di tengah menulis record ketiga</text>
  <rect x="24" y="224" width="160" height="36" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="104" y="247" text-anchor="middle" fill="#1f1f1f">record ID 1</text>
  <rect x="184" y="224" width="160" height="36" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="264" y="247" text-anchor="middle" fill="#1f1f1f">record ID 2</text>
  <rect x="344" y="224" width="100" height="36" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="394" y="247" font-size="11" text-anchor="middle" fill="#5f5f5f">ID 3, terpotong</text>
  <path d="M344 216V270" fill="none" stroke="#2f76d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="344" y="286" font-size="11.5" text-anchor="middle" fill="#2f76d6">ujung log setelah dibuka</text>
  <text x="470" y="240" font-size="11.5" fill="#5f5f5f">Saat dibuka, file dipotong tepat</text>
  <text x="470" y="256" font-size="11.5" fill="#5f5f5f">setelah record utuh terakhir.</text>
</svg>
