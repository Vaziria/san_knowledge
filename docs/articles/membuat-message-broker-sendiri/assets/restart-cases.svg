<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="1520" height="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Saat broker dibuka lagi, metadata mengikuti log">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Saat broker dibuka lagi, metadata mengikuti log</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Garis biru adalah ujung log setelah diperiksa. Kotak putus-putus adalah record yang tidak sampai ke disk.</text>
  <rect x="24" y="84" width="224" height="196" rx="10" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="40" y="108" font-weight="600" fill="#1f1f1f">Posisi di belakang ujung log</text>
  <text x="40" y="126" font-size="11" fill="#5f5f5f">ack terakhir belum sampai ke disk</text>
  <rect x="268" y="84" width="224" height="196" rx="10" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="284" y="108" font-weight="600" fill="#1f1f1f">Posisi di depan ujung log</text>
  <text x="284" y="126" font-size="11" fill="#5f5f5f">record terakhir belum sampai ke disk</text>
  <rect x="512" y="84" width="224" height="196" rx="10" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="528" y="108" font-weight="600" fill="#1f1f1f">Cadangan ID di depan log</text>
  <text x="528" y="126" font-size="11" fill="#5f5f5f">broker mati sebelum ditutup rapi</text>
  <rect x="40" y="150" width="36" height="30" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="58" y="170" font-size="11" font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#1f1f1f">1</text>
  <rect x="76" y="150" width="36" height="30" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="94" y="170" font-size="11" font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#1f1f1f">2</text>
  <rect x="112" y="150" width="36" height="30" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="130" y="170" font-size="11" font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#1f1f1f">3</text>
  <rect x="148" y="150" width="36" height="30" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="166" y="170" font-size="11" font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#1f1f1f">4</text>
  <rect x="184" y="150" width="36" height="30" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="202" y="170" font-size="11" font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#1f1f1f">5</text>
  <path d="M220 144V186" fill="none" stroke="#2f76d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="80" y="206" width="104" height="30" rx="6" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="132" y="225" font-weight="600" text-anchor="middle" fill="#1f1f1f">email</text>
  <path d="M132 206L130 182" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <text x="40" y="258" font-size="11" fill="#5f5f5f">email melanjutkan dari pesan 3,</text>
  <text x="40" y="272" font-size="11" fill="#5f5f5f">pesan yang belum di-ack dikirim lagi.</text>
  <rect x="284" y="150" width="36" height="30" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="302" y="170" font-size="11" font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#1f1f1f">1</text>
  <rect x="320" y="150" width="36" height="30" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="338" y="170" font-size="11" font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#1f1f1f">2</text>
  <rect x="356" y="150" width="36" height="30" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="374" y="170" font-size="11" font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#5f5f5f">3</text>
  <path d="M356 144V186" fill="none" stroke="#2f76d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="364" y="206" width="104" height="30" rx="6" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="416" y="225" font-weight="600" text-anchor="middle" fill="#1f1f1f">email</text>
  <path d="M416 206L394 182" fill="none" stroke="#a8a69c" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-grey)"/>
  <path d="M388 196H360" fill="none" stroke="#2f76d6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="284" y="258" font-size="11" fill="#5f5f5f">Posisi email mundur ke ujung log.</text>
  <text x="284" y="272" font-size="11" fill="#5f5f5f">Pesan 3 hilang bersama listriknya.</text>
  <rect x="528" y="150" width="36" height="30" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="546" y="170" font-size="11" font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#1f1f1f">1</text>
  <rect x="564" y="150" width="36" height="30" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="582" y="170" font-size="11" font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#1f1f1f">2</text>
  <rect x="600" y="150" width="36" height="30" rx="0" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="618" y="170" font-size="11" font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#1f1f1f">3</text>
  <path d="M636 144V186" fill="none" stroke="#2f76d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="644" y="162" font-size="11" fill="#5f5f5f">cadangan</text>
  <text x="644" y="178" font-size="11" font-family="Consolas, Menlo, monospace" fill="#1f1f1f">ID 1000</text>
  <rect x="528" y="206" width="120" height="30" rx="6" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="588" y="225" font-size="11" font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#1f1f1f">pesan 1001</text>
  <text x="528" y="258" font-size="11" fill="#5f5f5f">ID 4 sampai 1000 tidak pernah</text>
  <text x="528" y="272" font-size="11" fill="#5f5f5f">dipakai, jadi tidak ada ID kembar.</text>
</svg>
