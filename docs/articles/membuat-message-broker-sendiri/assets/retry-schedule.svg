<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="1520" height="636" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Jeda berlipat dua, lalu pesan dilewati pada kegagalan ke-10">
