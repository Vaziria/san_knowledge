  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Jeda berlipat dua, lalu pesan dilewati pada kegagalan ke-10</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Garis di bawah digambar sesuai waktu, dan pita biru adalah jeda. Hampir semua waktu tunggu ada di jeda terakhir.</text>
