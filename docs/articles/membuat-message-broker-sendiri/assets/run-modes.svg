  <rect x="386" y="300" width="92" height="34" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="432" y="322" text-anchor="middle" fill="#1f1f1f">CLI</text>
  <text x="268" y="360" font-size="11" fill="#5f5f5f">Satu proses dan satu port untuk</text>
  <text x="268" y="376" font-size="11" fill="#5f5f5f">aplikasi dan broker.</text>
  <rect x="512" y="116" width="224" height="150" rx="10" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="526" y="138" font-weight="600" fill="#1f1f1f">brokerku server :8080</text>
  <rect x="526" y="150" width="196" height="102" rx="8" fill="#2f76d6" fill-opacity="0.12" stroke="#2f76d6" stroke-width="1.25"/>
  <text x="624" y="206" font-weight="600" text-anchor="middle" fill="#1f1f1f">broker</text>
  <path d="M552 300V256" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <path d="M624 300V256" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <path d="M696 300V256" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <rect x="526" y="300" width="56" height="34" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="554" y="322" font-size="11.5" text-anchor="middle" fill="#1f1f1f">toko</text>
  <rect x="594" y="300" width="60" height="34" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="624" y="322" font-size="11.5" text-anchor="middle" fill="#1f1f1f">pembaca</text>
  <rect x="666" y="300" width="56" height="34" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="694" y="322" font-size="11.5" text-anchor="middle" fill="#1f1f1f">CLI</text>
  <text x="512" y="360" font-size="11" fill="#5f5f5f">Semua program memanggil broker</text>
  <text x="512" y="376" font-size="11" fill="#5f5f5f">lewat HTTP.</text>
