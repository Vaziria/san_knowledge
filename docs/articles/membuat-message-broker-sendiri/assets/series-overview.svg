<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="1520" height="808" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Broker yang kita bangun dalam enam bagian">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="404" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Broker yang kita bangun dalam enam bagian</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Setiap kotak diberi nomor bagian yang membangunnya.</text>
  <rect x="24" y="112" width="120" height="52" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="84" y="136" font-weight="600" text-anchor="middle" fill="#1f1f1f">producer</text>
  <text x="84" y="153" font-size="10.5" font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#5f5f5f">POST /topics/...</text>
  <path d="M144 138H178" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <rect x="178" y="112" width="150" height="52" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="253" y="136" font-weight="600" text-anchor="middle" fill="#1f1f1f">API HTTP</text>
  <text x="253" y="153" font-size="11" text-anchor="middle" fill="#5f5f5f">Bagian 1, 3, 6</text>
  <path d="M328 138H362" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <rect x="362" y="104" width="374" height="118" rx="10" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="378" y="126" font-weight="600" fill="#1f1f1f">di disk</text>
  <rect x="378" y="138" width="168" height="70" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="462" y="162" font-weight="600" text-anchor="middle" fill="#1f1f1f">log per topic</text>
  <text x="462" y="180" font-size="11" text-anchor="middle" fill="#5f5f5f">record dan CRC-32C</text>
  <text x="462" y="196" font-size="11" text-anchor="middle" fill="#5f5f5f">Bagian 1</text>
  <rect x="556" y="138" width="166" height="70" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="639" y="162" font-weight="600" text-anchor="middle" fill="#1f1f1f">slot metadata</text>
  <text x="639" y="180" font-size="11" text-anchor="middle" fill="#5f5f5f">posisi baca, percobaan</text>
  <text x="639" y="196" font-size="11" text-anchor="middle" fill="#5f5f5f">Bagian 2 dan 4</text>
  <path d="M549 222V252" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <rect x="362" y="252" width="374" height="44" rx="8" fill="#2f76d6" fill-opacity="0.12" stroke="#2f76d6" stroke-width="1.25"/>
  <text x="549" y="279" font-weight="600" text-anchor="middle" fill="#1f1f1f">loop pengantar, Bagian 3</text>
  <path d="M450 296V326" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <path d="M640 296V326" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <rect x="362" y="326" width="176" height="58" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="450" y="349" font-weight="600" text-anchor="middle" fill="#1f1f1f">stream pull</text>
  <text x="450" y="367" font-size="11" text-anchor="middle" fill="#5f5f5f">ack, timeout, Bagian 3</text>
  <rect x="552" y="326" width="184" height="58" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="644" y="349" font-weight="600" text-anchor="middle" fill="#1f1f1f">worker pool, Bagian 5</text>
  <text x="644" y="367" font-size="11" text-anchor="middle" fill="#5f5f5f">webhook dan jeda, Bagian 4</text>
  <rect x="24" y="252" width="304" height="132" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="40" y="276" font-weight="600" fill="#1f1f1f">Cara menjalankannya, Bagian 6</text>
  <text x="40" y="300" font-size="11.5" fill="#5f5f5f">tertanam di program Go</text>
  <text x="40" y="322" font-size="11.5" fill="#5f5f5f">dipasang di server HTTP aplikasi</text>
  <text x="40" y="344" font-size="11.5" fill="#5f5f5f">berdiri sendiri, dengan CLI</text>
  <text x="40" y="368" font-size="11" fill="#5f5f5f">Semuanya memakai package yang sama.</text>
</svg>
