<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="1520" height="784" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Jawaban webhook menentukan apa yang terjadi pada pesan">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="392" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Jawaban webhook menentukan apa yang terjadi pada pesan</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Loop menyerahkan pesan ke pengirim webhook, lalu menerapkan hasilnya. Loop tidak pernah menunggu panggilan itu.</text>
  <rect x="24" y="92" width="150" height="58" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="99" y="116" font-weight="600" text-anchor="middle" fill="#1f1f1f">loop pengantar</text>
  <text x="99" y="134" font-size="11" text-anchor="middle" fill="#5f5f5f">satu goroutine</text>
  <rect x="240" y="92" width="160" height="58" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="320" y="116" font-weight="600" text-anchor="middle" fill="#1f1f1f">pengirim webhook</text>
  <text x="320" y="134" font-size="11" text-anchor="middle" fill="#5f5f5f">satu goroutine</text>
  <rect x="466" y="84" width="270" height="120" rx="10" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="482" y="106" font-weight="600" fill="#1f1f1f">webhook stok</text>
  <text x="482" y="128" font-size="11" font-family="Consolas, Menlo, monospace" fill="#1f1f1f">POST /</text>
  <text x="482" y="145" font-size="11" font-family="Consolas, Menlo, monospace" fill="#1f1f1f">Brokerku-Id: 1</text>
  <text x="482" y="162" font-size="11" font-family="Consolas, Menlo, monospace" fill="#1f1f1f">Brokerku-Topic: pesanan</text>
  <text x="482" y="179" font-size="11" font-family="Consolas, Menlo, monospace" fill="#1f1f1f">Brokerku-Time: waktu pesan</text>
  <text x="482" y="196" font-size="11" fill="#5f5f5f">body: data pesan apa adanya</text>
  <path d="M174 112H240" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <text x="207" y="104" font-size="11" text-anchor="middle" fill="#5f5f5f">pesan</text>
  <path d="M400 112H466" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <text x="433" y="104" font-size="11" text-anchor="middle" fill="#5f5f5f">POST</text>
  <path d="M466 140H400" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <text x="433" y="156" font-size="11" text-anchor="middle" fill="#5f5f5f">jawaban</text>
  <text x="433" y="170" font-size="11" text-anchor="middle" fill="#5f5f5f">≤ 5 detik</text>
  <path d="M240 134H174" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <text x="207" y="150" font-size="11" text-anchor="middle" fill="#5f5f5f">hasil</text>
  <path d="M99 150V232" fill="none" stroke="#a8a69c" stroke-width="1.5"/>
  <path d="M99 232H620" fill="none" stroke="#a8a69c" stroke-width="1.5"/>
  <path d="M130 232V256" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <path d="M380 232V256" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <path d="M620 232V256" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <rect x="24" y="256" width="220" height="112" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="40" y="280" font-weight="600" font-family="Consolas, Menlo, monospace" fill="#1f1f1f">2xx</text>
  <text x="40" y="302" fill="#1f1f1f">Pesan sampai.</text>
  <text x="40" y="322" font-size="11" fill="#5f5f5f">Posisi baca maju, dan pesan</text>
  <text x="40" y="338" font-size="11" fill="#5f5f5f">berikutnya bisa dikirim.</text>
  <rect x="262" y="256" width="236" height="112" rx="8" fill="#2f76d6" fill-opacity="0.1" stroke="#2f76d6" stroke-width="1.25"/>
  <text x="278" y="280" font-weight="600" fill="#1f1f1f">timeout, koneksi gagal,</text>
  <text x="278" y="297" font-weight="600" font-family="Consolas, Menlo, monospace" fill="#1f1f1f">5xx, 408, 429</text>
  <text x="278" y="318" fill="#2f76d6">Mungkin sembuh sendiri.</text>
  <text x="278" y="338" font-size="11" fill="#5f5f5f">Dicoba lagi setelah jeda yang</text>
  <text x="278" y="354" font-size="11" fill="#5f5f5f">berlipat dua, paling banyak 10 kali.</text>
  <rect x="516" y="256" width="220" height="112" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="532" y="280" font-weight="600" fill="#1f1f1f">status lain</text>
  <text x="532" y="297" font-size="11" fill="#5f5f5f">seperti 400, 404, 302</text>
  <text x="532" y="318" fill="#1f1f1f">Penerima menolak pesan.</text>
  <text x="532" y="338" font-size="11" fill="#5f5f5f">Pesan dilewati, dan alasannya</text>
  <text x="532" y="354" font-size="11" fill="#5f5f5f">ditulis di catatan broker.</text>
</svg>
