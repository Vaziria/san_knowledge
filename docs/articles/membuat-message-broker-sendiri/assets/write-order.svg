<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="1520" height="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Log selalu sampai ke disk sebelum metadata">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Log selalu sampai ke disk sebelum metadata</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Setiap tulisan masuk ke memori OS lebih dulu. Setiap detik, broker memanggil fsync untuk log, lalu untuk metadata.</text>
  <rect x="24" y="84" width="172" height="48" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="110" y="104" font-weight="600" text-anchor="middle" fill="#1f1f1f">Publish</text>
  <text x="110" y="121" font-size="11.5" text-anchor="middle" fill="#5f5f5f">record ditulis ke OS</text>
  <rect x="204" y="84" width="172" height="48" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="290" y="104" font-weight="600" text-anchor="middle" fill="#1f1f1f">Ack</text>
  <text x="290" y="121" font-size="11.5" text-anchor="middle" fill="#5f5f5f">posisi ditulis ke OS</text>
  <rect x="384" y="84" width="172" height="48" rx="8" fill="#2f76d6" fill-opacity="0.1" stroke="#2f76d6" stroke-width="1.25"/>
  <text x="470" y="104" font-weight="600" text-anchor="middle" fill="#1f1f1f">Setiap detik, langkah 1</text>
  <text x="470" y="121" font-size="11.5" text-anchor="middle" fill="#5f5f5f">fsync semua log</text>
  <rect x="564" y="84" width="172" height="48" rx="8" fill="#2f76d6" fill-opacity="0.1" stroke="#2f76d6" stroke-width="1.25"/>
  <text x="650" y="104" font-weight="600" text-anchor="middle" fill="#1f1f1f">Setiap detik, langkah 2</text>
  <text x="650" y="121" font-size="11.5" text-anchor="middle" fill="#5f5f5f">fsync file metadata</text>
  <path d="M556 108H564" fill="none" stroke="#2f76d6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M376 108H384" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <path d="M196 108H204" fill="none" stroke="#a8a69c" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <rect x="24" y="156" width="348" height="120" rx="10" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="40" y="180" font-weight="600" fill="#1f1f1f">Program broker mati mendadak</text>
  <text x="40" y="202" font-size="11.5" fill="#5f5f5f">Memori OS tetap ada, jadi semua yang sudah</text>
  <text x="40" y="219" font-size="11.5" fill="#5f5f5f">ditulis selamat, walaupun belum di-fsync.</text>
  <text x="40" y="236" font-size="11.5" fill="#5f5f5f">Hanya ID berikutnya yang melompat</text>
  <text x="40" y="253" font-size="11.5" fill="#5f5f5f">melewati cadangan ID.</text>
  <rect x="388" y="156" width="348" height="120" rx="10" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="404" y="180" font-weight="600" fill="#1f1f1f">Listrik padam atau OS mati</text>
  <text x="404" y="202" font-size="11.5" fill="#5f5f5f">Hanya yang sudah di-fsync yang selamat.</text>
  <text x="404" y="219" font-size="11.5" fill="#5f5f5f">Posisi yang tertinggal membuat pesan</text>
  <text x="404" y="236" font-size="11.5" fill="#5f5f5f">dikirim lagi. Posisi yang mendahului log</text>
  <text x="404" y="253" font-size="11.5" fill="#5f5f5f">dimundurkan ke ujung log.</text>
</svg>
