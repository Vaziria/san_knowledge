<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="1520" height="712" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Tombol Jadwalkan hanya ditekan setelah halaman dibaca ulang">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="356" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Tombol Jadwalkan hanya ditekan setelah halaman dibaca ulang</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Langkah 1 sampai 4 mengisi composer. Langkah 5 memeriksa apa yang ditampilkan halaman.</text>

  <!-- Row 1 -->
  <g fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25">
    <rect x="24" y="84" width="160" height="60" rx="8"/>
    <rect x="208" y="84" width="160" height="60" rx="8"/>
    <rect x="392" y="84" width="160" height="60" rx="8"/>
    <rect x="576" y="84" width="160" height="60" rx="8"/>
  </g>
  <!-- Row 2 -->
  <g fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25">
    <rect x="24" y="190" width="232" height="60" rx="8"/>
    <rect x="316" y="190" width="200" height="60" rx="8"/>
  </g>
  <rect x="576" y="190" width="160" height="60" rx="8" fill="#2f76d6" fill-opacity="0.12" stroke="#2f76d6" stroke-width="1.5"/>
  <!-- Stop box -->
  <rect x="496" y="282" width="240" height="50" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25" stroke-dasharray="4 3"/>

  <g text-anchor="middle">
    <text x="104" y="109" font-weight="600" fill="#1f1f1f">1. Buka composer</text>
    <text x="104" y="127" font-size="11.5" fill="#5f5f5f">tab dibawa ke depan</text>
    <text x="288" y="109" font-weight="600" fill="#1f1f1f">2. Tempel teks</text>
    <text x="288" y="127" font-size="11.5" fill="#5f5f5f">lewat event paste</text>
    <text x="472" y="109" font-weight="600" fill="#1f1f1f">3. Lampirkan file</text>
    <text x="472" y="127" font-size="11.5" fill="#5f5f5f">files lewat DataTransfer</text>
    <text x="656" y="109" font-weight="600" fill="#1f1f1f">4. Atur jadwal</text>
    <text x="656" y="127" font-size="11.5" fill="#5f5f5f">pemilih tanggal dan jam</text>

    <text x="656" y="215" font-weight="600" fill="#1f1f1f">5. Baca ulang</text>
    <text x="656" y="233" font-size="11.5" fill="#1f1f1f">teks, lampiran, waktu</text>
    <text x="416" y="215" font-weight="600" fill="#1f1f1f">6. Tekan Jadwalkan</text>
    <text x="416" y="233" font-size="11.5" fill="#5f5f5f">hanya jika langkah 5 lolos</text>
    <text x="140" y="215" font-weight="600" fill="#1f1f1f">7. Cek daftar terjadwal</text>
    <text x="140" y="233" font-size="11.5" fill="#5f5f5f">tepat satu baris yang sama</text>

    <text x="616" y="303" font-weight="600" fill="#1f1f1f">Berhenti tanpa menekan tombol</text>
    <text x="616" y="320" font-size="11.5" fill="#5f5f5f">simpan screenshot, laporkan</text>
  </g>

  <text x="546" y="212" font-size="11.5" fill="#2f76d6" text-anchor="middle">cocok</text>
  <text x="664" y="271" font-size="11.5" fill="#5f5f5f">berbeda</text>

  <!-- Flows -->
  <g fill="none" stroke-width="1.5">
    <path d="M184 114H208" stroke="#a8a69c" marker-end="url(#arrow-grey)"/>
    <path d="M368 114H392" stroke="#a8a69c" marker-end="url(#arrow-grey)"/>
    <path d="M552 114H576" stroke="#a8a69c" marker-end="url(#arrow-grey)"/>
    <path d="M656 144V190" stroke="#a8a69c" marker-end="url(#arrow-grey)"/>
    <path d="M576 220H516" stroke="#2f76d6" marker-end="url(#arrow)"/>
    <path d="M316 220H256" stroke="#a8a69c" marker-end="url(#arrow-grey)"/>
    <path d="M656 250V282" stroke="#a8a69c" marker-end="url(#arrow-grey)"/>
  </g>
</svg>
