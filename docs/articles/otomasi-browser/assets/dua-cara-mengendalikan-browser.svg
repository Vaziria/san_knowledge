<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="1520" height="760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="CDP mengendalikan browser terpisah, extension bekerja di browsermu sendiri">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f76d6"/></marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a69c"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">CDP mengendalikan browser terpisah, extension bekerja di browsermu sendiri</text>
  <text x="24" y="56" font-size="11.5" fill="#5f5f5f">Kiri lewat debugging port ke profil terpisah. Kanan lewat server lokal ke browser yang sudah login.</text>

  <!-- Panels -->
  <rect x="24" y="76" width="344" height="280" rx="10" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <rect x="392" y="76" width="344" height="280" rx="10" fill="#f1f0eb" stroke="#a8a69c" stroke-width="1.25"/>
  <text x="40" y="99" font-size="13" font-weight="600" fill="#1f1f1f">Cara 1. Browser terpisah lewat CDP</text>
  <text x="408" y="99" font-size="13" font-weight="600" fill="#1f1f1f">Cara 2. Extension di browser harianmu</text>

  <!-- Left: program and separate browser -->
  <rect x="48" y="114" width="296" height="48" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <rect x="48" y="212" width="296" height="96" rx="8" fill="#2f76d6" fill-opacity="0.1" stroke="#2f76d6" stroke-width="1.25"/>

  <!-- Right: program, local server, everyday browser -->
  <rect x="416" y="114" width="120" height="48" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <rect x="592" y="114" width="120" height="48" rx="8" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <rect x="416" y="200" width="296" height="108" rx="8" fill="#2f76d6" fill-opacity="0.1" stroke="#2f76d6" stroke-width="1.25"/>
  <rect x="432" y="230" width="108" height="56" rx="6" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>
  <rect x="598" y="230" width="108" height="56" rx="6" fill="#ffffff" stroke="#a8a69c" stroke-width="1.25"/>

  <g text-anchor="middle">
    <text x="196" y="134" font-weight="600" fill="#1f1f1f">Program kamu</text>
    <text x="196" y="151" font-size="11.5" fill="#5f5f5f">Puppeteer, Playwright, atau chromedp</text>
    <text x="196" y="236" font-weight="600" fill="#1f1f1f">Browser terpisah</text>
    <text x="196" y="256" font-size="11.5" fill="#1f1f1f">profil sendiri lewat --user-data-dir</text>
    <text x="196" y="274" font-size="11.5" fill="#1f1f1f">login sekali lagi di profil ini</text>
    <text x="196" y="292" font-size="11.5" fill="#1f1f1f">navigator.webdriver bisa true</text>

    <text x="476" y="134" font-weight="600" fill="#1f1f1f">Program kamu</text>
    <text x="476" y="151" font-size="11.5" fill="#5f5f5f">script di terminal</text>
    <text x="652" y="134" font-weight="600" fill="#1f1f1f">Server lokal</text>
    <text x="652" y="151" font-size="11.5" font-family="Consolas, Menlo, monospace" fill="#5f5f5f">127.0.0.1</text>
    <text x="486" y="254" font-weight="600" fill="#1f1f1f">Tab</text>
    <text x="486" y="271" font-size="11.5" fill="#5f5f5f">sudah login</text>
    <text x="652" y="254" font-weight="600" fill="#1f1f1f">Extension</text>
    <text x="652" y="271" font-size="11.5" fill="#5f5f5f">Manifest V3</text>
  </g>
  <text x="428" y="219" font-size="12" font-weight="600" fill="#1f1f1f">Browser harianmu</text>

  <!-- Labels on arrows -->
  <text x="206" y="192" font-size="11.5" fill="#2f76d6">CDP lewat debugging port</text>
  <text x="564" y="132" font-size="11.5" fill="#5f5f5f" text-anchor="middle">perintah</text>
  <text x="642" y="188" font-size="11.5" fill="#5f5f5f" text-anchor="end">extension yang menghubungi</text>
  <text x="569" y="301" font-size="11.5" fill="#2f76d6" text-anchor="middle">jalankan script</text>

  <!-- Notes -->
  <text x="40" y="334" font-size="11.5" fill="#5f5f5f">Cocok untuk server tanpa layar dan akun uji.</text>
  <text x="408" y="334" font-size="11.5" fill="#5f5f5f">Perlu sakelar Allow User Scripts menyala.</text>

  <!-- Flows -->
  <g fill="none" stroke-width="1.5">
    <path d="M196 162V212" stroke="#2f76d6" marker-end="url(#arrow)"/>
    <path d="M536 144H592" stroke="#a8a69c" marker-end="url(#arrow-grey)"/>
    <path d="M652 230V162" stroke="#a8a69c" marker-end="url(#arrow-grey)"/>
    <path d="M598 258H540" stroke="#2f76d6" marker-end="url(#arrow)"/>
  </g>
</svg>
