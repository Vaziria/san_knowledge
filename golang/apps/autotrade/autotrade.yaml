# All of autotrade's settings (docs/readme.md). The limits are the user's:
# the trading loop must not edit this file. The API key is not here: it is
# read from BINANCE_TESTNET_API_KEY / BINANCE_TESTNET_API_SECRET, or from .env.

# The pairs the loop trades ("Pair That Traded" in docs/knowledge.md). Each is
# traded on its own: its own position, and the limits below per position.
pairs: [BTCUSDT, ETHUSDT, BNBUSDT, BCHUSDT]

interval: 5m                        # the trading interval: a tick after each close
context_intervals: [15m, 1h, 4h]
candles: 300                         # per timeframe, for the indicators

# Orders go only to the Binance test network (or demo-fapi.binance.com).
trade_url: https://testnet.binancefuture.com
# Candles come from the real market: public, read-only, never sent a key.
market_url: https://fapi.binance.com

leverage: 5
max_position_usdt: 1000              # notional of a new position
max_risk_usdt: 100                   # loss at the stop of a new position; 0 = no cap

journal: data/journal.jsonl          # relative to this file

# The second venue: a MetaTrader 5 demo account (MIFX), through the
# AutotradeBridge EA running in the terminal (USAGE.md, "MetaTrader 5").
# Its pairs trade there, with the limits below in the account currency;
# the pairs above stay on Binance. Orders go to a demo account only.
mt5:
  pairs: []                          # MetaTrader symbols as the broker spells them, e.g. [XAUUSD]; [] = off
  leverage: 100                      # the account's leverage (1:100), set by the broker: `check` shows it
  max_position: 5000                 # notional of a new position (one lot of XAUUSD is 100 oz)
  max_risk: 50                       # loss at the stop of a new position; 0 = no cap
  # bridge: ""                       # folder the EA answers in; default MetaTrader's Common\Files\autotrade

# Coded entry rules the snapshot checks, in priority order; [] = no signals.
setups: []
fee_rate: 0.0005                     # one fill: 0.0005 = 0.05%
