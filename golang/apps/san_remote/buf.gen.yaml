version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/wargasipil/san_remote/gen
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
  # The extension's client (typescripts/san_remote_extension). It only talks
  # BrowserService; the site services (Threads, X, Facebook, Vidara, Medium,
  # LinkedIn, TikTok, ChatGPT, Gemini, Claude, YouTube, Telegram) stay on the
  # Go side.
  - local: protoc-gen-es
    out: ../../../typescripts/san_remote_extension/src/gen
    opt: target=ts
    exclude_types:
      - san.remote.threads.v1
      - san.remote.x.v1
      - san.remote.facebook.v1
      - san.remote.vidara.v1
      - san.remote.medium.v1
      - san.remote.linkedin.v1
      - san.remote.tiktok.v1
      - san.remote.chatgpt.v1
      - san.remote.gemini.v1
      - san.remote.claude.v1
      - san.remote.youtube.v1
      - san.remote.telegram.v1
