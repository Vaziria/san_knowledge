syntax = "proto3";

package san.remote.gemini.v1;

// GeminiService is the Gemini service (internal/gemini) over Connect, served
// by `san_remote api` for other programs (the tower's workflows). Like the
// CLI, it works in a tab of the user's browser on gemini.google.com, the way
// a person asks in Gemini's prompt box; an ask brings the tab to the front,
// since Gemini sends only from a shown page.
service GeminiService {
  // GetStatus says whether the browser is signed in to Gemini, and as whom.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Ask sends a prompt and returns the answer, once Gemini has written it.
  rpc Ask(AskRequest) returns (AskResponse);
}

// Status is the browser's Gemini session.
message Status {
  bool signed_in = 1;
  // The Google account's name.
  string name = 2;
}

message GetStatusRequest {
  // The browser's id or name; may be empty when only one is attached.
  string browser = 1;
}

message GetStatusResponse {
  Status status = 1;
}

message AskRequest {
  string browser = 1;
  string prompt = 2;
  // A normal chat, kept in the history, instead of a Temporary chat.
  bool keep = 3;
  // How long to wait for the answer; 0 is 10 minutes.
  uint32 wait_seconds = 4;
  // Leave the tab open on the chat once the ask is over, for the user to
  // read on or go on in it; otherwise it is closed.
  bool stay = 5;
  // Continue the kept chat at this link (https://gemini.google.com/app/<id>); empty
  // starts a new chat.
  string chat = 6;
  // Keep the tab open on the kept chat for the chat's next ask, which goes on
  // in it, and close it once this long goes by without one; 0 closes it
  // (unless stay).
  uint32 idle_seconds = 7;
}

message AskResponse {
  // The answer as Gemini's Copy button gives it.
  string text = 1;
  // The chat's link, for a kept chat.
  string chat = 2;
  bool temporary = 3;
}
