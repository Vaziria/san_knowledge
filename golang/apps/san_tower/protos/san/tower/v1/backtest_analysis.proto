syntax = "proto3";

package san.tower.v1;

import "google/protobuf/timestamp.proto";

// BacktestAnalysisService opens folders of San Backtest reports
// (golang/packages/san_backtest, `--out` / Result.Save) on the tower's
// Backtest Analysis page (the user, 2026-11-15: "We should have menu in
// tower named backtest" ... "Sorry 'backtest analysis'"; "It can open
// directory that contain report log that generated by backtest"). It only
// reads reports and never starts a run (the user, 2026-11-15: "1a"), and it
// never writes, moves or deletes anything in a report folder. The tower
// reads the report files itself (run.json, the CSVs, decisions.jsonl): it
// does not import san_backtest.
//
// Paths are this computer's: the page cannot name a real path from the
// browser, so ListFolders is the folder picker. The service answers callers
// on this computer only, also on a tower started with --lan. The folders
// opened last are kept in the tower's settings (tower.json), not in the
// report folders.
service BacktestAnalysisService {
  // ListFolders lists a folder's subfolders for the picker, by name, and
  // says which are reports. An empty path lists the drives (Windows) or
  // the root and the home folder.
  rpc ListFolders(BacktestListFoldersRequest) returns (BacktestListFoldersResponse);
  // OpenFolder finds the reports in a folder and its subfolders (a folder
  // with run.json, or an older report with summary.txt and trades.csv) and
  // lists them with their key stats. It remembers the folder as recent.
  rpc OpenFolder(BacktestOpenFolderRequest) returns (BacktestOpenFolderResponse);
  // GetRun reads one report: what ran, its stats, trades, missed signals,
  // equity curve and walk-forward windows.
  rpc GetRun(BacktestGetRunRequest) returns (BacktestGetRunResponse);
  // GetCandles reads a report's candles (candles.csv) for the chart, in
  // the step timeframe or a higher one built from the step candles.
  rpc GetCandles(BacktestGetCandlesRequest) returns (BacktestGetCandlesResponse);
  // GetDecisions reads a report's decision log (decisions.jsonl): the
  // lines in a time range, or the ones nearest a time.
  rpc GetDecisions(BacktestGetDecisionsRequest) returns (BacktestGetDecisionsResponse);
  // ListRecentFolders gives the folders opened last, newest first.
  rpc ListRecentFolders(BacktestListRecentFoldersRequest) returns (BacktestListRecentFoldersResponse);
  // ForgetRecentFolder takes a folder off the recent list (the folder
  // itself is not touched).
  rpc ForgetRecentFolder(BacktestForgetRecentFolderRequest) returns (BacktestForgetRecentFolderResponse);
  // WatchFolder sends the folder's reports, then each report that appears,
  // changes or goes away (the folder is read every few seconds), with a
  // heartbeat every 15 seconds.
  rpc WatchFolder(BacktestWatchFolderRequest) returns (stream BacktestWatchFolderResponse);
  // ListPaperRuns lists the Live Trading page's paper sessions as runs
  // (the "Paper sessions" source next to Open folder): each one's path is
  // "paper:<id>", which GetRun, GetCandles and GetDecisions open like a
  // report folder, so a session compares with backtests.
  rpc ListPaperRuns(BacktestListPaperRunsRequest) returns (BacktestOpenFolderResponse);
}

message BacktestListPaperRunsRequest {}

message BacktestListFoldersRequest {
  string path = 1;
}

message BacktestFolderEntry {
  string name = 1;
  string path = 2;
  // report: the folder is a report itself.
  bool report = 3;
}

message BacktestListFoldersResponse {
  // path is the folder listed, absolute and cleaned; empty for the drives.
  string path = 1;
  // parent is the folder above it; empty at a drive's or the root's top.
  string parent = 2;
  repeated BacktestFolderEntry folders = 3;
  // home is the user's home folder, a shortcut for the picker.
  string home = 4;
  // report: path is a report itself.
  bool report = 5;
}

message BacktestOpenFolderRequest {
  string path = 1;
}

// BacktestRunSummary is one report in a folder.
message BacktestRunSummary {
  // path is the report folder; rel_path the same below the opened folder
  // ("." for the folder itself).
  string path = 1;
  string rel_path = 2;
  // format is "run.json" (with its schema) or "legacy" (summary.txt and
  // trades.csv only: no candles or decision log).
  string format = 3;
  uint32 schema = 4;
  // kind is "run" or "portfolio".
  string kind = 5;
  string approach = 6;
  string instrument = 7;
  repeated string timeframes = 8;
  google.protobuf.Timestamp from = 9;
  google.protobuf.Timestamp to = 10;
  google.protobuf.Timestamp ran_at = 11;
  // modified is when the report's newest file was written.
  google.protobuf.Timestamp modified = 12;
  uint32 trades = 13;
  double win_rate = 14;
  // profit_factor is +Infinity with no losing trade.
  double profit_factor = 15;
  double net_profit = 16;
  double return_pct = 17;
  double max_drawdown_pct = 18;
  double start_balance = 19;
  uint32 legs = 20;
  bool has_candles = 21;
  bool has_decisions = 22;
  bool has_walk = 23;
  // problem is why the report could not be read whole (a broken
  // run.json); the rest of it may still show.
  string problem = 24;
  // candles_from is set when the report saved no candles of its own and
  // the chart uses a sibling report's ("../real"), clipped to this
  // report's range.
  string candles_from = 25;
  // paper: a Live Trading paper session (path "paper:<id>"), not a
  // backtest; status is its status (running, stopped, ...).
  bool paper = 26;
  string status = 27;
}

message BacktestOpenFolderResponse {
  string path = 1;
  repeated BacktestRunSummary runs = 2;
  // truncated: the scan stopped at its limit of folders.
  bool truncated = 3;
}

message BacktestGetRunRequest {
  string path = 1;
  // equity_points caps the equity curve sent (0: 4000). A longer curve
  // keeps each stretch's lowest and highest point, so drawdowns stay.
  uint32 equity_points = 2;
}

message BacktestHalf {
  uint32 trades = 1;
  double win_rate = 2;
  double net_profit = 3;
  double avg_r = 4;
}

message BacktestStats {
  uint32 trades = 1;
  uint32 wins = 2;
  uint32 losses = 3;
  double win_rate = 4;
  double profit_factor = 5;
  double avg_r = 6;
  double net_profit = 7;
  double gross_win = 8;
  double gross_loss = 9;
  double commission = 10;
  double swap = 11;
  double start_balance = 12;
  double end_balance = 13;
  double return_pct = 14;
  double max_drawdown = 15;
  double max_drawdown_pct = 16;
  uint32 longest_losing_streak = 17;
  BacktestHalf first_half = 18;
  BacktestHalf second_half = 19;
  map<string, uint32> skipped = 20;
}

message BacktestLeg {
  uint32 leg = 1;
  string strategy = 2;
  string instrument = 3;
  repeated string timeframes = 4;
  double risk = 5;
  map<string, double> params = 6;
  BacktestStats stats = 7;
  double contribution = 8;
  // max_open is the leg's open positions at once (run.json schema 2; 0 =
  // not given: one at a time).
  uint32 max_open = 9;
}

message BacktestCost {
  uint32 leg = 1;
  string instrument = 2;
  string spread = 3;
  string commission = 4;
  string swap = 5;
  string slippage = 6;
  repeated string overridden = 7;
  repeated string notes = 8;
}

message BacktestAccount {
  double balance = 1;
  string currency = 2;
  uint32 leverage = 3;
  uint32 max_open = 4;
  double max_open_risk = 5;
  double max_daily_loss = 6;
  string day_tz = 7;
}

message BacktestTrade {
  // index is the trade's row in trades.csv, from 0.
  uint32 index = 1;
  uint32 leg = 2;
  string strategy = 3;
  string instrument = 4;
  // side is "buy" or "sell".
  string side = 5;
  google.protobuf.Timestamp signal_time = 6;
  google.protobuf.Timestamp open_time = 7;
  google.protobuf.Timestamp close_time = 8;
  double entry = 9;
  double exit = 10;
  double stop = 11;
  double final_stop = 12;
  double target = 13;
  double lots = 14;
  double spread = 15;
  double risk = 16;
  double gross = 17;
  double commission = 18;
  double swap = 19;
  double net = 20;
  double r = 21;
  string reason = 22;
  // session is the market sessions open at the entry ("Asia", "London",
  // "New York", joined by " + "; "Off" for none): Tokyo 09-18, London
  // 08-17, New York 08-17 local time, as San Backtest's Session().
  string session = 23;
  // month is the entry's month, "2026-05" (UTC).
  string month = 24;
  // position_id and order_id are San Backtest's numbers (trades.csv's
  // position_id and order_id; 0 when the report predates them, or for a
  // market entry's order_id). Several positions may be open at once.
  uint32 position_id = 25;
  uint32 order_id = 26;
  // order_type is "market", "limit" or "stop" ("" for old reports).
  string order_type = 27;
  // tag is the pending order's tag.
  string tag = 28;
}

message BacktestMissed {
  google.protobuf.Timestamp time = 1;
  uint32 leg = 2;
  string strategy = 3;
  string instrument = 4;
  string side = 5;
  string reason = 6;
  // order_id, order_type and tag say which pending order it was (empty
  // for a market signal and for old reports).
  uint32 order_id = 7;
  string order_type = 8;
  string tag = 9;
}

message BacktestEquityPoint {
  google.protobuf.Timestamp time = 1;
  double balance = 2;
  double equity = 3;
  // drawdown_pct is how far equity is below its high so far, in percent.
  double drawdown_pct = 4;
}

message BacktestWalkWindow {
  google.protobuf.Timestamp train_from = 1;
  google.protobuf.Timestamp train_to = 2;
  google.protobuf.Timestamp test_from = 3;
  google.protobuf.Timestamp test_to = 4;
  string params = 5;
  uint32 trials = 6;
  uint32 train_trades = 7;
  double train_net = 8;
  uint32 test_trades = 9;
  double test_net = 10;
  double test_win_rate = 11;
}

message BacktestRun {
  BacktestRunSummary summary = 1;
  google.protobuf.Timestamp requested_from = 2;
  google.protobuf.Timestamp requested_to = 3;
  repeated string notes = 4;
  BacktestAccount account = 5;
  repeated BacktestCost costs = 6;
  repeated BacktestLeg legs = 7;
  map<string, double> params = 8;
  BacktestStats stats = 9;
  repeated BacktestTrade trades = 10;
  repeated BacktestMissed missed = 11;
  repeated BacktestEquityPoint equity = 12;
  // equity_total is the curve's length before equity_points cut it.
  uint32 equity_total = 13;
  repeated BacktestWalkWindow walk = 14;
  // out_of_sample is the walk-forward's test windows together (run.json
  // reports only).
  BacktestStats out_of_sample = 15;
  string walk_train = 16;
  string walk_test = 17;
  // summary_text is summary.txt as written.
  string summary_text = 18;
  // timeframes are the chart's timeframes: the step one (candles.csv)
  // and the higher ones built from it.
  repeated string chart_timeframes = 19;
}

message BacktestGetRunResponse {
  BacktestRun run = 1;
}

message BacktestGetCandlesRequest {
  string path = 1;
  // from and to limit the candles by open time (unset: all).
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  // timeframe: empty for the step timeframe, else a higher one (M30, H1,
  // H4, D1, W1, MN) built from the step candles.
  string timeframe = 4;
  // instrument picks a portfolio leg's instrument (empty: the first).
  string instrument = 5;
  // limit caps the candles sent (0: 50000); past it, the newest go.
  uint32 limit = 6;
}

message BacktestCandle {
  // time is the open time, Unix seconds UTC.
  int64 time = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  double volume = 6;
  double spread = 7;
}

message BacktestGetCandlesResponse {
  string instrument = 1;
  string timeframe = 2;
  string step_timeframe = 3;
  repeated BacktestCandle candles = 4;
  bool truncated = 5;
  // instruments are the instruments with candles in the report.
  repeated string instruments = 6;
}

message BacktestGetDecisionsRequest {
  string path = 1;
  // With around set: the limit lines nearest it, half before and half
  // after. Otherwise the lines from from to to (either may be unset).
  google.protobuf.Timestamp around = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  // limit caps the lines (0: 200, at most 5000).
  uint32 limit = 5;
  // kinds keeps only these kinds (signal, note, entry, exit, stop_move,
  // missed); empty: all.
  repeated string kinds = 6;
  // leg keeps one leg's lines when has_leg is set.
  bool has_leg = 7;
  uint32 leg = 8;
}

message BacktestDecision {
  google.protobuf.Timestamp time = 1;
  uint32 leg = 2;
  string kind = 3;
  string side = 4;
  map<string, double> details = 5;
  string reason = 6;
  // line is the line's number in decisions.jsonl, from 1.
  uint32 line = 7;
}

message BacktestGetDecisionsResponse {
  repeated BacktestDecision decisions = 1;
  // total is how many lines matched before limit.
  uint32 total = 2;
  // available: the report has a decision log (older ones do not).
  bool available = 3;
}

message BacktestListRecentFoldersRequest {}

message BacktestListRecentFoldersResponse {
  repeated string folders = 1;
}

message BacktestForgetRecentFolderRequest {
  string path = 1;
}

message BacktestForgetRecentFolderResponse {
  repeated string folders = 1;
}

message BacktestWatchFolderRequest {
  string path = 1;
}

message BacktestWatchFolderResponse {
  oneof event {
    // snapshot is every report in the folder, first.
    BacktestOpenFolderResponse snapshot = 1;
    // changed is a report that appeared or changed.
    BacktestRunSummary changed = 2;
    // removed is the path of a report that went away.
    string removed = 3;
    bool heartbeat = 4;
  }
}
