syntax = "proto3";

package san.tower.v1;

import "google/protobuf/timestamp.proto";

// BrowserRemoteService is the San Remote server the tower can run
// (golang/apps/san_remote): the hub the San Remote browser extension
// attaches to, and the Threads, X, Facebook and Vidara services a San Remote
// connection calls, at the addresses `san_remote serve` and `san_remote api`
// use. It is for when nothing else runs them, such as the tower alone on
// this machine.
service BrowserRemoteService {
  rpc GetBrowserRemote(GetBrowserRemoteRequest) returns (GetBrowserRemoteResponse);
  // SetBrowserRemoteActive starts or stops it, and saves the choice in the
  // tower's settings, so it starts with the tower or not. Starting fails,
  // and nothing is saved, when its addresses are in use (san_remote already
  // runs on this machine).
  rpc SetBrowserRemoteActive(SetBrowserRemoteActiveRequest) returns (SetBrowserRemoteActiveResponse);
}

// BrowserRemote is the server as it is now.
message BrowserRemote {
  // active: it is switched on. running: it serves now; an active one that
  // could not start when the tower started does not, and error says why.
  bool active = 1;
  bool running = 2;
  string error = 3;
  google.protobuf.Timestamp started_at = 4;
  // server_uri is the hub's URL, for the extension's Server field, and
  // api_uri the site services' URL, for a San Remote connection: where they
  // run, or will.
  string server_uri = 5;
  string api_uri = 6;
  // browsers are the browsers attached to it, or, when it does not run in
  // the tower, to the san_remote at server_uri: the longest attached first.
  repeated AttachedBrowser browsers = 7;
  // When it does not run in the tower: whether a san_remote run outside it
  // answers at server_uri (`san_remote serve`) and at api_uri
  // (`san_remote api`).
  bool server_elsewhere = 8;
  bool api_elsewhere = 9;
}

message AttachedBrowser {
  string id = 1;
  string name = 2;
  string extension_version = 3;
  google.protobuf.Timestamp attached_at = 4;
}

message GetBrowserRemoteRequest {}

message GetBrowserRemoteResponse {
  BrowserRemote remote = 1;
}

message SetBrowserRemoteActiveRequest {
  bool active = 1;
}

message SetBrowserRemoteActiveResponse {
  BrowserRemote remote = 1;
}
