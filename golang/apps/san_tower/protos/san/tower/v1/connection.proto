syntax = "proto3";

package san.tower.v1;

import "google/protobuf/timestamp.proto";

// ConnectionService keeps the tower's connections to other programs, which
// workflow steps use, in its database. The types are san_remote:
// `san_remote api`, which posts through the user's own browser,
// telegram_bot: a Telegram bot, through the Bot API, whatsapp: a
// WhatsApp account, as a device linked to it (PairWhatsApp), binance: a
// Binance USD-M futures account, through an API key, github: a GitHub
// account, through a personal access token, ssh: a server's account,
// through SSH, moviemov: an admin login on a site made from web_movie, and
// exness: an Exness trading account, through the Exness Trader API.
service ConnectionService {
  // ListConnections lists the connections by name.
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  // CreateConnection creates a connection. Names are unique.
  rpc CreateConnection(CreateConnectionRequest) returns (CreateConnectionResponse);
  // UpdateConnection replaces a connection's name and settings.
  rpc UpdateConnection(UpdateConnectionRequest) returns (UpdateConnectionResponse);
  // DeleteConnection deletes a connection. A step that uses it fails from
  // then on, saying so.
  rpc DeleteConnection(DeleteConnectionRequest) returns (DeleteConnectionResponse);
  // TestConnection checks settings, saved or not, against the other side.
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);
  // PairWhatsApp creates a WhatsApp connection by linking a device to the
  // account (the user, 2026-10-26: scan a QR code, and connected before it
  // is made). It streams QR codes to scan with the phone (WhatsApp ›
  // Linked devices › Link a device), a new one every 20 s or so, and ends
  // with the connection, created once the device is linked and connected.
  // Closing the stream before stops it, and nothing is kept.
  rpc PairWhatsApp(PairWhatsAppRequest) returns (stream PairWhatsAppResponse);
}

message Connection {
  uint32 id = 1;
  string name = 2;
  ConnectionSettings settings = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// ConnectionSettings is a connection's type, by which field is set, and that
// type's settings.
message ConnectionSettings {
  oneof type {
    SanRemoteSettings san_remote = 1;
    TelegramBotSettings telegram_bot = 2;
    WhatsAppSettings whatsapp = 3;
    BinanceSettings binance = 4;
    GitHubSettings github = 5;
    SSHSettings ssh = 6;
    MovieMovSettings moviemov = 7;
    ExnessSettings exness = 8;
  }
}

// ExnessSettings is an Exness trading account, through the Exness Trader
// API (the user, 2026-11-14: "Can we have exness ?", then yes to a Finance
// connection like Binance; golang/packages/san_exness). Exness has no test
// network: every order is real money, so the account is read only until
// allow_trading is set (the user, 2026-11-14: "A", read-only until Allow
// Trading, plus each Exness Order's limits).
message ExnessSettings {
  // api_key is the key's identifier from Key Management, exnsk-...
  string api_key = 1;
  // private_key signs the requests: Key Management's 128 hex characters,
  // or an unencrypted PKCS#8 PEM Ed25519 key. Like a MovieMov password it
  // goes in and never comes out: every connection ConnectionService gives
  // has it empty, with private_key_set true; saving one with it empty
  // keeps the saved key.
  string private_key = 2;
  // private_key_set says the saved connection has a private key. Only the
  // tower sets it.
  bool private_key_set = 3;
  // account_id is the trading account the key may use.
  string account_id = 4;
  // gateway is the host Key Management's DNS widget shows
  // (https://...), where the account's Access Point is asked once.
  string gateway = 5;
  // access_point is the account's Access Point, to skip discovery; empty
  // asks the gateway.
  string access_point = 6;
  // allow_trading lets the Exness Order, Close Position and Move Stop
  // steps trade; off, they refuse and the connection only reads.
  bool allow_trading = 7;
}

// MovieMovSettings is an admin login on a site made from web_movie
// (php/apps/web_movie: MovieMov, https://moviemov.id), whose API the MovieMov
// steps call (the user, 2026-11-08: "For login, we create new connection
// type and paste username and password and base uri"). The tower logs in
// with them itself (POST /login) and keeps the token in memory, per
// connection and login, logging in again only when the site refuses it.
message MovieMovSettings {
  // base_uri is the site's API, https://moviemov.id/api when empty; a site
  // address with no path gets /api.
  string base_uri = 1;
  // username is the admin's email, e.g. admin@moviemov.id.
  string username = 2;
  // password is the admin's password. The tower keeps it and never sends it
  // back: a connection ConnectionService returns has it empty, with
  // password_set true. Saving one with it empty keeps the saved password,
  // and TestConnection with the connection's id tests with it. Like a bot's
  // token, it stays in the tower: an export leaves connection settings
  // behind.
  string password = 3;
  // password_set says the saved connection has a password. Only the tower
  // sets it.
  bool password_set = 4;
}

// SSHSettings is an account on a server, through SSH (the user,
// 2026-10-31: "ssh session node and ssh execution node"): the SSH Session
// steps open a shell with it. It logs in with the private key when one is
// given, else with the password. The password, the key and its passphrase
// stay in the tower, as a bot's token does: an export leaves connection
// settings behind.
message SSHSettings {
  // host is the server's name or address, e.g. 192.168.1.5.
  string host = 1;
  // port is 22 when 0.
  uint32 port = 2;
  string user = 3;
  string password = 4;
  // private_key is the key's text, as its file has it (-----BEGIN OPENSSH
  // PRIVATE KEY-----...), and passphrase the passphrase it is locked with,
  // if any.
  string private_key = 5;
  string passphrase = 6;
  // host_key is the server's key, as a line of known_hosts has it without
  // the host (ssh-ed25519 AAAA...): kept the first time the tower connects,
  // after which a server that gives another key is refused. Clear it when
  // the server's key changed on purpose. A new host or port clears it.
  string host_key = 7;
}

// GitHubSettings is a GitHub account, through a personal access token (the
// user, 2026-10-31: "github connection with api key").
message GitHubSettings {
  // token is the token from GitHub (Settings › Developer settings ›
  // Personal access tokens): classic, ghp_..., or fine-grained,
  // github_pat_... Like a bot's token, it stays in the tower: an export
  // leaves connection settings behind.
  string token = 1;
}

// BinanceSettings is a Binance USD-M futures account, through an API key,
// as autotrade reaches it (the user, 2026-10-27): the Finance steps read it
// and place orders on it.
message BinanceSettings {
  string api_key = 1;
  // api_secret signs the requests. Like a bot's token, it stays in the
  // tower: an export leaves connection settings behind.
  string api_secret = 2;
  // network is testnet (testnet.binancefuture.com, the default), demo
  // (demo-fapi.binance.com, Binance's Demo Trading) or live
  // (fapi.binance.com: real money).
  string network = 3;
}

// SanRemoteSettings is a connection to `san_remote api`.
message SanRemoteSettings {
  // url is where it listens, e.g. http://127.0.0.1:7478.
  string url = 1;
  // browser is the attached browser the connection's steps drive, by its id
  // or its name in the San Remote popup (any case), e.g. "personal"; empty
  // takes the only one attached. A Chrome profile is a browser of its own,
  // with its own sign-ins, so a connection per profile is an account per
  // connection (the user, 2026-11-03: "Is San Tower accomodating that ?").
  string browser = 2;
}

// TelegramBotSettings is a Telegram bot, which the tower reads and sends
// messages as.
message TelegramBotSettings {
  // token is the bot's token from @BotFather, e.g. 123456:ABC-DEF1234.
  string token = 1;
  // allowed_users are the Telegram user ids that may use the bot, on every
  // workflow of it (the user, 2026-11-08: "a" = only listed Telegram users).
  // Someone else gets "Maaf, tidak punya akses (ID kamu: <id>)", to copy the
  // id in here. Empty: the Telegram Message triggers take every message, as
  // before the list; Telegram Command, Menu and Form refuse to run, and say
  // so.
  repeated int64 allowed_users = 2;
}

// WhatsAppSettings is a WhatsApp account, as a device linked to it, as
// WhatsApp Web is. PairWhatsApp makes it; it is never typed in, and only
// its connection's name can change. The device's keys stay in its database
// file in its storage's folder, not in the tower's database or an export.
message WhatsAppSettings {
  // jid is the linked device's: the account's number and the device's,
  // e.g. 6281234567890:12@s.whatsapp.net.
  string jid = 1;
  // phone is the account's phone number, e.g. 6281234567890.
  string phone = 2;
  // name is the account's name, as WhatsApp shows it.
  string name = 3;
  // storage_id is the storage (StorageService) whose folder has the
  // device's database (the user, 2026-10-26: a base storage, required).
  uint32 storage_id = 4;
  // database is the device's database file in that folder, one per
  // connection: the SHA-256 of the connection's name as it was made, in
  // hex, with .db (the user, 2026-10-26). A rename keeps it.
  string database = 5;
}

message ListConnectionsRequest {
  // type lists only one type's connections, e.g. "san_remote"; empty lists
  // all.
  string type = 1;
}

message ListConnectionsResponse {
  repeated Connection connections = 1;
}

message CreateConnectionRequest {
  Connection connection = 1;
}

message CreateConnectionResponse {
  Connection connection = 1;
}

message UpdateConnectionRequest {
  Connection connection = 1;
}

message UpdateConnectionResponse {
  Connection connection = 1;
}

message DeleteConnectionRequest {
  uint32 id = 1;
}

message DeleteConnectionResponse {}

message TestConnectionRequest {
  ConnectionSettings settings = 1;
  // id is the saved connection the settings are of, when they are: a secret
  // the tower does not send back (a MovieMov password) left empty is that
  // connection's.
  uint32 id = 2;
}

message TestConnectionResponse {
  // ok: the other side answered and can do its work.
  bool ok = 1;
  // message says what was found, or why it is not ok.
  string message = 2;
  // browsers, for a San Remote connection, are the attached browsers by
  // what Browser may say for each: its name, or its id when another has
  // the same name.
  repeated string browsers = 3;
}

message PairWhatsAppRequest {
  // name is the new connection's.
  string name = 1;
  // storage_id is the storage to keep the device's database in: required.
  uint32 storage_id = 2;
}

// PairWhatsAppResponse is a QR code to show, or, last, the connection.
message PairWhatsAppResponse {
  // qr_code is the code, and qr_png the same as a PNG image to show.
  string qr_code = 1;
  bytes qr_png = 2;
  // connection is set last: linked, connected and created.
  Connection connection = 3;
}
