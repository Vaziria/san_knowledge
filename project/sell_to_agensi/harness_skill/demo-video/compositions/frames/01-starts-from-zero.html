  <script>
    (function () {
      const FRAME_ID = "01-starts-from-zero";
      const DURATION = 5;
      const $ = (name) => document.querySelector("." + CSS.escape(FRAME_ID + "-" + name));

      const tl = gsap.timeline({ paused: true });

      // One beat array drives every entrance and every state swap (kinetic-beat-slam).
      // Cues: "New session." / "Your agent forgot everything." / "So you explain the project." / "Again."
      const BEATS = [0.12, 1.3, 2.9, 4.0];

      // ---- discrete-text-sequence: whole-line states at time thresholds, hard cuts ----
      const STATES = [
        { t: 0.0, el: $("s1") },
        { t: BEATS[1], el: $("s2") },
        { t: BEATS[2], el: $("s3") },
      ];
      function stateAt(time) {
        for (let i = STATES.length - 1; i >= 0; i--) {
          if (time >= STATES[i].t) return i;
        }
        return 0;
      }
      function showState(index) {
        for (let k = 0; k < STATES.length; k++) {
          STATES[k].el.style.visibility = k === index ? "visible" : "hidden";
        }
      }
      showState(0);
      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: () => showState(stateAt(driver.t + 1e-6)),
        },
        0,
      );

      // ---- Scene 1 (0.0-1.3): kicker fades in above, "New session." slams on a smooth settle ----
      tl.fromTo(
        $("kicker"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0,
      );
      tl.fromTo(
        $("spike"),
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out", transformOrigin: "50% 50%" },
        0,
      );
      tl.fromTo(
        $("new"),
        { opacity: 0, scale: 1.5, filter: "blur(16px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "power4.out" },
        BEATS[0],
      );
      tl.to(
        $("new"),
        { scale: 0.985, duration: BEATS[1] - (BEATS[0] + 0.55), ease: "sine.out" },
        BEATS[0] + 0.55,
      );

      // ---- Scene 2 (1.3-2.9): hard cut in; "forgot everything." dims to ~30%, left to right ----
      tl.fromTo(
        $("s2-inner"),
        { scale: 1.025 },
        { scale: 1, duration: BEATS[2] - BEATS[1], ease: "power2.out" },
        BEATS[1],
      );
      const letters = Array.prototype.slice.call($("forgot").children);
      const DIM_START = BEATS[1] + 0.45;
      const DIM_STEP = 0.035; // fixed per-letter offset: deterministic sweep
      const DIM_DUR = 0.4;
      letters.forEach((letter, i) => {
        tl.fromTo(
          letter,
          { opacity: 1 },
          { opacity: 0.3, duration: DIM_DUR, ease: "power1.inOut" },
          DIM_START + i * DIM_STEP,
        );
      });

      // ---- Scene 3 (2.9-5.0): hard cut to the headline; "Again." punches in at 4.0 and holds ----
      tl.fromTo(
        $("explain"),
        { scale: 1.02 },
        { scale: 1, duration: BEATS[3] - BEATS[2], ease: "power2.out" },
        BEATS[2],
      );
      tl.fromTo(
        $("again"),
        { opacity: 0, scale: 0.6, y: 30 },
        { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "expo.out" },
        BEATS[3],
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
