  <script>
    (function () {
      var ID = "03-one-graph";
      var byId = function (name) {
        return document.getElementById(ID + "-" + name);
      };
      var byClass = function (name) {
        return Array.prototype.slice.call(
          document.querySelectorAll('[class~="' + ID + "-" + name + '"]'),
        );
      };

      var tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.0-1.6s): window rises in, kicker + headline A ----------
      tl.fromTo(
        byId("win"),
        { y: 64, opacity: 0 },
        { y: 0, opacity: 1, duration: 1.0, ease: "power3.out" },
        0.05,
      );
      tl.fromTo(
        byId("plate"),
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 1.1, ease: "power2.out" },
        0.25,
      );
      tl.fromTo(
        byId("spike"),
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" },
        0.15,
      );
      tl.fromTo(
        byId("kicker-text"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.2,
      );
      tl.fromTo(
        byClass("wA"),
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.08 },
        0.45,
      );

      // ---------- Scene 2 (1.6-4.2s): chips (dynamic-content-sequencing) ----------
      // Each chip's window = BASE + chars x SEC_PER_CHAR, pre-computed once.
      var CHIP_START = 1.6;
      var BASE_DURATION = 0.5;
      var SEC_PER_CHAR = 0.03;
      var chips = byClass("chip");
      var cumulative = CHIP_START;
      var CHIP_TIMELINE = chips.map(function (el) {
        var start = cumulative;
        cumulative += BASE_DURATION + el.textContent.length * SEC_PER_CHAR;
        return { el: el, start: start };
      });
      CHIP_TIMELINE.forEach(function (entry) {
        tl.fromTo(
          entry.el,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          entry.start,
        );
      });

      // Coordinate-target zoom onto the left half of the graph canvas
      // (Engineering (+9) and Operations (+2) hexagons with their labels).
      // Screenshot is 3840x2160 shown at 1104x621 (k = 0.2875).
      // Nested wrappers: outer scales about centre, inner translates by T = -offset.
      var W = 1104;
      var H = 621;
      var K = W / 3840;
      var TARGET_SRC_X = 1760;
      var TARGET_SRC_Y = 600;
      var TARGET_OFFSET_X = TARGET_SRC_X * K - W / 2; // -46
      var TARGET_OFFSET_Y = TARGET_SRC_Y * K - H / 2; // -138
      var ZOOM_SCALE = 2.35; // effective 0.68 of source pixels: stays sharp
      var ZOOM_AT = 1.7;
      var ZOOM_DUR = 1.4;
      tl.fromTo(
        byId("zoomOuter"),
        { scale: 1 },
        { scale: ZOOM_SCALE, duration: ZOOM_DUR, ease: "power3.inOut" },
        ZOOM_AT,
      );
      tl.fromTo(
        byId("zoomInner"),
        { x: 0, y: 0 },
        { x: -TARGET_OFFSET_X, y: -TARGET_OFFSET_Y, duration: ZOOM_DUR, ease: "power3.inOut" },
        ZOOM_AT,
      );

      // ---------- Scene 3 (4.2-6.6s): "becomes one graph" + scale-swap ----------
      tl.fromTo(
        byClass("wB"),
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.09 },
        4.2,
      );
      var TRIGGER = 4.3;
      var EXIT_DUR = 0.4;
      var ENTER_DUR = 0.65;
      var OVERLAP = 0.15;
      var EXIT_SCALE = 0.72;
      tl.fromTo(
        byId("scrA"),
        { scale: 1, opacity: 1 },
        {
          scale: EXIT_SCALE,
          opacity: 0,
          duration: EXIT_DUR,
          ease: "power2.in",
          immediateRender: false,
        },
        TRIGGER,
      );
      tl.fromTo(
        byId("scrB"),
        { scale: EXIT_SCALE, opacity: 0 },
        { scale: 1, opacity: 1, duration: ENTER_DUR, ease: "power3.out" },
        TRIGGER + EXIT_DUR - OVERLAP,
      );

      // ---------- Scene 4 (6.6-9.0s): "you can see." lands, held read ----------
      tl.fromTo(
        byClass("wC"),
        { opacity: 0, y: 36 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", stagger: 0.12 },
        6.6,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
