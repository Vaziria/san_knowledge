    <script>
      (function () {
        "use strict";
        var ID = "04-answers-cite";
        var tl = gsap.timeline({ paused: true });

        function el(key) {
          return document.getElementById(ID + "-" + key);
        }
        function wordsOf(key, cue) {
          var all = el(key).getElementsByClassName(ID + "-w");
          var out = [];
          for (var i = 0; i < all.length; i++) {
            if (!cue || all[i].getAttribute("data-cue") === cue) out.push(all[i]);
          }
          return out;
        }

        // ── Camera geometry (PNG pixel space, 3840x2160; window 1264x711) ──
        // Single-wrapper camera, origin 0 0: screen = (x, y) + scale * p. A view whose left/top
        // source edge is (vx, vy) at scale S is x = -vx*S, y = -vy*S (the counter-translate).
        var WIN_H = 711;
        var BAR_H = 110; // scene 1: the window is a bar showing only the app's top bar
        var BAR_Y = (WIN_H - BAR_H) / 2; // the bar sits on the window's centre line
        var S1 = 0.97; // search box + Explain button (x 2188-3427) fill ~95% of the bar
        var VX1 = 2806 - 1264 / S1 / 2; // view centred on the input row, right edge clear of the Graph toggle
        var S_FULL = 1264 / 3840; // the whole result
        var S2 = 1.0; // match 2 at native 2x pixels (sharp)
        var VY2 = 400; // view y 400-1111: matches 1-3, match 2's path line on the centre line

        var cam = el("cam");
        var win = el("win");
        gsap.set(cam, { x: -VX1 * S1, y: 0, scale: S1, transformOrigin: "0 0", force3D: false });
        gsap.set(win, { y: BAR_Y, height: BAR_H, force3D: false });
        gsap.set(el("dim"), { opacity: 0.6 });

        // ── Scene 1 (0.0-3.0s): kicker + "Ask a question." + the search bar; the query types ──
        tl.fromTo(el("spike"), { opacity: 0, scale: 0.92, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0);
        tl.fromTo(el("ktext"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.05);
        wordsOf("hla").forEach(function (w, i) {
          tl.fromTo(w, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.08 + i * 0.07);
        });
        tl.fromTo(el("stage"), { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.12);

        // discrete-text-sequence: one state per keystroke, quicker inside words, a beat after
        // each space; the caret blinks once before typing and stays lit while typing.
        var QUERY = "why did we drop the free tier";
        var KEYS = [];
        var kt = 0.8;
        for (var i = 0; i < QUERY.length; i++) {
          if (i > 0) kt += QUERY.charAt(i - 1) === " " ? 0.095 : 0.047 + (((i * 7) % 5) - 2) * 0.004;
          KEYS.push(kt);
        }
        function typedAt(time) {
          for (var k = KEYS.length - 1; k >= 0; k--) {
            if (time >= KEYS[k]) return QUERY.slice(0, k + 1);
          }
          return "";
        }
        function caretAt(time) {
          if (time >= 2.6) return "0"; // the click takes focus off the input
          if (time >= 0.52) return "1";
          return time < 0.28 ? "1" : "0";
        }
        var qtext = el("qtext");
        var caret = el("caret");
        qtext.textContent = "";
        caret.style.opacity = "1";
        var drv = { t: 0 };
        tl.to(drv, {
          t: 10,
          duration: 10,
          ease: "none",
          onUpdate: function () {
            qtext.textContent = typedAt(drv.t);
            caret.style.opacity = caretAt(drv.t);
          },
        }, 0);

        // 2.6s: the real Explain button takes a short, smooth press
        tl.fromTo(el("btn"), { scale: 1 }, { scale: 0.93, duration: 0.09, ease: "power2.out", force3D: false, immediateRender: false }, 2.6);
        tl.fromTo(el("btn"), { scale: 0.93 }, { scale: 1, duration: 0.26, ease: "power3.out", force3D: false, immediateRender: false }, 2.69);
        // then the patch goes and the real query pixels show
        tl.fromTo(el("qfix"), { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power1.inOut", immediateRender: false }, 2.74);

        // ── Headline seams: waterfall cut (cut-catalog §4) ──
        function waterfallOut(ws, at) {
          ws.forEach(function (w, i) {
            var s = at + i * 0.022;
            tl.fromTo(w, { x: 0 }, { x: -230, duration: 0.34, ease: "power4.in", immediateRender: false }, s);
            tl.fromTo(w, { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power1.in", immediateRender: false }, s);
          });
        }
        function waterfallIn(ws, at) {
          var s = at;
          var gap = 0.05;
          ws.forEach(function (w) {
            tl.fromTo(w, { x: 230 }, { x: 0, duration: 0.3, ease: "power4.out" }, s);
            tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, s);
            s += gap;
            gap *= 0.84;
          });
        }

        // ── Scene 2 (3.0-6.4s): submit -> the window pulls back to the whole result ──
        waterfallOut(wordsOf("hla"), 2.98); // last word dies at 3.20
        waterfallIn(wordsOf("hlb", "2"), 3.2); // "Get the answer"

        // coordinate-target-zoom reversed: the bar opens into the full window while the camera
        // pulls back from the input row to the whole screenshot. One decelerating move; window
        // and camera share start, duration and ease so every pixel travels a straight line.
        tl.fromTo(win, { y: BAR_Y, height: BAR_H }, { y: 0, height: WIN_H, duration: 1.3, ease: "power3.out", force3D: false, immediateRender: false }, 3.0);
        tl.fromTo(cam, { x: -VX1 * S1, y: 0, scale: S1 }, { x: 0, y: 0, scale: S_FULL, duration: 1.3, ease: "power3.out", force3D: false, immediateRender: false }, 3.0);
        tl.fromTo(el("dim"), { opacity: 0.6 }, { opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, 3.45);

        // cue 3 appends to the same line: per-word staggered reveal, accelerating cascade
        (function () {
          var s = 4.2;
          var gap = 0.07;
          wordsOf("hlb", "3").forEach(function (w) {
            tl.fromTo(w, { x: 40 }, { x: 0, duration: 0.5, ease: "power3.out" }, s);
            tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, s);
            s += gap;
            gap *= 0.9;
          });
        })();

        // 5.0s: short zoom-to-target onto match 2 (view clamped to the PNG's left edge)
        tl.fromTo(cam, { x: 0, y: 0, scale: S_FULL }, { x: 0, y: -VY2 * S2, scale: S2, duration: 0.8, ease: "power3.inOut", force3D: false, immediateRender: false }, 5.0);

        // 5.4s: the blue rounded marker box draws around docs/product/pricing.md:15
        var mp = el("markpath");
        var len = mp.getTotalLength ? mp.getTotalLength() : 0;
        if (!len || !isFinite(len)) len = 1400;
        mp.style.strokeDasharray = len + " " + len;
        gsap.set(mp, { strokeDashoffset: len, opacity: 0 });
        tl.set(mp, { opacity: 1 }, 5.4);
        tl.fromTo(mp, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 5.4);

        // ── Scene 3 (6.4-10.0s): the agent's terminal view slides in over the right third ──
        var term = el("term");
        tl.fromTo(term, { x: 280 }, { x: 0, duration: 0.75, ease: "power3.out" }, 6.4);
        tl.fromTo(term, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 6.4);

        // terminal log append: each real line arrives whole, with a short lift
        [["l1", 6.8], ["l2", 7.2], ["l3", 7.55], ["l4", 7.95]].forEach(function (L) {
          var line = el(L[0]);
          tl.fromTo(line, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, L[1]);
          tl.fromTo(line, { y: 10 }, { y: 0, duration: 0.3, ease: "power3.out" }, L[1]);
        });

        // cue 4 at 7.0s
        waterfallOut(wordsOf("hlb"), 6.6); // 11 words, the last dies at 7.00
        waterfallIn(wordsOf("hlc"), 7.0);

        // hold from 8.6s: still

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
