        var BASE = "Annual plans get ";
        var OLD_PHRASE = "two months free (17% off)";
        var SEQUENCE = [
          { t: 0.0, b: "", a: "" },
          { t: 0.12, b: "Ann", a: "" },
          { t: 0.2, b: "Annual ", a: "" },
          { t: 0.3, b: "Annual plans ", a: "" },
          { t: 0.4, b: BASE, a: "" },
          { t: 0.5, b: BASE + "two ", a: "" },
          { t: 0.6, b: BASE + "two months ", a: "" },
          { t: 0.7, b: BASE + "two months free ", a: "" },
          { t: 0.8, b: BASE + "two months free (17% ", a: "" },
          { t: 0.9, b: BASE + OLD_PHRASE + ".", a: "" },
          { t: 1.16, b: BASE + OLD_PHRASE, a: "." }, // caret steps left, before the period
        ];
        for (var i = 1; i <= OLD_PHRASE.length; i++) {
          // held backspace, one character per ~0.021s
          SEQUENCE.push({ t: 1.32 + i * 0.021, b: BASE + OLD_PHRASE.slice(0, OLD_PHRASE.length - i), a: "." });

        [

          [2.22, "three months "],

        var afterEl = byId("typed-after");
        var caretEl = byId("caret");
        function stateAt(time) {
          for (var k = SEQUENCE.length - 1; k >= 0; k--) {
            if (time >= SEQUENCE[k].t) return SEQUENCE[k];
          }
          return SEQUENCE[0];
        }
        function renderTyping(time) {
          var s = stateAt(time);
          if (beforeEl.textContent !== s.b) beforeEl.textContent = s.b;
          if (afterEl.textContent !== s.a) afterEl.textContent = s.a;

        enter(byId("term"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 4.2);
