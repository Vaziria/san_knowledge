    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";
        var FRAME_ID = "06-work-links-in";
        // Frame-prefixed class lookups (no selector parsing: the prefix starts with a digit).
        function el(name) {
          return document.getElementsByClassName(FRAME_ID + "-" + name)[0];
        }
        function words(name) {
          return Array.prototype.slice.call(el(name).children);
        }
        var world = el("world");
        var tl = gsap.timeline({ paused: true });

        // ---- Camera (viewport-change: one world wrapper, one camera state) --------
        // The world carries translate(x, y) scale(s), origin 0 0, so capture pixel p
        // lands at window-local T + S*p, i.e. T = target - S*p. Poses are baked from
        // measured 3840x2160 capture coordinates. Window 1728x832; the card covers
        // window-local x >= 1284, y >= 412.
        var WIN_W = 1728, WIN_H = 832, IMG_W = 3840, IMG_H = 2160;
        var POSES = {
          dive: { x: 0, y: -82.83, scale: 0.668 }, // panel: tabs, title (y 204) .. References (y 1333)
          drift: { x: 0, y: -89.76, scale: 0.68 }, // near-imperceptible push toward the Done line
          graph: { x: -1643.15, y: -986, scale: 0.95 }, // task node, reference edge, domain_of to Engineering
          medium: { x: 0, y: -55.632, scale: 0.456 }, // panel + linked nodes, Engineering left of the card
        };
        function pose(name) {
          var P = POSES[name];
          return { x: P.x, y: P.y, scale: P.scale, force3D: false };
        }
        function focusOf(P) {
          return { x: (WIN_W / 2 - P.x) / P.scale, y: (WIN_H / 2 - P.y) / P.scale };
        }
        // One camera leg baked as dense keyframes: the focus point travels a straight
        // line in capture space, scale interpolates geometrically with an optional
        // mid-leg pull-back (dip), and each sample solves T = centre - S*focus, clamped
        // so the capture always covers the window. Pure arithmetic: any seek lands the
        // same pose, and both ends are the exact baked poses.
        function journey(fromName, toName, dip, steps) {
          var A = POSES[fromName], B = POSES[toName];
          var fa = focusOf(A), fb = focusOf(B);
          var xs = [], ys = [], ss = [];
          for (var i = 0; i <= steps; i++) {
            var u = i / steps;
            var s =
              Math.exp(Math.log(A.scale) * (1 - u) + Math.log(B.scale) * u) *
              (1 - dip * Math.sin(Math.PI * u));
            var fx = fa.x + (fb.x - fa.x) * u;
            var fy = fa.y + (fb.y - fa.y) * u;
            xs.push(+Math.min(0, Math.max(WIN_W - IMG_W * s, WIN_W / 2 - s * fx)).toFixed(3));
            ys.push(+Math.min(0, Math.max(WIN_H - IMG_H * s, WIN_H / 2 - s * fy)).toFixed(3));
            ss.push(+s.toFixed(5));
          }
          xs[0] = A.x; ys[0] = A.y; ss[0] = A.scale;
          xs[steps] = B.x; ys[steps] = B.y; ss[steps] = B.scale;
          return { x: xs, y: ys, scale: ss, easeEach: "none" };
        }
        gsap.set(world, { transformOrigin: "0 0" });

        // Scene 1 (0.0-2.4): already dived in on the panel; a slow drift keeps it alive.
        var driftTo = pose("drift");
        driftTo.duration = 2.4;
        driftTo.ease = "sine.inOut";
        tl.fromTo(world, pose("dive"), driftTo, 0);
        // Scene 2 (2.4-4.4): one smooth move from the References entry across to the
        // graph (slight pull-back mid-travel), landing on the task node and its edges.
        tl.to(world, { keyframes: journey("drift", "graph", 0.1, 32), duration: 2.0, ease: "power2.inOut", force3D: false, immediateRender: false }, 2.4);
        // Scene 3 (5.2-6.2): ease back to a medium framing, then held still to 8.0.
        tl.to(world, { keyframes: journey("graph", "medium", 0, 24), duration: 1.0, ease: "power2.inOut", force3D: false, immediateRender: false }, 5.2);

        // ---- Overlay card: kicker + headline (cue 1, "Finish a task") ----------------
        tl.fromTo(el("card"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
        tl.fromTo(el("spike"), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 0.12);
        tl.fromTo(words("head"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.07 }, 0.25);

        // ---- Marker underline under the Done line at 1.2s ---------------------------
        // marker-highlight's mechanic: measured getTotalLength dash reveal; the ink is
        // opacity 0 until its cue so the round cap paints no early dot. The pen carries
        // over the line wrap: segment 2 starts as segment 1 lands.
        [["ul1", 1.2, 0.4, "power2.in"], ["ul2", 1.6, 0.28, "power2.out"]].forEach(function (m) {
          var path = el(m[0]);
          var len = path.getTotalLength();
          path.style.strokeDasharray = String(len);
          gsap.set(path, { strokeDashoffset: len, opacity: 0 });
          tl.set(path, { opacity: 1 }, m[1]);
          tl.fromTo(path, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: m[2], ease: m[3] }, m[1]);
        });

        // ---- Cue 2 (2.4s): "it links itself into the graph," ------------------------
        tl.fromTo(el("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 2.3);
        tl.fromTo(words("cue2"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.06 }, 2.4);

        // svg-path-draw: the ink dashed stroke self-draws over the real reference edge
        // as the camera arrives (task node -> spec). Its solid mask stroke is revealed by
        // the measured length, so the dashes stay dashed while drawing.
        var reveal = el("refreveal");
        var lenRef = reveal.getTotalLength();
        reveal.style.strokeDasharray = String(lenRef);
        tl.fromTo(reveal, { strokeDashoffset: lenRef }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 3.85);

        // ---- Cue 3 (5.2s): "with what changed and how it was checked." --------------
        tl.fromTo(words("cue3"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.055 }, 5.2);

        tl.set({}, {}, 8); // held still to the end of the 8s frame
        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME_ID] = tl;
      })();
    </script>
