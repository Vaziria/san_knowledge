    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var ID = "08-on-agensi";
        var el = function (name) {
          return document.getElementById(ID + "-" + name);
        };
        var tl = gsap.timeline({ paused: true });
        var PERSP = 800;

        // Scene 1 (0.0-2.2s): the crane folds together piece by piece, like paper.
        // Each polygon flips in from its own hinge (rotateX / rotateY), scale 0.9 -> 1,
        // opacity 0 -> 1. Order: back wing, tail, neck and head, body, front wing last.
        var pieces = [
          ["bw1", 0.08, { rotationX: -70 }],
          ["bw2", 0.18, { rotationX: -64, rotationY: 28 }],
          ["tl1", 0.46, { rotationY: -76 }],
          ["tl2", 0.56, { rotationY: -76 }],
          ["nk1", 0.84, { rotationY: 74 }],
          ["nk2", 0.94, { rotationY: 74 }],
          ["hd", 1.06, { rotationX: -78 }],
          ["bd1", 1.22, { rotationY: -80 }],
          ["bd2", 1.32, { rotationY: 80 }],
          ["fw1", 1.58, { rotationY: -78 }],
          ["fw2", 1.68, { rotationY: 78 }],
        ];
        pieces.forEach(function (p) {
          var from = { opacity: 0, scale: 0.9, rotationX: 0, rotationY: 0, transformPerspective: PERSP };
          var k;
          for (k in p[2]) from[k] = p[2][k];
          tl.fromTo(
            el(p[0]),
            from,
            {
              opacity: 1,
              scale: 1,
              rotationX: 0,
              rotationY: 0,
              transformPerspective: PERSP,
              duration: p[0].charAt(0) === "f" ? 0.5 : 0.55,
              ease: "power3.out",
            },
            p[1],
          );
        });
        // the faint shadow settles in with the body
        tl.fromTo(
          el("shadow"),
          { opacity: 0, scaleX: 0.5 },
          { opacity: 1, scaleX: 1, duration: 0.6, ease: "power2.out" },
          1.26,
        );

        // Scene 2 (2.2-3.8s): the mark slides left while the wordmark slides out from
        // behind it. The mask's left edge rides the mark's right edge: same start,
        // duration and ease, so the two stay in lockstep (offset 352px = centred mark).
        var SHIFT = 352;
        tl.fromTo(
          el("mark"),
          { x: SHIFT },
          { x: 0, duration: 0.95, ease: "power3.inOut" },
          2.2,
        );
        tl.fromTo(
          el("wordwrap"),
          { clipPath: "inset(0px 0px 0px " + SHIFT + "px)" },
          { clipPath: "inset(0px 0px 0px 0px)", duration: 0.95, ease: "power3.inOut" },
          2.2,
        );
        tl.fromTo(
          el("word"),
          { x: -340, opacity: 0 },
          { x: 0, opacity: 1, duration: 1.0, ease: "power3.out" },
          2.25,
        );
        // life in the hold: an almost imperceptible scale-up of the lockup
        tl.fromTo(
          el("lockup"),
          { scale: 1 },
          { scale: 1.02, duration: 2.8, ease: "none" },
          3.2,
        );

        // Scene 3 (3.8-6.0s): lead line fades up, then the blue pill wipes in left to right.
        tl.fromTo(
          el("lead"),
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" },
          3.8,
        );
        tl.fromTo(
          el("pill"),
          { clipPath: "inset(0px 100% 0px 0px round 36px)" },
          { clipPath: "inset(0px 0% 0px 0px round 36px)", duration: 0.7, ease: "power2.inOut" },
          4.6,
        );
        tl.fromTo(
          el("pilltext"),
          { opacity: 0, x: -14 },
          { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" },
          4.78,
        );

        // Final frame: the only real exit, the whole frame fades to the navy ground.
        tl.fromTo(
          el("fade"),
          { opacity: 1 },
          { opacity: 0, duration: 0.5, ease: "power1.inOut" },
          5.5,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
