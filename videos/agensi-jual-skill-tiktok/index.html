<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1f2a44;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="6.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-tujuh-puluh"
        class="scene"
        data-composition-id="02-tujuh-puluh"
        data-composition-src="compositions/frames/02-tujuh-puluh.html"
        data-start="6"
        data-duration="9.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-laku-harga"
        class="scene"
        data-composition-id="03-laku-harga"
        data-composition-src="compositions/frames/03-laku-harga.html"
        data-start="15"
        data-duration="9.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-mulai"
        class="scene"
        data-composition-id="04-mulai"
        data-composition-src="compositions/frames/04-mulai.html"
        data-start="24"
        data-duration="6"
        data-track-index="1"
      ></div>

      <!-- SFX -->
      <audio
        id="el-sfx-0"
        src="assets/sfx/ting.wav"
        data-start="3.9"
        data-duration="0.45"
        data-track-index="20"
        data-volume="0.4"
      ></audio>
      <audio
        id="el-sfx-1"
        src="assets/sfx/ting.wav"
        data-start="10.2"
        data-duration="0.45"
        data-track-index="21"
        data-volume="0.4"
      ></audio>
      <audio
        id="el-sfx-2"
        src="assets/sfx/pop.wav"
        data-start="17"
        data-duration="0.18"
        data-track-index="22"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-3"
        src="assets/sfx/pop.wav"
        data-start="20.6"
        data-duration="0.18"
        data-track-index="23"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-4"
        src="assets/sfx/ting.wav"
        data-start="26.4"
        data-duration="0.45"
        data-track-index="24"
        data-volume="0.4"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 6);
        tl.fromTo("#el-02-tujuh-puluh", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 6);
        tl.to("#el-02-tujuh-puluh", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 15);
        tl.fromTo("#el-03-laku-harga", { y: 1920, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 15);
        tl.to("#el-03-laku-harga", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 24);
        tl.fromTo("#el-04-mulai", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 24);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
