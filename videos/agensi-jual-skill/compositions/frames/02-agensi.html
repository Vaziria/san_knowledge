      var ZOOM = 3.2; // row = 859px wide at peak (85% of the viewport); source res 3.8x

      tl.fromTo("#f02-w2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.9, ease: OUT }, 0.82);

      tl.fromTo("#f02-zoom-outer", { scale: 1 }, { scale: ZOOM, duration: 1.4, ease: "power3.inOut" }, 3.4);
      tl.fromTo(
        "#f02-zoom-inner",
        { x: 0, y: 0 },
        { x: -OFF_X, y: -OFF_Y, duration: 1.4, ease: "power3.inOut" },
        3.4,
      );
      tl.fromTo(
        "#f02-mark-path",
        { strokeDashoffset: 1004 },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" },
        5.0,
      );

      // ---- Scene 3 (5.6–11.0): two number-lockups count up (counting-dynamic-scale), land at 7.4 ----

      var START_SCALE = 0.5;

      var fig2 = document.getElementById("f02-fig2");

          duration: LAND - 5.6,
          ease: "power2.out",
          onUpdate: function () {
            fig1.textContent = fmt(Math.round(c1.v));

        },
        5.6,
      );
      tl.fromTo(fig1, { scale: START_SCALE }, { scale: 1, duration: LAND - 5.6, ease: "power2.out" }, 5.6);
      tl.fromTo("#f02-unit1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: OUT }, 5.75);
