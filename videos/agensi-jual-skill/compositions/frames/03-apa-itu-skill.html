  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DURATION = 12;

      // ---- Scene 1 (0.0-2.8s): window + kicker + headline ----
      tl.fromTo(
        "#f03-window",
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
        0,
      );
      // camera: push in on "What is a skill?" + its first paragraph, then hold still.
      // start shows x 410-966 / y 101-443 of the page; end shows x 425-954 / y 112-438.
      // every edge stays in white space for the whole move (banner ends at y 98.5,
      // the agent panel starts at x 977, bullet 3 ends at y 430, bullet 4 starts at y 446).
      tl.fromTo(
        "#f03-cam",
        { x: -664.2, y: -163.62, scale: 1.62 },
        { x: -722.5, y: -190.4, scale: 1.7, duration: 4, ease: "power2.out" },
        0,
      );

      tl.fromTo(
        "#f03-spike",
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out", transformOrigin: "50% 50%" },
        0.25,
      );
      tl.fromTo(
        "#f03-kicker-text",
        { opacity: 0, x: -10 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" },
        0.32,
      );
      tl.fromTo(
        ".f03-hw",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.08 },
        0.5,
      );
      tl.fromTo(
        "#f03-file",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        1.4,
      );

      // ---- Scene 2 (2.8-6.6s): SKILL.md code surface types itself; cue 1 at 4.8s ----
      tl.fromTo(
        "#f03-card",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        2.8,
      );

      // discrete-text-sequence: sparse states, reverse-searched, instant jumps.
      // Keystroke states sit on the keys.wav hits (host_sfx at 3.6s and 4.6s).
      const F = "---";
      const N = "name: cold-email-writer";
      const D = "description: Menulis cold email yang dibalas";
      const SEQUENCE = [
        { t: 0.0, text: "" },
        { t: 3.6, text: F },
        { t: 3.68, text: F + "\nn" },
        { t: 3.76, text: F + "\nname" },
        { t: 3.8, text: F + "\nname:" },
        { t: 3.88, text: F + "\nname: co" },
        { t: 3.98, text: F + "\nname: cold" },
        { t: 4.02, text: F + "\nname: cold-em" },
        { t: 4.1, text: F + "\nname: cold-email" },
        { t: 4.18, text: F + "\nname: cold-email-wr" },
        { t: 4.24, text: F + "\nname: cold-email-writ" },
        { t: 4.32, text: F + "\n" + N },
        { t: 4.6, text: F + "\n" + N + "\ndescr" },
        { t: 4.68, text: F + "\n" + N + "\ndescription: M" },
        { t: 4.76, text: F + "\n" + N + "\ndescription: Menul" },
        { t: 4.8, text: F + "\n" + N + "\ndescription: Menulis" },
        { t: 4.88, text: F + "\n" + N + "\ndescription: Menulis cold" },
        { t: 4.98, text: F + "\n" + N + "\ndescription: Menulis cold em" },
        { t: 5.02, text: F + "\n" + N + "\ndescription: Menulis cold email" },
        { t: 5.1, text: F + "\n" + N + "\ndescription: Menulis cold email ya" },
        { t: 5.18, text: F + "\n" + N + "\ndescription: Menulis cold email yang" },
        { t: 5.24, text: F + "\n" + N + "\ndescription: Menulis cold email yang diba" },
        { t: 5.32, text: F + "\n" + N + "\n" + D },
        { t: 5.62, text: F + "\n" + N + "\n" + D + "\n" + F },
      ];
      function textAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }

      const lineEls = [0, 1, 2, 3].map(function (i) {
        const el = document.getElementById("f03-l" + i);
        return {
          el: el,
          k: el.querySelector(".f03-k"),
          v: el.querySelector(".f03-v"),
          caret: el.querySelector(".f03-caret"),
        };
      });

      const CARD_IN = 2.8;
      const TYPE_START = 3.55;
      const TYPE_END = 5.9;
      const BLINK_PERIOD = 0.66; // one cycle per 0.66s, inside the 0.5-0.8s band

      function render(time) {
        const text = textAt(time);
        const lines = text.split("\n");
        const active = lines.length - 1;
        let caretOn = false;
        if (time >= CARD_IN) {
          if (time >= TYPE_START && time < TYPE_END) caretOn = true;
          else caretOn = Math.sin((2 * Math.PI * (time - CARD_IN)) / BLINK_PERIOD) >= 0;
        }
        for (let i = 0; i < lineEls.length; i++) {
          const L = lineEls[i];
          const s = i < lines.length ? lines[i] : "";
          const colon = s.indexOf(":");
          const isFence = s.charAt(0) === "-";
          L.el.classList.toggle("f03-fence", isFence);
          const key = colon >= 0 ? s.slice(0, colon + 1) : s;
          const val = colon >= 0 ? s.slice(colon + 1) : "";
          if (L.k.textContent !== key) L.k.textContent = key;
          if (L.v.textContent !== val) L.v.textContent = val;
          L.caret.style.opacity = i === active && caretOn ? "1" : "0";
        }
      }
      render(0);

      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            render(driver.t);
          },
        },
        0,
      );

      tl.fromTo(
        ".f03-c1",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.05 },
        4.8,
      );

      // ---- Scene 3 (6.6-12.0s): display-italic cue at 7.2s, marker draws at 7.6s, hold ----
      tl.fromTo(
        ".f03-c2",
        { opacity: 0, y: 36 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out", stagger: 0.09 },
        7.2,
      );
      tl.fromTo(
        "#f03-marker",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.8, ease: "power2.inOut" },
        7.6,
      );

      window.__timelines["03-apa-itu-skill"] = tl;
    })();
