  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="04-semua-agent"]');
      var q = function (sel) {
        return root.querySelector(sel);
      };

      var panel = q(".f04-panel");
      var card = q(".f04-card");
      var spike = q(".f04-spike");
      var kickerText = q(".f04-kicker-text");
      var anchor = q(".f04-anchor");
      var rule = q(".f04-rule");
      var label = q(".f04-label");

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-2.2s): the agents window fades in behind, the kicker, and the
      // anchor line lands once and pins (no movement after this entrance).
      tl.fromTo(panel, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.1, ease: "power2.out" }, 0);
      // the card is filled with the ground colour from frame one (the window never shows
      // through it); only its hairline draws in.
      tl.fromTo(
        card,
        { borderColor: "rgba(243, 242, 238, 0)" },
        { borderColor: "rgba(243, 242, 238, 0.14)", duration: 0.8, ease: "power2.out" },
        0.1,
      );
      tl.fromTo(spike, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 0.15);
      tl.fromTo(kickerText, { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.25);
      tl.fromTo(anchor, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.2);

      // Scene 2 (2.2-7.0s): discrete-text-sequence. A sparse list of { t, text } states;
      // each state shows from its t until the next one's t, swapped by an instant hard cut
      // (zero-duration sets, so every seek lands on the right state).
      var SEQUENCE = [
        { t: 2.4, text: "Claude Code" },
        { t: 3.4, text: "Cursor" },
        { t: 4.4, text: "Codex CLI" },
        { t: 5.4, text: "GitHub Copilot" },
        { t: 6.4, text: "Gemini CLI" },
      ];
      var names = root.querySelectorAll(".f04-name");
      tl.set(names, { autoAlpha: 0 }, 0);
      for (var i = 0; i < SEQUENCE.length; i++) {
        if (i > 0) tl.set(names[i - 1], { autoAlpha: 0 }, SEQUENCE[i].t);
        tl.set(names[i], { autoAlpha: 1 }, SEQUENCE[i].t);
      }

      // Scene 3 (7.0-10.0s): the slot settles on the last name (a 1px voltage rule draws
      // on beneath it), the mono line joins under the slot, then the lockup holds still.
      tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, 6.8);
      tl.fromTo(label, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 7.0);

      window.__timelines = window.__timelines || {};
