      // The capture is 3840x2160 (2x of a 1920x1080 view). The window shows it at

      // under each window px: the zoomed page stays sharp.
      var NATIVE_W = 3840;
      var WIN_W = 1440;
      var WIN_H = 810;
      var BASE = WIN_W / NATIVE_W;
      var ZOOM = 2.4;

      // Zoom centre (native px): the "Keep 70%, paid to your bank" line and its
      // description sit centred. The 1600x900 native view is nudged so its edges fall
      // in blank gaps between text rows/words (no glyph sliced at the window edge).
      var CX = 1504;
      var CY = 1295;
      // coordinate-target-zoom, nested wrappers: outer scales, inner translates by -offset.
      var OFF_X = CX * BASE - WIN_W / 2;
      var OFF_Y = CY * BASE - WIN_H / 2;

      // Marker box around the heading line, measured on the PNG:
      // glyphs span x 1122-1507, y 1330-1357 (native px); padded, clear of the icon
      // on the left (ends 1095) and the description line below (starts 1377).
      var BOX = { x0: 1104, y0: 1315, x1: 1525, y1: 1370 };
      function winX(x) {
        return WIN_W / 2 + ZOOM * (x - CX) * BASE;
      }
      function winY(y) {
        return WIN_H / 2 + ZOOM * (y - CY) * BASE;
      }
      var x0 = winX(BOX.x0);
      var x1 = winX(BOX.x1);
      var y0 = winY(BOX.y0);
      var y1 = winY(BOX.y1);
      var r = 10;
      var d =
        "M" + (x0 + r) + " " + y0 +
        " H" + (x1 - r) +
        " A" + r + " " + r + " 0 0 1 " + x1 + " " + (y0 + r) +
        " V" + (y1 - r) +
        " A" + r + " " + r + " 0 0 1 " + (x1 - r) + " " + y1 +
        " H" + (x0 + r) +
        " A" + r + " " + r + " 0 0 1 " + x0 + " " + (y1 - r) +
        " V" + (y0 + r) +
        " A" + r + " " + r + " 0 0 1 " + (x0 + r) + " " + y0 +
        " Z";
      document.getElementById("f05-marker-path").setAttribute("d", d);

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-2.6s): window centred and large, zoom to the line, marker box at 1.8s.

        "#f05-window",
        { x: 0, y: 14, scale: 0.97 },

        0
      );
      tl.fromTo(
        "#f05-zoom-outer",
        { scale: 1 },
        { scale: ZOOM, duration: 1.2, ease: "power3.inOut", force3D: false },
        0.55
      );
      tl.fromTo(
        "#f05-zoom-inner",
        { x: 0, y: 0 },
        { x: -OFF_X, y: -OFF_Y, duration: 1.2, ease: "power3.inOut", force3D: false },
        0.55
      );
      tl.fromTo(
        "#f05-marker-path",
        { opacity: 0 },
        { opacity: 1, duration: 0.06, ease: "none" },
        1.8
      );
      tl.fromTo(
        "#f05-marker-path",
        { strokeDashoffset: 1004 },
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" },
        1.8
      );

      // Scene 2 (2.6-6.0s): the window slides right to 45% width and hands the left side to 70%.

        "#f05-window",
        { x: 0, y: 0, scale: 1 },

        2.88
      );
      tl.fromTo(
        "#f05-figure",
        { scale: 1.14 },
        { scale: 1, duration: 0.2, ease: "power3.out", force3D: false },

      );
      tl.fromTo(
        "#f05-spike",

      tl.fromTo(

      tl.fromTo(

      // Scene 3 (6.0-13.0s): two short lines under the stat, then hold still.

      tl.fromTo(
