    (function () {
      var byId = function (name) {

      var tl = gsap.timeline({ paused: true });

      // ── the camera: one state, one writer ──
      // cam.s = zoom, (cam.cx, cam.cy) = the screenshot point (1x px) at the viewport centre.
      // The targets are fixed pixel positions in the PNG (measured once from the file, baked here),
      // so no layout measurement is needed. Viewport = 1158 x 676 design units.
      var world = byId("world");
      var VW = 1158;
      var VH = 676;
      var cam = { s: 0.92, cx: 860, cy: 600 };
      function applyCamera() {
        var x = VW / 2 - cam.s * cam.cx;
        var y = VH / 2 - cam.s * cam.cy;
        world.style.transform =
          "translate(calc(var(--u) * " + x.toFixed(3) + "), calc(var(--u) * " + y.toFixed(3) + ")) scale(" + cam.s.toFixed(5) + ")";
      }
      applyCamera();

      var POSE_TITLE_IN = { s: 0.92, cx: 860, cy: 600 }; // title + quick-answer box, arriving
      var POSE_TITLE = { s: 0.95, cx: 860, cy: 594 }; // title + quick-answer box, settled
      var POSE_S1 = { s: 1.65, cx: 818, cy: 775 }; // first sentence ("... sell the most")
      var POSE_S3 = { s: 1.84, cx: 824, cy: 893 }; // last sentence ("biggest untapped opportunities ..."); top edge in the gap above the box

      function leg(from, to, at, dur, ease, first) {
        tl.fromTo(
          cam,
          { s: from.s, cx: from.cx, cy: from.cy },
          { s: to.s, cx: to.cx, cy: to.cy, duration: dur, ease: ease, onUpdate: applyCamera, immediateRender: !!first },
          at
        );
      }

      // Scene 1 (0.0–2.6): the window arrives already dived onto the title + quick answer
      tl.fromTo(byId("window"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
      leg(POSE_TITLE_IN, POSE_TITLE, 0, 1.7, "power2.out", true);

      tl.fromTo(byId("spike"), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.15);
      tl.fromTo(byId("kicker-text"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.2);
      gsap.utils.toArray("#f07-h1 .f07-w").forEach(function (el, i) {
        tl.fromTo(el, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.35 + i * 0.07);
      });

      // dive onto the first sentence (hard out: fast arrival, sharp settle)
      leg(POSE_TITLE, POSE_S1, 1.7, 1.1, "power4.out");

        tl.fromTo(el, { opacity: 0, scale: 0, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.0 + i * 0.06);
