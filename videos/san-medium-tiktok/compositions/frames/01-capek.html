  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const byId = (id) => document.getElementById(id);

      const b1 = byId("01-capek-b1");
      const b2 = byId("01-capek-b2");
      const b3 = byId("01-capek-b3");
      const b4 = byId("01-capek-b4");
      const typing = byId("01-capek-typing");
      const dots = [byId("01-capek-dot1"), byId("01-capek-dot2"), byId("01-capek-dot3")];

      // Shared bubble entry: y +48, scale .94, opacity 0 -> rest, 0.35s power3.out,
      // starting exactly on the cue (sfx are mounted at these times).
      const enter = (el, at) =>
        tl.fromTo(
          el,
          { y: 48, scale: 0.94, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
          at,
        );

      // Scene 1 (0.0–0.2): header in place, thread empty.
      // Scene 2 (0.2): rina, first line.
      enter(b1, 0.2);
      // Scene 3 (1.9): rina, second line.
      enter(b2, 1.9);

      // Scene 4 (4.1–4.9): my typing indicator, dots pulsing phase-offset.
      enter(typing, 4.1);
      // Finite, timeline-driven pulse built from plain tweens (no repeat/yoyo, no callbacks):
      // each dot rises and falls on a 0.6s sine cycle, trailing the previous dot by 0.12s.
      const PULSE_START = 4.1;
      const PULSE_END = 4.9; // the pulse dies the instant the reply lands
      const HALF = 0.3;
      const LAG = 0.12;
      const REST = { y: 0, opacity: 0.35 };
      const PEAK = { y: -8, opacity: 1 };
      dots.forEach((dot, i) => {
        const t0 = PULSE_START + i * LAG;
        tl.fromTo(dot, { ...REST }, { ...PEAK, duration: HALF, ease: "sine.inOut" }, t0);
        for (let k = 1; t0 + k * HALF < PULSE_END; k++) {
          const target = k % 2 === 1 ? REST : PEAK;
          tl.to(dot, { ...target, duration: HALF, ease: "sine.inOut" }, t0 + k * HALF);
        }
      });

      // Scene 5 (4.9): the indicator is replaced in place by my bubble.
      tl.set(typing, { opacity: 0 }, 4.9);
      enter(b3, 4.9);

      // Scene 6 (6.2): my second bubble.
      enter(b4, 6.2);

      // Scene 7 (6.2–8.5): the thread holds still to the end.
      tl.set({}, {}, 8.5);

      window.__timelines["01-capek"] = tl;
    })();
  </script>
