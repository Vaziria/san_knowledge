  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME_ID = "02-satu-perintah";
      var DURATION = 6.5;

      // Cue times (Scene lines, exact).
      var T_BLINK_OFF = 0.15; // Scene 1: one finite blink at the empty prompt
      var T_TYPE_START = 0.3; // first keystroke (keys sfx mounts here)
      var T_TYPE_END = 1.2; // last keystroke
      var T_ENTER = 1.35; // command submitted: caret leaves the prompt
      var T_LOG = [1.5, 2.0, 2.5, 3.0, 4.3];
      var T_COUNT_2 = 3.4;
      var T_COUNT_3 = 3.8;
      var T_RESULT = 4.9; // result line (done sfx mounts here); hold to 6.5

      var CMD = "san_medium draft artikel.md";
      var STEP = (T_TYPE_END - T_TYPE_START) / (CMD.length - 1);

      var typedEl = document.getElementById(FRAME_ID + "-typed");
      var caretEl = document.getElementById(FRAME_ID + "-caret");
      var n1 = document.getElementById(FRAME_ID + "-n1");
      var n2 = document.getElementById(FRAME_ID + "-n2");
      var n3 = document.getElementById(FRAME_ID + "-n3");
      var logEls = [
        document.getElementById(FRAME_ID + "-log1"),
        document.getElementById(FRAME_ID + "-log2"),
        document.getElementById(FRAME_ID + "-log3"),
        document.getElementById(FRAME_ID + "-log4"),
        document.getElementById(FRAME_ID + "-log5"),
      ];
      var resultEl = document.getElementById(FRAME_ID + "-result");
      var checkPath = document.getElementById(FRAME_ID + "-checkpath");

      // One span per character of the command, hidden until its keystroke. The caret is the
      // next sibling, so it always sits right after the last typed character.
      var chars = [];
      for (var c = 0; c < CMD.length; c++) {
        var span = document.createElement("span");
        span.className = FRAME_ID + "-ch";
        span.textContent = CMD.charAt(c);
        typedEl.appendChild(span);
        chars.push(span);
      }

      var tl = gsap.timeline({ paused: true });

      // Scene 1: caret blinks once at the empty prompt (timeline-driven, finite).
      tl.set(caretEl, { opacity: 0 }, T_BLINK_OFF);
      tl.set(caretEl, { opacity: 1 }, T_TYPE_START);

      // Scene 2: discrete keystrokes at an even cadence, 0.3s -> 1.2s.
      for (var k = 0; k < chars.length; k++) {
        tl.set(chars[k], { display: "inline" }, T_TYPE_START + k * STEP);
      }

      // Enter: the command runs, the caret leaves the prompt.
      tl.set(caretEl, { opacity: 0 }, T_ENTER);

      // Scenes 3-7: log lines arrive whole, one per cue: quick fade + small rise.
      for (var i = 0; i < logEls.length; i++) {
        tl.fromTo(
          logEls[i],
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" },
          T_LOG[i],
        );
      }

      // Scene 6: the image counter swaps in place, 1 -> 2 -> 3 (discrete, no slide).
      tl.set(n1, { display: "none" }, T_COUNT_2);
      tl.set(n2, { display: "inline" }, T_COUNT_2);
      tl.set(n2, { display: "none" }, T_COUNT_3);
      tl.set(n3, { display: "inline" }, T_COUNT_3);

      // Scene 8: the draft URL line lands, its check draws in.
      tl.fromTo(
        resultEl,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" },
        T_RESULT,
      );
      tl.fromTo(
        checkPath,
        { attr: { "stroke-dashoffset": 1 } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.32, ease: "power3.out" },
        T_RESULT,
      );

      // Scene 9: still hold to the end of the frame.
      tl.set({}, {}, DURATION);

      window.__timelines["02-satu-perintah"] = tl;
    })();
  </script>
