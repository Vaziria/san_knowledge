    /* Frame 3 — Ngisi sendiri. 1080x1920, Broadside dark register; the cream editor page is

    #root {

      overflow: hidden;

    #root * {

    #root [id="03-ngisi-sendiri-page"] {

      font-size: calc(var(--u) * 28);

    }
    #root [id="03-ngisi-sendiri-saved"] {
      border-color: #e85d26;

    #root [id="03-ngisi-sendiri-check-line"] {

    /* content column x 125→905, title top y 270 */
    #root [id="03-ngisi-sendiri-col"] {

    #root [id="03-ngisi-sendiri-sub"] {
      margin-top: calc(var(--u) * 22);

    }
    #root [id="03-ngisi-sendiri-body"] {
      margin-top: calc(var(--u) * 38);
      font-weight: 400;
      font-size: calc(var(--u) * 34);
      line-height: 1.4;
      color: #111111;
    }
    #root [id="03-ngisi-sendiri-slot"] {
      position: relative;
      margin-top: calc(var(--u) * 42);
      width: calc(var(--u) * 780);
      height: calc(var(--u) * 496);
    }
    #root [id="03-ngisi-sendiri-img"] {
      position: absolute;
      left: 0;
      top: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #root [id="03-ngisi-sendiri-plus"] {
      position: absolute;
      left: 0;
      top: calc(var(--u) * -4);
      width: calc(var(--u) * 56);
      height: calc(var(--u) * 56);
      border: 1px solid #111111;
      border-radius: 50%;
    }
    #root [id="03-ngisi-sendiri-plus"]::before,
    #root [id="03-ngisi-sendiri-plus"]::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;

    }
    #root [id="03-ngisi-sendiri-plus"]::before {
      width: calc(var(--u) * 24);
      height: calc(var(--u) * 2);
      margin: calc(var(--u) * -1) 0 0 calc(var(--u) * -12);
    }
    #root [id="03-ngisi-sendiri-plus"]::after {
      width: calc(var(--u) * 2);
      height: calc(var(--u) * 24);
      margin: calc(var(--u) * -12) 0 0 calc(var(--u) * -1);
    }
    #root [id="03-ngisi-sendiri-cap"] {
      margin-top: calc(var(--u) * 24);
      font-weight: 400;
      font-size: calc(var(--u) * 28);
      line-height: 1.4;
      text-align: center;
      color: rgba(17, 17, 17, 0.55);
    }

    /* typed characters + the editor caret (one per position, switched by tl.set) */
    #root [class~="03-ngisi-sendiri-ch"],
    #root [class~="03-ngisi-sendiri-anchor"] {
      position: relative;
    }
    #root [class~="03-ngisi-sendiri-caret"] {
      position: absolute;
      left: 100%;
      top: 0.1em;
      width: calc(var(--u) * 3);
      height: 1.05em;
      margin-left: calc(var(--u) * 2);
      background: #111111;
      opacity: 0;
    }
    #root [class~="03-ngisi-sendiri-anchor"] [class~="03-ngisi-sendiri-caret"] {
      left: 0;
    }
    #root [id="03-ngisi-sendiri-sub"] [class~="03-ngisi-sendiri-caret"],
    #root [id="03-ngisi-sendiri-body"] [class~="03-ngisi-sendiri-caret"] {
      width: calc(var(--u) * 2);
      margin-left: calc(var(--u) * 3);
    }
    #root [id="03-ngisi-sendiri-title"] [id="03-ngisi-sendiri-caret-start"] {
      margin-left: 0;
      opacity: 1;
    }
  </style>

  <div data-hf-id="hf-eljv" id="root" data-composition-id="03-ngisi-sendiri" data-start="0" data-duration="6.9" data-width="1080" data-height="1920">
    <div data-hf-id="hf-r1xo" id="03-ngisi-sendiri-bg" class="clip" data-start="0" data-duration="6.9" data-track-index="0"></div>

    <div data-hf-id="hf-fdwg" id="03-ngisi-sendiri-page">
      <div data-hf-id="hf-7gl5" id="03-ngisi-sendiri-draft">Draft</div>
      <div data-hf-id="hf-86sm" id="03-ngisi-sendiri-saving" class="03-ngisi-sendiri-chip">Saving…</div>
      <div data-hf-id="hf-5x0d" id="03-ngisi-sendiri-saved" class="03-ngisi-sendiri-chip">
        <span data-hf-id="hf-ma1c">Saved</span>
        <svg data-hf-id="hf-76pe" id="03-ngisi-sendiri-check" viewBox="0 0 26 24" aria-hidden="true">
          <path data-hf-id="hf-x67q" id="03-ngisi-sendiri-check-line" d="M3 12.5 L10 19.5 L23 4.5" pathLength="1" />
        </svg>
      </div>

      <div data-hf-id="hf-jazd" id="03-ngisi-sendiri-col">
        <h1 data-hf-id="hf-rt5o" id="03-ngisi-sendiri-title">[Seri Membuat VPN Sendiri Bagian 1] Apa itu VPN (Virtual Private Network)&#160;?</h1>
        <p data-hf-id="hf-n9ng" id="03-ngisi-sendiri-sub">Sebelum membuatnya, kita pahami dulu apa yang sebenarnya dilakukan VPN.<span data-hf-id="hf-801a" class="03-ngisi-sendiri-anchor"><i data-hf-id="hf-nqnb" id="03-ngisi-sendiri-caret-sub" class="03-ngisi-sendiri-caret"></i></span></p>
        <p data-hf-id="hf-j19l" id="03-ngisi-sendiri-body">Dalam seri ini, kita membangun VPN dari nol. VPN ini adalah alat kecil yang menggabungkan komputer di rumah, di kantor, dan di sebuah VPS ke dalam satu jaringan privat.<span data-hf-id="hf-dooi" class="03-ngisi-sendiri-anchor"><i data-hf-id="hf-1wd3" id="03-ngisi-sendiri-caret-body" class="03-ngisi-sendiri-caret"></i></span></p>
        <div data-hf-id="hf-8fh1" id="03-ngisi-sendiri-slot">
          <img data-hf-id="hf-qat9" id="03-ngisi-sendiri-img" src="assets/networks-without-and-with-vpn.png" alt="Diagram: Tanpa VPN and Dengan VPN">
          <div data-hf-id="hf-matx" id="03-ngisi-sendiri-plus"></div>
        </div>
        <p data-hf-id="hf-fpx6" id="03-ngisi-sendiri-cap">Tanpa VPN, koneksi masuk berhenti di jalan. Dengan VPN, kedua PC punya alamat yang bisa saling dijangkau.</p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var P = "03-ngisi-sendiri-";
      var byId = function (name) {
        return document.getElementById(P + name);
      };
      var INK = "rgba(17,17,17,1)";
      var INK_CLEAR = "rgba(17,17,17,0)";

      // ── split the title into typed characters, each carrying its own caret ──
      var title = byId("title");
      var text = title.textContent;
      title.textContent = "";
      var start = document.createElement("span");
      start.className = P + "anchor";
      var startCaret = document.createElement("i");
      startCaret.className = P + "caret";
      startCaret.id = P + "caret-start";
      start.appendChild(startCaret);
      title.appendChild(start);
      var keys = [];
      // each word sits in a nowrap span, so the title only wraps at spaces
      // (the absolutely positioned carets otherwise let Chrome break inside a word)
      var word = null;
      for (var i = 0; i < text.length; i++) {
        var span = document.createElement("span");
        span.className = P + "ch";
        span.textContent = text.charAt(i);
        var caret = document.createElement("i");
        caret.className = P + "caret";
        span.appendChild(caret);
        if (text.charAt(i) === " ") {
          word = null;
          title.appendChild(span);
        } else {
          if (!word) {
            word = document.createElement("span");
            word.style.whiteSpace = "nowrap";
            title.appendChild(word);
          }
          word.appendChild(span);
        }
        keys.push({ ch: text.charAt(i), span: span, caret: caret });
      }

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–0.3): empty page, the caret blinks once at the title start
      tl.set(startCaret, { opacity: 0 }, 0.12);
      tl.set(startCaret, { opacity: 1 }, 0.22);
      tl.set(startCaret, { opacity: 0 }, 0.3);
      // the save chip wakes up as typing starts
      tl.fromTo(
        byId("saving"),
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power3.out" },
        0.3
      );

      // Scene 2 (0.3–1.6): one fast typing burst. Fixed weights (spaces a beat longer,
      // punctuation slightly longer) give a human cadence with no randomness.
      var T0 = 0.3;
      var T1 = 1.58;
      var weights = keys.map(function (k) {
        if (k.ch === " ") return 1.7;
        if (/[\[\]().,?]/.test(k.ch)) return 1.25;
        return 1;
      });
      var total = 0;
      for (var w = 1; w < weights.length; w++) total += weights[w];
      var at = [];
      var acc = 0;
      for (var j = 0; j < keys.length; j++) {
        if (j > 0) acc += weights[j];
        at.push(T0 + ((T1 - T0) * acc) / total);
      }
      keys.forEach(function (k, idx) {
        tl.fromTo(
          k.span,
          { color: INK_CLEAR },
          { color: INK, duration: 0.02, ease: "none" },
          at[idx]
        );
        tl.set(k.caret, { opacity: 1 }, at[idx]);
        tl.set(k.caret, { opacity: 0 }, idx < keys.length - 1 ? at[idx + 1] : 1.9);
      });

      // Scene 3 (1.9): the subtitle appears, the caret moves to its end
      tl.fromTo(
        byId("sub"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.9
      );
      tl.set(byId("caret-sub"), { opacity: 1 }, 1.9);
      tl.set(byId("caret-sub"), { opacity: 0 }, 2.5);

      // Scene 4 (2.5): the body lands at once as a pasted block (quick fade)
      tl.fromTo(
        byId("body"),
        { opacity: 0 },
        { opacity: 1, duration: 0.16, ease: "power1.out" },
        2.5
      );
      tl.set(byId("caret-body"), { opacity: 1 }, 2.5);
      tl.set(byId("caret-body"), { opacity: 0 }, 3.3);

      // Scene 5 (3.3): the "+" on the empty line; 3.7 the image drops in, the "+" goes
      tl.fromTo(
        byId("plus"),
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" },
        3.3
      );
      tl.set(byId("plus"), { opacity: 0 }, 3.7);
      tl.fromTo(
        byId("img"),
        { opacity: 0, y: 56 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
        3.7
      );

      // Scene 6 (4.5): the caption under the image
      tl.fromTo(
        byId("cap"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        4.5
      );

      // Scene 7 (5.0): SAVING… → SAVED with a fire-orange check drawn in
      tl.set(byId("saving"), { opacity: 0 }, 5.0);
      tl.fromTo(
        byId("saved"),
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        5.0
      );
      tl.fromTo(
        byId("check-line"),
        { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 0.32, ease: "power3.out" },
        5.08
      );

      // Scene 8 (5.0–6.5): hold still. Anchor so the timeline spans the full frame.
      tl.to({}, { duration: 6.5 }, 0);

      window.__timelines["03-ngisi-sendiri"] = tl;
    })();
  </script>
