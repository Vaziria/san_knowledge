  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const byId = (id) => document.getElementById(id);

      const cam = byId("04-mau-dong-cam");
      const b1 = byId("04-mau-dong-b1");
      const code = byId("04-mau-dong-code");
      const b2 = byId("04-mau-dong-b2");
      const typing = byId("04-mau-dong-typing");
      const cta = byId("04-mau-dong-cta");
      const dots = [byId("04-mau-dong-dot1"), byId("04-mau-dong-dot2"), byId("04-mau-dong-dot3")];

      // ── camera target, measured from the CTA bubble's real layout box ──────
      // offsetLeft/Top/Width/Height are layout values: no transform (the bubble's
      // own entry, or the camera itself) changes them, so this is the same at every
      // seek time once fonts are in. Target: CTA centred at x=540, y=620, its
      // scaled box inside x 40–1040 and y 380–860 (above the TikTok right rail).
      const AIM_X = 540;
      const AIM_Y = 620;
      const MAX_SCALE = 1.3;
      const MAX_BOX_W = 984; // leaves 48px clear of 40/1040 at the widest bubble
      const MAX_BOX_H = 440;
      const aim = () => {
        let x = 0;
        let y = 0;
        let el = cta;
        while (el && el !== cam) {
          x += el.offsetLeft;
          y += el.offsetTop;
          el = el.offsetParent;
        }
        const w = cta.offsetWidth;
        const h = cta.offsetHeight;
        if (el !== cam || !w || !h) return; // not laid out (hidden): keep last values
        const s = Math.min(MAX_SCALE, MAX_BOX_W / w, MAX_BOX_H / h);
        cam.style.setProperty("--cam-x", (AIM_X - s * (x + w / 2)).toFixed(2));
        cam.style.setProperty("--cam-y", (AIM_Y - s * (y + h / 2)).toFixed(2));
        cam.style.setProperty("--cam-ds", (s - 1).toFixed(4));
      };
      aim();
      if (document.fonts) {
        document.fonts.ready.then(aim);
        document.fonts.addEventListener("loadingdone", aim);
      }

      // Shared bubble entry: y +48, scale .94, opacity 0 -> rest, 0.35s power3.out,
      // starting exactly on the cue (sfx are mounted at these times).
      const enter = (el, at) =>
        tl.fromTo(
          el,
          { y: 48, scale: 0.94, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
          at,
        );

      // Scene 1 (0.0–0.3): same chat as frame 1; the carried bubble sits dimmed.
      // Scene 2 (0.3): my bubble.
      enter(b1, 0.3);
      // Scene 3 (1.1): my code bubble.
      enter(code, 1.1);
      // Scene 4 (2.4): rina.
      enter(b2, 2.4);

      // Scene 5 (3.3–4.1): my typing indicator; dots pulse phase-offset (same look
      // as frame 1: 0.6s period, 0.12s lag, lift 8px, opacity .35 -> 1). Built as
      // explicit half-cycle tweens (sine.inOut = the cosine curve), no repeat.
      enter(typing, 3.3);
      const PULSE_START = 3.3;
      const SWAP_AT = 4.1;
      const HALF = 0.3;
      const LAG = 0.12;
      const REST = { y: 0, opacity: 0.35 };
      const PEAK = { y: -8, opacity: 1 };
      dots.forEach((dot, i) => {
        for (let k = 0; ; k++) {
          const at = PULSE_START + i * LAG + k * HALF;
          if (at >= SWAP_AT) break;
          const up = k % 2 === 0;
          tl.fromTo(
            dot,
            { ...(up ? REST : PEAK) },
            { ...(up ? PEAK : REST), duration: HALF, ease: "sine.inOut", immediateRender: false },
            at,
          );
        }
      });

      // Scene 6 (4.1): the indicator is replaced in place by the CTA bubble;
      // the pulse dies with it.
      tl.set(typing, { opacity: 0 }, SWAP_AT);
      enter(cta, SWAP_AT);

      // Scene 7 (4.6–5.6): payoff push-in, the one camera move. Only --cam-p is
      // tweened; aim() re-measures as the tween initialises.
      tl.fromTo(
        cam,
        { "--cam-p": 0 },
        {
          "--cam-p": () => {
            aim();
            return 1;
          },
          duration: 1.0,
          ease: "power3.inOut",
          immediateRender: false,
        },
        4.6,
      );

      // Scene 8 (5.6–7.0): still hold to the end (final frame, no exit).

      window.__timelines["04-mau-dong"] = tl;
    })();
  </script>
