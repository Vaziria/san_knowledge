<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120f2a"/><stop offset="0.55" stop-color="#2b1b45"/><stop offset="1" stop-color="#1a1230"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7ac6" stop-opacity="0"/><stop offset="1" stop-color="#ff7ac6" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <!-- far mountains, then the big snowy one on the right -->
  <polygon points="0,520 160,430 300,480 420,410 560,470 700,420 860,480 1000,440 1280,500 1280,720 0,720" fill="#231a3d"/>
  <polygon points="760,560 1040,250 1100,300 1130,285 1280,420 1280,720 760,720" fill="#2c2550"/>
  <polygon points="1040,250 1000,300 1030,296 1052,318 1072,296 1100,300" fill="#6d64a0" opacity="0.8"/>
  <rect y="430" width="1280" height="290" fill="url(#mist)"/>
  <!-- torii, lower right -->
  <g fill="#7a1f3a">
    <rect x="1090" y="470" width="190" height="16" rx="4"/>
    <rect x="1100" y="500" width="170" height="10"/>
    <rect x="1120" y="486" width="14" height="234"/>
    <rect x="1236" y="486" width="14" height="234"/>
  </g>
  <!-- tree line -->
  <g fill="#160f26">
    <polygon points="0,720 0,600 40,560 70,600 110,540 150,600 190,570 240,620 300,590 340,640 420,610 480,660 560,640 640,690 760,660 860,700 1000,670 1080,700 1280,690 1280,720"/>
  </g>
  <!-- sakura, blurred at the corners -->
  <g filter="url(#softer)" opacity="0.75">
    <circle cx="40" cy="640" r="60" fill="#d84d8f"/><circle cx="130" cy="700" r="50" fill="#ff7ac6"/>
    <circle cx="1210" cy="660" r="70" fill="#d84d8f"/><circle cx="1110" cy="710" r="45" fill="#ff8fb8"/>
    <circle cx="1250" cy="200" r="55" fill="#b8457e"/><circle cx="20" cy="110" r="45" fill="#b8457e"/>
  </g>
  <g filter="url(#soft)" fill="#ff9cc8" opacity="0.8">
    <circle cx="90" cy="610" r="10"/><circle cx="1180" cy="620" r="12"/><circle cx="1240" cy="580" r="8"/>
    <circle cx="60" cy="680" r="9"/><circle cx="1150" cy="690" r="10"/>
  </g>
</svg>
