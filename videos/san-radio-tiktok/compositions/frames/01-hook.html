<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  var DURATION = 5;

  // ── Typing: discrete-text-sequence + context-sensitive-cursor ──
  // Every keystroke is one SEQUENCE state at a fixed time (steady speed, no randomness).
  var CMD = 'greet @kamu "enak banget!"';     // L3, typed 0.3–1.5s (~22 chars/s)
  var C6 = "# tulis komentar di live chat,";  // L6 ┐ typed 2.4–3.8s,
  var C7 = "# namamu diketik di sini";        // L7 ┘ the caret moves to L7 after L6
  var T3 = 0.3, STEP3 = 1.2 / CMD.length;
  var T_SUBMIT = 1.8;                         // caret hides, L4 appears
  var T6 = 2.4, T_DONE = 3.8;
  var STEP67 = (T_DONE - T6) / (C6.length + 1 + C7.length); // +1: the line break is a keystroke

  // State: characters shown on L3 / L6 / L7, and the line holding the caret (0 = hidden).
  var SEQUENCE = [{ t: 0, n3: 0, n6: 0, n7: 0, caret: 3 }];
  var i;
  for (i = 1; i <= CMD.length; i++) {
    SEQUENCE.push({ t: T3 + (i - 1) * STEP3, n3: i, n6: 0, n7: 0, caret: 3 });
  }
  SEQUENCE.push({ t: T_SUBMIT, n3: CMD.length, n6: 0, n7: 0, caret: 0 });
  for (i = 1; i <= C6.length; i++) {
    SEQUENCE.push({ t: T6 + (i - 1) * STEP67, n3: CMD.length, n6: i, n7: 0, caret: 6 });
  }
  SEQUENCE.push({ t: T6 + C6.length * STEP67, n3: CMD.length, n6: C6.length, n7: 0, caret: 7 });
  for (i = 1; i <= C7.length; i++) {
    SEQUENCE.push({ t: T6 + (C6.length + i) * STEP67, n3: CMD.length, n6: C6.length, n7: i, caret: 7 });
  }
  SEQUENCE.push({ t: T_DONE, n3: CMD.length, n6: C6.length, n7: C7.length, caret: 0 });

  var l3 = document.getElementById("01-hook-l3");
  var l6 = document.getElementById("01-hook-l6");
  var l7 = document.getElementById("01-hook-l7");
  var carets = [
    [3, document.getElementById("01-hook-caret3")],
    [6, document.getElementById("01-hook-caret6")],
    [7, document.getElementById("01-hook-caret7")]
  ];

  // Caret is solid on each keystroke and would blink only after BLINK_HALF of idle time — a pure
  // function of time (seek-safe). No idle stretch in this frame is that long, so it stays solid.
  var BLINK_HALF = 0.5;

  function stateAt(time) {
    for (var k = SEQUENCE.length - 1; k > 0; k--) {
      if (time >= SEQUENCE[k].t) return SEQUENCE[k];
    }
    return SEQUENCE[0];
  }

  function render(time) {
    var s = stateAt(time);
    l3.textContent = CMD.slice(0, s.n3);
    l6.textContent = C6.slice(0, s.n6);
    l7.textContent = C7.slice(0, s.n7);
    var lit = Math.floor((time - s.t) / BLINK_HALF) % 2 === 0;
    for (var c = 0; c < carets.length; c++) {
      carets[c][1].style.opacity = s.caret === carets[c][0] && lit ? "1" : "0";
    }
  }

  render(0);
  var driver = { t: 0 };
  tl.to(driver, {
    t: DURATION,
    duration: DURATION,
    ease: "none",
    onUpdate: function () { render(driver.t); }
  }, 0);

  // ── L4 "Hello, @kamu!": appears whole, 0.96→1 settle from the left, glow rises with it ──
  // (ambient-glow-bloom, bloom-and-hold: glow and line land as one beat, no breathe)
  var hello = document.getElementById("01-hook-hello");
  tl.fromTo(hello, { opacity: 0 }, { opacity: 1, duration: 0, ease: "none" }, T_SUBMIT);
  tl.fromTo(hello, { scale: 0.96 }, { scale: 1, duration: 0.5, ease: "power3.out" }, T_SUBMIT);
  tl.fromTo(hello, { "--01-hook-glow": 0 }, { "--01-hook-glow": 0.55, duration: 0.5, ease: "power2.out" }, T_SUBMIT);

  window.__timelines["01-hook"] = tl;
})();
</script>
