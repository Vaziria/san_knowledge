  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "02-neofetch";
      var tl = gsap.timeline({ paused: true });

      function el(key) {
        return document.getElementById(ID + "-" + key);
      }

      // ── Typing (discrete-text-sequence, smooth-slice form, as per-character state) ──
      // The static text is split into one span per character, with a zero-advance caret
      // slot before the first character and after every character. State k = characters
      // 1..k visible + caret slot k lit. Every change is a tl.set at a fixed time: no
      // callbacks, no clocks, so any seek (either direction) lands on the right state.
      function splitTyped(key) {
        var host = el(key);
        var text = host.textContent;
        var chars = [];
        var carets = [];
        host.textContent = "";
        function addCaret() {
          var c = document.createElement("span");
          c.className = "caret " + ID + "-cr";
          host.appendChild(c);
          carets.push(c);
        }
        addCaret();
        for (var i = 0; i < text.length; i++) {
          var s = document.createElement("span");
          s.textContent = text.charAt(i);
          host.appendChild(s);
          chars.push(s);
          addCaret();
        }
        return { chars: chars, carets: carets };
      }

      // caretOn: when the caret lands on the empty line (<= 0: already there at t=0)
      // tFirst/cps: first keystroke and a steady rate; caretOff: the line is finished
      function typeLine(key, caretOn, tFirst, cps, caretOff) {
        var p = splitTyped(key);
        var X = p.chars;
        var C = p.carets;
        gsap.set(X, { opacity: 0 });
        gsap.set(C, { opacity: 0 });
        if (caretOn <= 0) gsap.set(C[0], { opacity: 1 });
        else tl.set(C[0], { opacity: 1 }, caretOn);
        for (var k = 1; k <= X.length; k++) {
          var t = tFirst + (k - 1) / cps;
          tl.set(X[k - 1], { opacity: 1 }, t);
          tl.set(C[k - 1], { opacity: 0 }, t);
          tl.set(C[k], { opacity: 1 }, t);
        }
        tl.set(C[X.length], { opacity: 0 }, caretOff);
      }

      // Scene 1 (0.0s): caret waits after "❯ " on L1.
      // Scene 2 (0.2–0.7s): `neofetch` at 22 chars/s (last key 0.52s), Enter at 0.7s.
      typeLine("cmd", 0, 0.2, 22, 0.7);

      // Scene 3 (0.9–1.5s): the art is drawn top to bottom, one art row per step
      // (the source is 58 rows of 12px blocks, so 58 steps land on row edges).
      // waterfall-entry law: the arrival is binary, never a fade.
      tl.fromTo(
        el("art"),
        { clipPath: "polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%)" },
        { clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)", duration: 0.6, ease: "steps(58)" },
        0.9
      );

      // Scene 4 (1.6–3.2s): the info block, line by line (waterfall-entry).
      // Each line: binary opacity via tl.set, then a short power4.out whip up from below.
      // Weight sets travel/duration (anchor host line travels furthest, the dash rule is
      // light, the last line snaps); the gaps shrink so the print accelerates into the end.
      var INFO = [
        { key: "i0", at: 1.6, y: 30, d: 0.18 }, // radio@getresolved (anchor)
        { key: "i1", at: 1.89, y: 16, d: 0.11 }, // ----------------- (light)
        { key: "i2", at: 2.16, y: 24, d: 0.15 }, // OS
        { key: "i3", at: 2.41, y: 22, d: 0.14 }, // Host
        { key: "i4", at: 2.64, y: 22, d: 0.14 }, // Shell
        { key: "i5", at: 2.85, y: 20, d: 0.13 }, // Tracks
        { key: "i6", at: 3.04, y: 20, d: 0.12 }, // Now (snaps, settled by 3.16s)
      ];
      INFO.forEach(function (L) {
        var line = el(L.key);
        gsap.set(line, { opacity: 0 });
        tl.set(line, { opacity: 1 }, L.at);
        tl.fromTo(line, { y: L.y }, { y: 0, duration: L.d, ease: "power4.out" }, L.at);
      });

      // Scene 5 (3.8–5.1s): the comment types on the line after the block
      // (30 characters at 25 chars/s, last key 5.0s); the caret leaves at 5.1s.
      typeLine("note", 3.8, 3.84, 25, 5.1);

      // Scene 6 (5.1–6.0s): hold still.

      window.__timelines["02-neofetch"] = tl;
    })();
  </script>
