  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DURATION = 6;
      var EPS = 1e-6;
      var KEY = 1 / 22; // ~22 characters per second, steady

      function ms(x) { return Math.round(x * 1000) / 1000; }
      // Keystroke times: character i lands at start + i * step.
      function schedule(text, start, step) {
        var at = [];
        for (var i = 0; i < text.length; i++) at.push(ms(start + i * step));
        return at;
      }
      function typedCount(at, t) {
        var n = 0;
        while (n < at.length && t + EPS >= at[n]) n++;
        return n;
      }
      function el(name) { return document.getElementById("03-music-" + name); }

      // Scene 2 (0.2–0.7s): L1 types `eza --tree` ("eza" yellow, "--tree" white).
      var CMD1 = "eza --tree";
      var CMD1_AT = schedule(CMD1, 0.2, KEY);
      // Scene 3 (0.9s): the command is submitted; the caret hides and the tree starts.
      var ENTER1 = 0.9;
      // Scene 3 (0.9–2.1s): the tree, one whole line at a time, whipping up from below
      // (waterfall-entry: binary reveal, power4.out settle; '.' is light, the first song
      // is the anchor, gaps shrink across the cascade; last line settles at 2.065s).
      var TREE = [
        { id: "l2",  at: 0.90,  y: 32, d: 0.11 },
        { id: "l3",  at: 1.04,  y: 56, d: 0.17 },
        { id: "l4",  at: 1.18,  y: 46, d: 0.15 },
        { id: "l5",  at: 1.32,  y: 46, d: 0.15 },
        { id: "l6",  at: 1.455, y: 44, d: 0.14 },
        { id: "l7",  at: 1.585, y: 44, d: 0.14 },
        { id: "l8",  at: 1.71,  y: 44, d: 0.14 },
        { id: "l9",  at: 1.83,  y: 42, d: 0.13 },
        { id: "l10", at: 1.945, y: 40, d: 0.12 }
      ];
      // Scene 4 (2.6s): auntum.wav becomes the playing track: pink + "  ◀" (the stream's marker).
      var PLAY_AT = 2.6;
      var PLAY_FADE = 0.2;
      // Scene 5 (2.9–3.7s): L12 prompt and L13 "❯ " appear; L13 types `play auntum.wav` from 3.0s.
      var PROMPT2_AT = 2.9;
      var CMD2 = "play auntum.wav";
      var CMD2_AT = schedule(CMD2, 3.0, KEY);
      var ENTER2 = 3.7;
      // Scene 6 (4.2–5.3s): L15 types the comment. 30 characters must fit the 1.1s window,
      // so this line runs at 0.0375s per character (last keystroke 5.2875s).
      var NOTE = "# lagu ciptaan sendiri, 24 jam";
      var NOTE_START = 4.2;
      var NOTE_AT = schedule(NOTE, NOTE_START, 0.0375);
      // Scene 7 (5.3–6.0s): hold still, caret hidden.
      var NOTE_DONE = 5.3;

      var cmd1a = el("cmd1a"), cmd1b = el("cmd1b"), caret1 = el("caret1");
      var treeEls = TREE.map(function (row) { return el(row.id); });
      var playEl = el("play"), markEl = el("mark");
      var l12 = el("l12"), l13 = el("l13"), cmd2 = el("cmd2"), caret2 = el("caret2");
      var l15 = el("l15"), noteEl = el("note"), caret3 = el("caret3");

      function show(node, on) { node.style.visibility = on ? "inherit" : "hidden"; }

      // Pure function of time: identical result at any seek, in either direction.
      function render(t) {
        var n1 = typedCount(CMD1_AT, t);
        cmd1a.textContent = CMD1.slice(0, Math.min(n1, 3));
        cmd1b.textContent = n1 > 3 ? CMD1.slice(3, n1) : "";
        show(caret1, t + EPS < ENTER1);

        for (var i = 0; i < TREE.length; i++) show(treeEls[i], t + EPS >= TREE[i].at);

        markEl.textContent = t + EPS >= PLAY_AT ? "  ◀" : "";

        var prompt2 = t + EPS >= PROMPT2_AT;
        show(l12, prompt2);
        show(l13, prompt2);
        cmd2.textContent = CMD2.slice(0, typedCount(CMD2_AT, t));
        show(caret2, prompt2 && t + EPS < ENTER2);

        var noteOn = t + EPS >= NOTE_START;
        show(l15, noteOn);
        noteEl.textContent = NOTE.slice(0, typedCount(NOTE_AT, t));
        show(caret3, noteOn && t + EPS < NOTE_DONE);
      }

      var tl = gsap.timeline({ paused: true });

      // Typing / reveal driver (discrete-text-sequence, smooth-slice form; solid caret, no blink).
      var clock = { t: 0 };
      tl.to(clock, {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: function () { render(clock.t); }
      }, 0);

      // Scene 3: waterfall-entry whips (visibility is switched on by render at the same instant).
      for (var k = 0; k < TREE.length; k++) {
        tl.fromTo(treeEls[k],
          { y: TREE[k].y },
          { y: 0, duration: TREE[k].d, ease: "power4.out" },
          TREE[k].at);
      }

      // Scene 4: the playing line's colour crossfade, muted -> pink over 0.2s.
      tl.fromTo(playEl,
        { color: "#8b8fb5" },
        { color: "#ff7ac6", duration: PLAY_FADE, ease: "sine.inOut" },
        PLAY_AT);

      render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["03-music"] = tl;
    })();
  </script>
