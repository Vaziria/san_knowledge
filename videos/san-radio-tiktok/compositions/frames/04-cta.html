  <script>
    (function () {
      // Discrete states are toggled with tl.set (plain property sets, applied on every seek even when
      // the runtime suppresses callbacks). NUDGE keeps each switch off the exact frame grid
      // (24/25/30/60 fps), so a seek never lands exactly on a zero-duration set.
      var NUDGE = 0.0005;

      // Scene 2 (0.2–1.6s): L1 types "open youtube.com/@GetResolved", one character every 0.05s
      // (~20 chars/s, steady). The caret follows the last shown character.
      var TYPE_START = 0.2;
      var TYPE_STEP = 0.05;
      // Scene 3 (1.9s): the command is submitted; the caret hides and L2/L3 appear whole.
      var OUT_AT = 1.9;
      // Scene 4 (2.6–3.4s): the CTA block pushes in (scale 0.88 -> 1, opacity 0 -> 1, power3, 0.8s).
      var CTA_AT = 2.6;
      var CTA_DUR = 0.8;

      var chars = document.getElementById("04-cta-cmd").children;
      var caretEl = document.getElementById("04-cta-caret");
      var out1 = document.getElementById("04-cta-out1");
      var out2 = document.getElementById("04-cta-out2");
      var ctaEl = document.getElementById("04-cta-cta");

      var tl = gsap.timeline({ paused: true });

      for (var i = 0; i < chars.length; i++) {
        var at = Math.round((TYPE_START + i * TYPE_STEP) * 1000) / 1000 - NUDGE;
        tl.set(chars[i], { display: "inline" }, at);
      }

      tl.set(caretEl, { visibility: "hidden" }, OUT_AT - NUDGE);
      tl.set([out1, out2], { visibility: "inherit" }, OUT_AT - NUDGE);

      // The one camera move: push-in on the CTA block (spring-pop-entrance, power3.out, no overshoot).
      tl.fromTo(ctaEl,
        { scale: 0.88, opacity: 0 },
        { scale: 1, opacity: 1, duration: CTA_DUR, ease: "power3.out" },
        CTA_AT);

      // Scene 5 (3.4–7.0s): hold completely still; nothing else is scheduled.

      window.__timelines = window.__timelines || {};
      window.__timelines["04-cta"] = tl;
    })();
