  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var byId = function (name) {
        return document.getElementById("01-the-ask-" + name);
      };

      var m1 = byId("m1");
      var m2 = byId("m2");
      var m3 = byId("m3");
      var m4 = byId("m4");
      var typing = byId("typing");
      var dots = [byId("dot-1"), byId("dot-2"), byId("dot-3")];

      // Cue times (s) — exact; the orchestrator mounts SFX on them.
      var CUE_M1 = 0.2; // ting
      var CUE_M2 = 2.2; // ting
      var CUE_TYPING = 4.0;
      var CUE_M3 = 4.9; // pop — indicator replaced in place
      var CUE_M4 = 6.3; // pop — then hold still to 8.0

      // Shared bubble entry: y +48, scale 0.94, opacity 0 → rest, 0.35s power3.out.
      // transform-origin (bottom-left friend / bottom-right me) is set in CSS.
      var ENTER_DUR = 0.35;

      var tl = gsap.timeline({ paused: true });

      function enter(el, at) {
        tl.fromTo(
          el,
          { autoAlpha: 0, y: 48, scale: 0.94 },
          { autoAlpha: 1, y: 0, scale: 1, duration: ENTER_DUR, ease: "power3.out" },
          at
        );
      }

      // Scene 2 + 3: friend bubbles
      enter(m1, CUE_M1);
      enter(m2, CUE_M2);

      // Scene 4: my typing indicator, dots pulsing phase-offset (finite, timeline-driven)
      enter(typing, CUE_TYPING);

      // Each half-cycle (dim → lit, lit → dim) is its own explicit fromTo with a
      // sine.inOut ease, i.e. a raised-cosine wave: finite, no looping, no callbacks,
      // seek-safe even when the renderer suppresses events. Runs only inside the
      // 4.0–4.9s window; the indicator is hidden the instant my bubble lands.
      var PULSE_HALF = 0.3; // half period (s)
      var PULSE_STEP = 0.15; // per-dot phase offset (s)
      var DIM = { opacity: 0.3, scale: 0.8 };
      var LIT = { opacity: 1, scale: 1 };
      gsap.set(dots, DIM);
      dots.forEach(function (dot, i) {
        for (var k = 0; ; k++) {
          var at = CUE_TYPING + i * PULSE_STEP + k * PULSE_HALF;
          if (at >= CUE_M3 - 1e-6) break;
          var from = k % 2 === 0 ? DIM : LIT;
          var to = k % 2 === 0 ? LIT : DIM;
          tl.fromTo(
            dot,
            { opacity: from.opacity, scale: from.scale },
            {
              opacity: to.opacity,
              scale: to.scale,
              duration: PULSE_HALF,
              ease: "sine.inOut",
              immediateRender: false,
            },
            at
          );
        }
      });

      // Scene 5: the indicator is replaced in place by my bubble
      tl.set(typing, { autoAlpha: 0 }, CUE_M3);
      enter(m3, CUE_M3);

      // Scene 6: my second bubble; Scene 7 (6.3–8.0s) holds still
      enter(m4, CUE_M4);

      window.__timelines["01-the-ask"] = tl;
    })();
  </script>
