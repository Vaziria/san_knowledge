  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/TextPlugin.min.js"></script>
  <script>
    (function () {
      gsap.registerPlugin(TextPlugin);

      var ID = "02-the-commands";
      var DUR = 7;
      var HALF_BLINK = 0.4; // caret: 0.4s on / 0.4s off while idle, solid while typing

      var tl = gsap.timeline({ paused: true });

      function el(id) {
        return document.getElementById(ID + "-" + id);
      }

      // Each command: its prompt appears at `show`, the characters type at an even
      // cadence across [start, end], and Enter at `leave` moves the caret to the next
      // prompt. 3.48 -> 3.9 the invite command runs (its output prints at 3.6), no caret.
      var LINES = [
        { key: "l1", text: "san_vpn setup init", show: 0.0, start: 0.6, end: 1.3, leave: 1.38 },
        { key: "l2", text: "san_vpn relay run", show: 1.38, start: 1.5, end: 2.1, leave: 2.2 },
        { key: "l3", text: "san_vpn relay invite home", show: 2.2, start: 2.6, end: 3.4, leave: 3.48 },
        { key: "l5", text: "san_vpn join sanvpn1_...", show: 3.9, start: 4.3, end: 5.1, leave: 5.18 },
        { key: "l6", text: "san_vpn up", show: 5.18, start: 5.3, end: 5.8, leave: DUR },
      ];

      // Caret on/off events for one line, as [time, on] pairs (pure function of the schedule).
      function caretEvents(L) {
        var ev = [];
        function blink(from, to) {
          for (var k = 0; from + k * HALF_BLINK < to - 1e-6; k++) {
            ev.push([from + k * HALF_BLINK, k % 2 === 0]);
          }
        }
        blink(L.show, L.start); // idle at an empty prompt
        ev.push([L.start, true]); // solid while typing
        blink(L.end, L.leave); // idle after the last key
        if (L.leave < DUR) ev.push([L.leave, false]); // Enter: caret leaves this line
        return ev;
      }

      LINES.forEach(function (L) {
        var row = el(L.key);
        var caret = el(L.key + "-caret");

        // the prompt appears (one frame, effectively instant like a real terminal)
        if (L.show > 0) {
          tl.fromTo(row, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, L.show);
        }

        // discrete characters, even cadence across the typing window
        tl.to(
          el(L.key + "-txt"),
          { text: { value: L.text }, duration: L.end - L.start, ease: "none" },
          L.start,
        );

        // caret: visible by default, so only state changes are set on the timeline
        var on = true;
        caretEvents(L).forEach(function (e) {
          if (e[1] === on) return;
          on = e[1];
          tl.set(caret, { opacity: on ? 1 : 0 }, e[0]);
        });
      });

      // Step labels fade up on their cues.
      [
        { key: "step1", at: 0.4 },
        { key: "step2", at: 2.4 },
        { key: "step3", at: 4.1 },
      ].forEach(function (S) {
        tl.fromTo(
          el(S.key),
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
          S.at,
        );
      });

      // The invite string prints under `san_vpn relay invite home`.
      tl.fromTo(el("out"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out" }, 3.6);

      // Pin the timeline length to the frame (the hold runs to 7.0s).
      tl.set({}, {}, DUR);

      window.__timelines[ID] = tl;
    })();
  </script>
