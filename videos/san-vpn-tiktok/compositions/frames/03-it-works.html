  <script>
    (function () {
      var FID = "03-it-works";
      var el = function (name) {
        return document.getElementById(FID + "-" + name);
      };

      var ORANGE = "#E85D26";
      var HINT = "#505048";
      var DURATION = 6;

      var tl = gsap.timeline({ paused: true });

      // ---- Scene cue times (exact, from the Scene lines) ----
      var S_CMD = "san_vpn status";
      var S_T0 = 0.2; // Scene 2: typing starts (sfx keys @0.2)
      var S_T1 = 0.8; //          last character lands
      var S_OUT = 1.0; // Scene 3: output begins, status caret leaves
      var P_CMD = "ping office.vpn";
      var P_ON = 1.9; // ping prompt + caret appear (one blink before typing)
      var P_T0 = 2.4; // Scene 4: typing starts (sfx keys @2.4)
      var P_T1 = 3.0; //          last character lands
      var P_OUT = 3.3; // Scene 5: first reply (sfx done @3.3), ping caret leaves
      var BLINK = 0.5; // caret period: on for the first half, off for the second

      var sTyped = el("s-typed");
      var sCaret = el("s-caret");
      var pLine = el("p-cmd");
      var pTyped = el("p-typed");
      var pCaret = el("p-caret");

      // Discrete, even keystrokes: first character at t0, last at t1.
      function typedAt(text, t, t0, t1) {
        var n = text.length;
        if (t < t0) return "";
        if (t >= t1) return text;
        var k = 1 + Math.floor(((t - t0) / (t1 - t0)) * (n - 1) + 1e-6);
        return text.slice(0, Math.min(n, k));
      }
      function blinkOn(t, from) {
        return (t - from) % BLINK < BLINK / 2;
      }
      // Every discrete state (typed text, caret, prompt) is a pure function of time: seek-safe.
      function render(t) {
        var s = typedAt(S_CMD, t, S_T0, S_T1);
        if (sTyped.textContent !== s) sTyped.textContent = s;
        var sOn;
        if (t >= S_OUT) sOn = false;
        else if (t >= S_T0 && t < S_T1) sOn = true; // solid while typing
        else sOn = blinkOn(t, t < S_T0 ? 0 : S_T1);
        sCaret.style.opacity = sOn ? "1" : "0";

        pLine.style.opacity = t >= P_ON ? "1" : "0";
        var p = typedAt(P_CMD, t, P_T0, P_T1);
        if (pTyped.textContent !== p) pTyped.textContent = p;
        var pOn;
        if (t < P_ON || t >= P_OUT) pOn = false;
        else if (t >= P_T0 && t < P_T1) pOn = true; // solid while typing
        else pOn = blinkOn(t, t < P_T0 ? P_ON : P_T1);
        pCaret.style.opacity = pOn ? "1" : "0";
      }

      var clock = { t: 0 };
      tl.to(
        clock,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            render(clock.t);
          },
        },
        0,
      );

      // ---- Scene 3 (1.0–1.8s): receipt cascade — rows slide up + fade, staggered ----
      var RISE = 22;
      [
        ["s-row1", 1.0],
        ["s-row2", 1.15],
        ["s-row3", 1.3],
        ["s-row4", 1.45],
      ].forEach(function (r) {
        tl.fromTo(el(r[0]), { opacity: 0, y: RISE }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, r[1]);
      });
      // each state word flips from pending (cream-hint) to done (fire-orange) once its row lands
      [
        ["s-state1", 1.22],
        ["s-state3", 1.52],
        ["s-state4", 1.67],
      ].forEach(function (r) {
        tl.fromTo(el(r[0]), { color: HINT }, { color: ORANGE, duration: 0.12, ease: "power3.out" }, r[1]);
      });

      // ---- Scene 5 (3.3 / 3.7 / 4.1s): replies arrive, each closes with a drawn fire-orange check ----
      var CHECK_LEN = 35; // path length 11.3 + 22.6 = 33.9, rounded up
      [
        ["p-reply1", "p-check1", 3.3],
        ["p-reply2", "p-check2", 3.7],
        ["p-reply3", "p-check3", 4.1],
      ].forEach(function (r) {
        tl.fromTo(el(r[0]), { opacity: 0, y: RISE }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, r[2]);
        var path = el(r[1]);
        path.style.strokeDasharray = CHECK_LEN + " " + CHECK_LEN;
        tl.fromTo(path, { strokeDashoffset: CHECK_LEN }, { strokeDashoffset: 0, duration: 0.2, ease: "power3.out" }, r[2] + 0.08);
      });

      // ---- Scene 6 (4.3–4.9s): one small punch-in toward the ping card (coordinate-target-zoom) ----
      // Nested wrappers: outer scales about the canvas centre (540, 960); inner translates T = -offset.
      // A gentle pan (T = (0, -40)) so the status card stays in frame above the ping card.
      // Peak: status card top at y≈30, ping card bottom at y≈1464; text stays left of x≈610.
      var ZOOM_AT = 4.3;
      var ZOOM_DUR = 0.6;
      var ZOOM_SCALE = 1.12;
      tl.fromTo(
        el("zoom-outer"),
        { scale: 1 },
        { scale: ZOOM_SCALE, duration: ZOOM_DUR, ease: "power3.inOut", force3D: false },
        ZOOM_AT,
      );
      tl.fromTo(
        el("zoom-inner"),
        { x: 0, y: 0 },
        { x: 0, y: -40, duration: ZOOM_DUR, ease: "power3.inOut", force3D: false },
        ZOOM_AT,
      );
      // Scene 7 (4.9–6.0s): still hold — nothing moves after the punch-in settles.

      render(0);
      window.__timelines["03-it-works"] = tl;
    })();
  </script>
