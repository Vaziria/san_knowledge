  <script>
    (function () {
      var ID = "04-mau-dong";
      window.__timelines = window.__timelines || {};

      function $(id) {
        return document.getElementById(ID + "-" + id);
      }

      var cam = $("cam");
      var b2 = $("b2");
      var b3 = $("b3");
      var cta = $("cta");
      var typing = $("typing");
      var dots = [$("tdot1"), $("tdot2"), $("tdot3")];

      // ── Payoff target: measure the CTA bubble's real layout box in camera-layer
      // coordinates, once, before any tween touches it. offset* values are layout values,
      // so a scaled preview stage or the clip gate (visibility) cannot skew them. Every
      // bubble has fixed lines and the CTA a fixed width, so the box does not depend on
      // whether the webfont has finished loading.
      function boxIn(node, ancestor) {
        var x = 0;
        var y = 0;
        var n = node;
        while (n && n !== ancestor) {
          x += n.offsetLeft;
          y += n.offsetTop;
          n = n.offsetParent;
        }
        return { x: x, y: y, w: node.offsetWidth, h: node.offsetHeight, ok: n === ancestor && node.offsetWidth > 0 };
      }

      // Same box from the layout numbers, used only if the frame is not laid out yet.
      var LINE = 46 * 1.28; // bubble line box
      var PAD_Y = 52; // 26px top + bottom
      var GAP = 26;
      var fallback = {
        x: 907 - 778,
        y: 330 + (PAD_Y + LINE) + GAP + (PAD_Y + 3 * LINE) + GAP + (PAD_Y + 2 + 2 * LINE) + GAP,
        w: 778,
        h: PAD_Y + 3 * LINE,
      };

      var box = boxIn(cta, cam);
      if (!box.ok) box = fallback;

      // Land the whole box inside x 40–1040, y 380–860 (clear of TikTok's right rail and
      // bottom UI), horizontally centred. Scale ~1.3×, capped so the box keeps a margin.
      var SAFE = { x0: 40, x1: 1040, y0: 380, y1: 860 };
      var EDGE = 12;
      var ZOOM = Math.min(1.3, (SAFE.x1 - SAFE.x0 - 2 * EDGE) / box.w, (SAFE.y1 - SAFE.y0 - 2 * EDGE) / box.h);
      var DEST_X = (SAFE.x0 + SAFE.x1) / 2;
      var DEST_Y = (SAFE.y0 + SAFE.y1) / 2;
      // cam scales about (0,0): screen = (x, y) + ZOOM * point, so the CTA centre lands on DEST.
      var CAM_X = DEST_X - ZOOM * (box.x + box.w / 2);
      var CAM_Y = DEST_Y - ZOOM * (box.y + box.h / 2);

      var tl = gsap.timeline({ paused: true });

      // Bubble entry: from y +48, scale 0.94, opacity 0 → rest, 0.35s power3.out,
      // starting exactly on the cue (transform-origin bottom-right / bottom-left in CSS).
      function enterFrom() {
        return { y: 48, scale: 0.94, opacity: 0 };
      }
      function enterTo() {
        return { y: 0, scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" };
      }

      // Scene 1 (0.0–0.3): the chat holds, the carried bubble dimmed (CSS).

      // Scene 2 (0.3): my bubble — the key benefit.
      tl.fromTo(b2, enterFrom(), enterTo(), 0.3);

      // Scene 3 (1.9): dimas wants it.
      tl.fromTo(b3, enterFrom(), enterTo(), 1.9);

      // Scene 4 (3.0–3.8): my typing indicator; the three dots pulse, phase-offset.
      tl.fromTo(typing, enterFrom(), enterTo(), 3.0);

      var PULSE_AT = 3.0;
      var PULSE_DUR = 0.8; // dies the instant the CTA lands
      var PERIOD = 0.6;
      var pulse = { p: 0 };
      function paintDots() {
        for (var i = 0; i < dots.length; i++) {
          var k = 0.5 + 0.5 * Math.sin(pulse.p - i * (Math.PI / 2)); // wave dot 1 → 3
          dots[i].style.opacity = (0.3 + 0.7 * k).toFixed(3);
          dots[i].style.transform = "scale(" + (0.78 + 0.22 * k).toFixed(3) + ")";
        }
      }
      paintDots();
      tl.fromTo(
        pulse,
        { p: 0 },
        {
          p: Math.PI * 2 * (PULSE_DUR / PERIOD),
          duration: PULSE_DUR,
          ease: "none",
          onUpdate: paintDots,
        },
        PULSE_AT,
      );

      // Scene 5 (3.8): the indicator is replaced in place by the CTA bubble.
      tl.set(typing, { opacity: 0 }, 3.8);
      tl.fromTo(cta, enterFrom(), enterTo(), 3.8);

      // Scene 6 (4.4–5.4): the payoff push-in — the video's one camera move.
      tl.fromTo(
        cam,
        { x: 0, y: 0, scale: 1, transformOrigin: "0px 0px" },
        { x: CAM_X, y: CAM_Y, scale: ZOOM, transformOrigin: "0px 0px", duration: 1.0, ease: "power3.inOut" },
        4.4,
      );

      // Scene 7 (5.4–7.0): still hold to the end (final frame, no exit).
      tl.set({}, {}, 7.0);

      window.__timelines["04-mau-dong"] = tl;
    })();
  </script>
