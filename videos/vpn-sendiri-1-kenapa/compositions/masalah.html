  <style>

    @font-face { font-family: "Barlow"; font-weight: 700; font-display: block; src: url("assets/fonts/barlow-latin-700-normal.woff2") format("woff2"); }
    @font-face { font-family: "Barlow"; font-weight: 800; font-display: block; src: url("assets/fonts/barlow-latin-800-normal.woff2") format("woff2"); }

    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }

    .orange { background: #e85d26; color: #111111; }
    .chrome { position: absolute; top: 170px; font-family: "IBM Plex Mono"; font-weight: 500; font-size: 24px;
      letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
    .chrome.l { left: 59px; }
    .chrome.r { right: 59px; }
    .dark .chrome { color: #888880; }
    .orange .chrome { color: rgba(17, 17, 17, 0.92); }
    .stage { position: absolute; left: 59px; top: 300px; width: 842px; height: 1200px; display: flex;
      flex-direction: column; justify-content: center; align-items: flex-start; }
    .kicker { display: block; font-family: "IBM Plex Mono"; font-weight: 500; font-size: 30px; letter-spacing: 0.14em;
      text-transform: uppercase; color: #e85d26; margin-bottom: 34px; white-space: nowrap; }
    .orange .kicker { color: rgba(17, 17, 17, 0.92); }
    .w { display: block; font-family: "Barlow"; font-weight: 900; line-height: 0.92; letter-spacing: -0.035em; white-space: nowrap; }
    .h1 { font-weight: 800; letter-spacing: -0.03em; }

    .note { display: block; margin-top: 40px; font-family: "IBM Plex Mono"; font-weight: 500; font-size: 28px;
      letter-spacing: 0.14em; text-transform: uppercase; color: #888880; white-space: nowrap; }
    .orange .note { color: rgba(17, 17, 17, 0.7); }
    .lead { display: block; margin-top: 44px; width: 842px; font-family: "Barlow"; font-weight: 700; font-size: 46px; line-height: 1.2; }
    .orange .lead { color: rgba(17, 17, 17, 0.8); }
    .lead b { font-weight: 900; color: #111111; }

  <div id="root" data-composition-id="masalah" data-start="0" data-duration="7.2" data-width="1080" data-height="1920">
    <div id="m1" class="clip beat dark" data-start="0" data-duration="2" data-track-index="0">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var $ = function (id) { return document.getElementById(id); };

      // m1: kicker snaps in, the question slams with scale + blur
      tl.fromTo($("m1k"), { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 0.05);
      tl.fromTo([$("m1a"), $("m1b")], { scale: 1.35, filter: "blur(14px)", opacity: 0, transformOrigin: "0% 50%" },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out", stagger: 0.12 }, 0.1);
      // m2: hard flash on orange, each word lands with a short shake
      function shake(el, at, dir) {
        tl.fromTo(el, { x: 46 * dir, rotation: -3 * dir, transformOrigin: "0% 100%" }, { x: -22 * dir, rotation: 1.5 * dir, duration: 0.08, ease: "power2.out" }, at);
        tl.to(el, { x: 10 * dir, rotation: -0.6 * dir, duration: 0.08, ease: "power2.inOut" }, at + 0.08);
        tl.to(el, { x: 0, rotation: 0, duration: 0.12, ease: "power2.out" }, at + 0.16);
      }
      shake($("m2a"), 2, 1);
      shake($("m2b"), 2.06, -1);
      // m3: side snaps from opposite edges
      tl.fromTo($("m3a"), { x: -300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 3.65);
      tl.fromTo($("m3b"), { x: 320, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 3.85);
      // m4: heavy rise, then the accent word scales up
      tl.fromTo($("m4a"), { y: 90, rotation: 4, opacity: 0, transformOrigin: "0% 100%" }, { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "circ.out" }, 5.45);
      tl.fromTo($("m4b"), { scale: 0.55, opacity: 0, transformOrigin: "0% 60%" }, { scale: 1, opacity: 1, duration: 0.5, ease: "power4.out" }, 5.7);
      tl.set({}, {}, 7.2);
      window.__timelines["masalah"] = tl;
    })();
  </script>
